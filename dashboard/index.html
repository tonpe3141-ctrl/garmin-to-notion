<script>
(function () {
  const D = DATA;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const vClass = { "◎": "v-good", "○": "v-good", "△": "v-warn", "✕": "v-crit" };
  // 休養日の "—" は警告色ではなく薄い字で出す
  const vcls = (v) => vClass[v] || (v === "—" || !v ? "v-rest" : "v-warn");
  const JUDGED = ["◎", "○", "△", "✕"];
  const stateName = { good: "良好", ok: "良好", warn: "要調整", crit: "要注意" };
  const toneMark = { good: "○", bad: "△", note: "・" };
  const DOW = ["日", "月", "火", "水", "木", "金", "土"];

  /* ---------- ペース帯・心拍上限（docs/athlete_profile.md のペースゾーン定義から） ----------
     R 3:35〜3:45 / T 3:58〜4:08 / M 4:15〜4:25 / E 5:30〜6:00。
     ラップの色分けは帯と帯の中間を境にする（秒/km）:
       R|T = 3:52 (232) / T|M = 4:12 (252) / M|E = 4:58 (298)
     プロファイルのゾーンを引き直したら、ここも一緒に直すこと。 */
  const ZONE_EDGE = { r: 232, t: 252, m: 298 };
  const zoneOf = (sec) => sec <= ZONE_EDGE.r ? "z-r" : sec <= ZONE_EDGE.t ? "z-t" : sec <= ZONE_EDGE.m ? "z-m" : "z-e";
  const HR_CAPS = [{ hr: 167, label: "M上限" }, { hr: 176, label: "T上限" }];
  /* 持続力 … 4:25/km（Mペース帯の上限）以内のラップが何本続いたか。ラップは1kmなので本数≒km。

     有酸素の効率 … Eだけの日の、E帯（5:30〜6:00/km）のラップの平均心拍。1本目（アップ）は除く。 */
  const M_EDGE = 265, STRIDE_EDGE = 200, E_BAND = [330, 360];

  // ---------- 日付と数値の小道具 ----------
  const dateOf = (s) => { const m = String(s || "").match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : null; };
  const isoAdd = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const mondayOf = (iso) => isoAdd(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
  const dowOf = (iso) => DOW[new Date(iso + "T00:00:00Z").getUTCDay()];
  const mdOf = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
  const numOf = (v) => { const m = String(v == null ? "" : v).match(/\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
  const numsOf = (v) => (String(v == null ? "" : v).match(/\d+(\.\d+)?/g) || []).map(Number);
  const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  const secOf = (s) => { const p = String(s || "").split(":").map(Number); return p.length > 1 && p.every(isFinite) ? p.reduce((a, v) => a * 60 + v, 0) : null; };
  const hmsOf = (s) => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const mmssOf = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  const gapOf = (s) => `${Math.floor(s / 60)}分${String(s % 60).padStart(2, "0")}秒`;
  const kmFmt = (v) => (Math.round(v * 10) / 10).toFixed(1);

  const dataDay = (D.today && D.today.date) || dateOf(D.meta && D.meta.generatedAt);
  // 閲覧時点の JST の日付（時計が分析日より前なら分析日に合わせる）
  const viewDay = (() => {
    const now = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    return dataDay && now < dataDay ? dataDay : now;
  })();
  /* 分析は毎日12:00に作られる。翌朝（tomorrow.date の日）に開いたときは、
     「明日のメニュー」が今日これから走る練習になるので、ホームの先頭に出して呼び方も変える。
       same    … 分析した日のうちに見ている
       morning … 翌日（tomorrow.date）に見ている
       stale   … それより後。更新が止まっている */
  const MODE = (() => {
    const tm = D.tomorrow && D.tomorrow.date;
    if (!tm || viewDay < tm) return "same";
    return viewDay === tm ? "morning" : "stale";
  })();
  const daysTo = (iso) => (iso ? Math.max(0, dayDiff(viewDay, iso)) : "—");

  // 長いレース名をチップ用に縮める（例: 水戸黄門漫遊マラソン → 水戸黄門）
  const shortRace = (n) => String(n || "").replace(/[（(][^）)]*[）)]/g, "").replace(/(漫遊)?マラソン.*$/, "").replace(/なのはな$/, "").trim() || n;

  // スマホでは横スクロールさせずに1画面へ収める。viewBox を狭くして
  // その分だけ SVG 内の文字を大きめの単位で描く（描画後の実寸は約10〜11px）。
  const narrowMQ = window.matchMedia("(max-width: 640px)");
  let NARROW = narrowMQ.matches;
  const fs = (desktop, mobile) => NARROW ? mobile : desktop;

  const prose = (label, v) => {
    const t = String(v == null ? "" : v).trim();
    return t ? `<div class="blk"><b>${esc(label)}</b><p class="lead">${esc(t)}</p></div>` : "";
  };

  /* ---------- ラップのグラフ ---------- */
  function lapChart(laps) {
    if (!laps || !laps.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 230 : 250;
    const padL = NARROW ? 26 : 44, padR = NARROW ? 16 : 46;
    const padT = 16, padB = NARROW ? 34 : 38;
    const iw = W - padL - padR, ih = H - padT - padB;
    // 本数が多いとラベルが潰れるので、狭い画面では間引く
    const stride = Math.max(1, Math.ceil(laps.length / (NARROW ? 6 : 24)));
    const secs = laps.map(l => l.sec);
    const hrs = laps.map(l => l.hr).filter(h => h != null);
    const sMin = Math.min(...secs), sMax = Math.max(...secs);
    const sLo = sMin - (sMax - sMin) * 0.25 - 6;
    const sHi = sMax + (sMax - sMin) * 0.12 + 6;
    const hLo = hrs.length ? Math.min(...hrs) - 12 : 0;
    const hHi = hrs.length ? Math.max(...hrs) + 12 : 1;
    const bw = iw / laps.length;
    const barW = Math.min(bw * 0.62, 42);
    const labelled = (i) => i % stride === 0 || i === laps.length - 1;
    // 心拍ラベルのY座標を先に出しておく（ペースラベルとの衝突判定に使う）
    const hrY = laps.map(l => l.hr == null ? null : padT + ih - ((l.hr - hLo) / (hHi - hLo)) * ih);
    // ペースのバー（速いほど高い）
    const bars = laps.map((l, i) => {
      const t = (sHi - l.sec) / (sHi - sLo);
      const h = Math.max(3, t * ih);
      const x = padL + bw * i + (bw - barW) / 2;
      const y = padT + ih - h;
      const zone = zoneOf(l.sec);
      // 心拍ラベルと重なる位置ならペースは出さない（バーの高さが残るので情報は失われない）
      const clash = hrY[i] != null && labelled(i) && Math.abs((y - 6) - (hrY[i] - 10)) < (NARROW ? 16 : 14);
      const show = labelled(i) && !clash;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--${zone})" opacity=".88"><title>Lap ${l.n} — ${esc(l.pace)}/km, HR ${l.hr ?? "-"}</title></rect>
        ${show ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" class="c-pace">${esc(l.pace)}</text>` : ""}`;
    }).join("");
    const pts = laps.map((l, i) => hrY[i] == null ? null : [padL + bw * i + bw / 2, hrY[i], l.hr, i]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const dots = pts.map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${NARROW ? 2.8 : 3.6}" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/>
       ${labelled(p[3]) ? `<text x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" class="c-hr">${p[2]}</text>` : ""}`).join("");
    const xlab = laps.map((l, i) => labelled(i)
      ? `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 12 : 14)}" class="c-ax">${l.n}</text>` : "").join("");
    // 心拍の上限線（M上限167 / T上限176）。描画範囲に入るときだけ引き、超えた本が一目で分かるようにする
    const hrRef = hrs.length ? HR_CAPS.filter(c => c.hr > hLo && c.hr < hHi).map(c => {
      const y = padT + ih - ((c.hr - hLo) / (hHi - hLo)) * ih;
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
        <text x="${W - padR}" y="${(y - 3).toFixed(1)}" class="c-ref">${c.label} ${c.hr}</text>`;
    }).join("") : "";
    const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    return `<div class="chart-legend">
        <span><i style="background:var(--z-r)"></i>R域 〜${mmss(ZONE_EDGE.r)}</span>
        <span><i style="background:var(--z-t)"></i>T域 〜${mmss(ZONE_EDGE.t)}</span>
        <span><i style="background:var(--z-m)"></i>M域 〜${mmss(ZONE_EDGE.m)}</span>
        <span><i style="background:var(--z-e)"></i>E域</span>
        <span><i style="background:var(--crit);border-radius:50%"></i>心拍 bpm</span>
        <span class="ref">破線 = 心拍上限 ／ 横軸 = ラップ番号</span>
      </div>
      <div class="chart-scroll"><svg class="laps" viewBox="0 0 ${W} ${H}" role="img" aria-label="ラップごとのペースと心拍">
        <style>
          .c-pace{font-family:var(--mono);font-size:${fs(11, 13)}px;fill:var(--ink-2);text-anchor:middle}
          .c-hr{font-family:var(--mono);font-size:${fs(10.5, 12.5)}px;fill:var(--crit);text-anchor:middle;font-weight:500}
          .c-ax{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-3);text-anchor:middle}
          .c-side{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3)}
          .c-ref{font-family:var(--mono);font-size:${fs(9.5, 10.5)}px;fill:var(--crit);text-anchor:end;opacity:.85}
        </style>
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <text x="${NARROW ? 2 : 6}" y="${padT + 10}" class="c-side">速い</text>
        <text x="${NARROW ? 2 : 6}" y="${padT + ih}" class="c-side">遅い</text>
        ${bars}${hrRef}
        <path d="${path}" fill="none" stroke="var(--crit)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}${xlab}
      </svg></div>`;
  }

  /* ---------- グラフの元データ（ラップ一覧） ----------
     グラフのラベルは間引かれるうえ、バーの高さだけではラップタイムが読めない。
     開閉状態は key ごとに覚えておき、画面幅の切り替えによる再描画でも閉じないようにする。 */
  const lapOpen = new Set();
  const ZONES = [{ cls: "z-r", name: "R" }, { cls: "z-t", name: "T" }, { cls: "z-m", name: "M" }, { cls: "z-e", name: "E" }];
  // 域ごとの心拍上限（M上限167 / T上限176）。超えたラップの心拍を赤字にする
  const capOf = { "z-m": HR_CAPS[0].hr, "z-t": HR_CAPS[1].hr };
  function lapTable(laps, key) {
    if (!laps || !laps.length) return "";
    const zoneName = (cls) => ZONES.find(z => z.cls === cls).name;
    const sum = ZONES.map(z => {
      const ls = laps.filter(l => zoneOf(l.sec) === z.cls);
      if (!ls.length) return "";
      const hs = ls.map(l => l.hr).filter(h => h != null);
      const avgSec = ls.reduce((a, l) => a + l.sec, 0) / ls.length;
      const avgHr = hs.length ? Math.round(avg(hs)) : null;
      return `<span><i class="zn" style="background:var(--${z.cls})"></i>${z.name}域 ${ls.length}本 平均 <b>${mmssOf(avgSec)}</b>/km${avgHr != null ? ` ／ HR <b>${avgHr}</b>` : ""}</span>`;
    }).join("");
    const rows = laps.map(l => {
      const z = zoneOf(l.sec);
      const over = l.hr != null && capOf[z] != null && l.hr > capOf[z];
      return `<tr><td>${esc(l.n)}</td><td><i class="zn" style="background:var(--${z})"></i>${zoneName(z)}</td>
        <td>${esc(l.pace || mmssOf(l.sec))}</td>
        <td class="${over ? "over" : ""}">${l.hr ?? "—"}${over ? ` <span class="d">&gt;${capOf[z]}</span>` : ""}</td></tr>`;
    }).join("");
    return `<details class="lapdata" data-lap="${esc(key)}" ${lapOpen.has(key) ? "open" : ""}>
        <summary>ラップ一覧（ペース・心拍）<em>${laps.length}本</em></summary>
        <div class="lapsum">${sum}</div>
        <table class="laptbl"><thead><tr><th>Lap</th><th>域</th><th>ペース /km</th><th>心拍 bpm</th></tr></thead><tbody>${rows}</tbody></table>
      </details>`;
  }

  /* ---------- コンディションのグラフ ----------
     睡眠と HRV は別々のグラフにする。1枚に重ねると凡例がどちらの系列のものか分かりにくくなる。
     トレーニング準備度は睡眠とHRVの合成スコアなのでグラフにはしない（同じ情報を二重に数える）。 */
  const chartCss = () => `
    .k-sl{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-2);text-anchor:middle}
    .k-sl.short{fill:var(--warn);font-weight:500}
    .k-hrv{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink);text-anchor:middle;font-weight:500}
    .k-ax{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3);text-anchor:middle}
    .k-band{font-family:var(--mono);font-size:${fs(9.5, 10.5)}px;fill:var(--ink-3);text-anchor:end}`;
  const hhmm = (m) => `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, "0")}m`;
  // スマホでは「7h13m」だと幅が足りないので「7:13」に縮める
  const hshort = (m) => NARROW ? `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}` : hhmm(m);
  const dayLabel = (d) => NARROW ? `${String(d.d).split("/").pop()}(${d.dow})` : `${d.d}(${d.dow})`;

  function sleepChart(h) {
    const days = (h && h.days) || [];
    if (!days.some(d => d.sleepMin != null)) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 200 : 206;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26, padT = 22, padB = NARROW ? 26 : 30;
    const iw = W - padL - padR, ih = H - padT - padB, base = padT + ih;
    const target = h.sleepTargetMin ?? 420;
    const max = Math.max(...days.map(d => d.sleepMin || 0), target) * 1.14;
    const y = (m) => base - (m / max) * ih;
    const bw = iw / days.length, barW = Math.min(bw * 0.5, 36);
    const layers = [{ key: "sleepDeep", label: "深い", op: 1 }, { key: "sleepRem", label: "REM", op: .58 }, { key: "sleepLight", label: "浅い", op: .26 }];
    const bars = days.map((d, i) => {
      const total = d.sleepMin;
      if (total == null) return "";
      const x = padL + bw * i + (bw - barW) / 2;
      const parts = layers.filter(l => d[l.key] != null);
      let acc = 0;
      const segs = (parts.length ? parts : [{ key: null, label: "睡眠", op: .7 }]).map(l => {
        const v = l.key ? d[l.key] : total;
        const yTop = y(acc + v), hgt = Math.max(1, y(acc) - yTop - 1);
        acc += v;
        return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" fill="var(--accent)" opacity="${l.op}"><title>${esc(d.d)} ${l.label} ${hhmm(v)}</title></rect>`;
      }).join("");
      return segs + `<text x="${(x + barW / 2).toFixed(1)}" y="${(y(total) - 6).toFixed(1)}" class="k-sl${total < target ? " short" : ""}">${hshort(total)}</text>`;
    }).join("");
    const xlab = days.map((d, i) => `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 8 : 10)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");
    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--accent)"></i>深い睡眠</span>
        <span><i style="background:var(--accent);opacity:.58"></i>REM睡眠</span>
        <span><i style="background:var(--accent);opacity:.26"></i>浅い睡眠</span>
        <span class="ref">破線 = 目標 ${hhmm(target)}</span>
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近7日の睡眠時間と内訳">
        <style>${chartCss()}</style>
        <line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${padL}" y1="${y(target).toFixed(1)}" x2="${W - padR}" y2="${y(target).toFixed(1)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>
        <text x="${padL - 5}" y="${(y(target) + 3).toFixed(1)}" class="k-band">${hshort(target)}</text>
        ${bars}${xlab}
      </svg></div></div>`;
  }

  function hrvChart(h) {
    const days = (h && h.days) || [];
    const hrvs = days.map(d => d.hrv).filter(v => v != null);
    if (!hrvs.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 142 : 150;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26, padT = 20, padB = NARROW ? 24 : 28;
    const iw = W - padL - padR, ih = H - padT - padB;
    const bl = h.baseline || {};
    const lo = Math.min(...hrvs, bl.hrvLow ?? Infinity) - 8;
    const hi = Math.max(...hrvs, bl.hrvHigh ?? -Infinity) + 8;
    const y = (v) => padT + ih - ((v - lo) / (hi - lo)) * ih;
    const bw = iw / days.length;
    const band = (bl.hrvLow != null && bl.hrvHigh != null)
      ? `<rect x="${padL}" y="${y(bl.hrvHigh).toFixed(1)}" width="${iw}" height="${(y(bl.hrvLow) - y(bl.hrvHigh)).toFixed(1)}" fill="var(--accent)" opacity=".08"/>
         <text x="${padL - 5}" y="${(y(bl.hrvHigh) + 4).toFixed(1)}" class="k-band">${bl.hrvHigh}</text>
         <text x="${padL - 5}" y="${(y(bl.hrvLow) + 4).toFixed(1)}" class="k-band">${bl.hrvLow}</text>` : "";
    const pts = days.map((d, i) => d.hrv == null ? null : [padL + bw * i + bw / 2, y(d.hrv), d.hrv]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const low = (v) => bl.hrvLow != null && v < bl.hrvLow;
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--surface)" stroke="${low(p[2]) ? "var(--warn)" : "var(--accent)"}" stroke-width="2"/>
       <text x="${p[0].toFixed(1)}" y="${(p[1] - 9).toFixed(1)}" class="k-hrv">${p[2]}</text>`).join("");
    const xlab = days.map((d, i) => `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 7 : 9)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");
    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--accent);border-radius:50%"></i>HRV 前夜平均 ms</span>
        ${bl.hrvLow != null ? `<span class="ref">帯 = バランス域 ${bl.hrvLow}–${bl.hrvHigh}（下抜けた点は橙）</span>` : ""}
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近7日のHRVの推移">
        <style>${chartCss()}</style>
        ${band}
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>
        ${dots}${xlab}
      </svg></div></div>`;
  }

  // 歩数はこの値以上の日を色で立てる（走行込み）。19,000〜23,000歩の日に BB最低が 11〜14 まで落ちていたため
  const STEPS_HIGH = 18000;
  function condTable(days, bl) {
    const num = (v) => v == null ? "—" : `${v}`;
    const hm = (m) => m == null ? "—" : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
    const stepsOf = (v) => v == null ? "—" : NARROW ? `${(v / 1000).toFixed(1)}k` : Number(v).toLocaleString("en-US");
    const lowHrv = bl && bl.hrvLow != null ? bl.hrvLow : null;
    const target = (bl && bl.sleepTargetMin) || 420;
    const hasSteps = days.some(d => d.steps != null);
    const rows = days.map(d => `<tr>
        <td>${esc(d.d)}(${esc(d.dow)})</td>
        <td>${num(d.sleep)}</td>
        <td class="${d.sleepMin != null && d.sleepMin < target ? "lo" : ""}">${hm(d.sleepMin)}</td>
        <td class="${d.hrv != null && lowHrv != null && d.hrv < lowHrv ? "lo" : ""}">${num(d.hrv)}</td>
        <td>${num(d.rhr)}</td>
        <td class="${d.bbLow != null && d.bbLow < 20 ? "lo" : ""}">${num(d.bbLow)}</td>
        <td>${num(d.stress)}</td>
        <td class="${d.readiness != null && d.readiness < 50 ? "lo" : ""}">${num(d.readiness)}</td>
        ${hasSteps ? `<td class="${d.steps != null && d.steps >= STEPS_HIGH ? "lo" : ""}">${stepsOf(d.steps)}</td>` : ""}
      </tr>`).join("");
    return `<div class="htab-scroll"><table class="htab">
      <thead><tr><th>日付</th><th>睡眠</th><th>睡眠時間</th><th>HRV</th><th>安静心拍</th><th>BB最低</th><th>ストレス</th><th>準備度</th>${hasSteps ? "<th>歩数</th>" : ""}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  /* ---------- 共通の部品 ---------- */
  function segTable(segs) {
    if (!segs || !segs.length) return "";
    return `<div class="segs">${segs.map(x => {
      const meta = [x.pace && x.pace !== "—" ? `${x.pace} /km` : null, x.hr && x.hr !== "—" ? `HR ${x.hr}` : null].filter(Boolean).join("　");
      return `<div class="segrow">
        <span class="tp ${esc(x.zone || "E")}">${x.zone === "rest" ? "休" : esc(x.zone || "E")}</span>
        <span class="seg-n">${esc(x.label || "")}</span>
        <span class="seg-k">${numOf(x.km) ? `${esc(x.km)}<em>km</em>` : "—"}</span>
        ${meta ? `<span class="seg-m">${esc(meta)}</span>` : ""}
        ${x.note ? `<span class="seg-o">${esc(x.note)}</span>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  function statsGrid(stats) {
    if (!stats || !stats.length) return "";
    return `<div class="stats">${stats.map(s => `<div class="stat ${s.state === "ok" ? "" : esc(s.state)}">
        <div class="stat-l">${esc(s.label)}</div>
        <div class="stat-v">${esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
        <div class="stat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
      </div>`).join("")}</div>`;
  }

  function pointsList(pts) {
    if (!pts || !pts.length) return "";
    return `<ul class="pts">${pts.map(p => `<li class="pt ${esc(p.tone || "note")}">
        <span class="pt-i">${toneMark[p.tone] || toneMark.note}</span>
        <span class="pt-l">${esc(p.label)}</span>
        <span class="pt-t">${esc(p.text)}</span>
      </li>`).join("")}</ul>`;
  }

  // 履歴のラップは "sec:hr,sec:hr,…" の1行で持つ。ペースは秒から復元できるので保存しない
  function expandLaps(v) {
    if (Array.isArray(v)) return v;
    if (typeof v !== "string" || !v) return [];
    return v.split(",").map((pair, i) => {
      const parts = pair.split(":");
      const sec = Number(parts[0]);
      if (!isFinite(sec) || sec <= 0) return null;
      const hr = parts[1] === "" || parts[1] == null ? null : Number(parts[1]);
      return { n: i + 1, sec, pace: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`, hr: isFinite(hr) ? hr : null };
    }).filter(Boolean);
  }

  /* ---------- 履歴（Artifact の db） ----------
     過去分は DATA に持たせない。持たせると Routine が毎日その全部を書き直すことになり、
     日を追うごとに生成コストが増え続けるため。db に1日1件だけ書き、ページ側が開いたときに読む。 */
  const HIST_DAYS = 150;
  let histRows = null;            // db から読んだ過去エントリ
  let histState = "loading";      // loading / ready / off / error
  let calSel = null;              // カレンダーで開いている日付
  let calWeeks = 6;               // カレンダーに出している週数
  let archShow = 8;               // 読みものの記録に出している件数

  // 今日の分は db への書き込みを待たずに DATA から組み立てる。同じ日の2本目以降は today.extra[]
  function todayRows() {
    const t = D.today || {};
    if (!t.date) return [];
    const toRow = (run, seq) => {
      const pick = (label) => { const s = (run.stats || []).find(x => x.label === label); return s ? s.value : null; };
      return {
        d: t.date, dow: t.dow, seq, type: run.type, verdict: run.verdict, verdictLabel: run.verdictLabel,
        km: pick("距離"), pace: pick("平均ペース"), hr: pick("平均心拍"),
        headline: run.headline, points: run.points || [], stats: run.stats || [], effect: run.effect || "", laps: run.laps || [],
        pred: seq === 1 && fit().race ? fit().race.full || null : null
      };
    };
    return [toRow(t, 1)].concat((Array.isArray(t.extra) ? t.extra : []).map((r, i) => toRow(r, i + 2)));
  }
  const fit = () => (D.health && D.health.fitness) || {};

  async function loadHistory() {
    try {
      const use = window.claude && window.claude.use;
      const db = use ? await window.claude.use("db") : null;
      if (!db) { histState = "off"; paintAsync(); return; }
      const snap = await db.collection("runs").orderBy("d", "desc").limit(HIST_DAYS).get();
      histRows = snap.docs.map(x => x.data()).filter(Boolean);
      histState = "ready";
    } catch (e) {
      histState = "error";
    }
    paintAsync();
  }

  function streakOf(laps) {
    let best = null, cur = [];
    const flush = () => {
      if (cur.length && (!best || cur.length > best.km)) {
        const hs = cur.map(l => l.hr).filter(h => h != null);
        best = { km: cur.length, sec: Math.round(avg(cur.map(l => l.sec))), hr: hs.length ? Math.round(avg(hs)) : null };
      }
      cur = [];
    };
    laps.forEach(l => { if (l.sec >= STRIDE_EDGE && l.sec <= M_EDGE) cur.push(l); else flush(); });
    flush();
    return best;
  }
  function eEffOf(laps) {
    // 質練習を含む日（Mペース帯より速いラップがある日）は除く。本セット後のEラップは心拍が高止まりするため
    if (laps.some(l => l.sec >= STRIDE_EDGE && l.sec <= ZONE_EDGE.m)) return null;
    const ls = laps.slice(1).filter(l => l.sec >= E_BAND[0] && l.sec <= E_BAND[1] && l.hr != null);
    return ls.length >= 3 ? { hr: Math.round(avg(ls.map(l => l.hr)) * 10) / 10, sec: Math.round(avg(ls.map(l => l.sec))), n: ls.length } : null;
  }
  // 練習種別 → ゾーン。履歴の type は自由記述なので文字で判定し、決め手がなければラップから推す
  function zoneOfType(type, laps) {
    const s = String(type || "");
    if (/^休養/.test(s)) return "rest";
    if (/閾値|Tペース|（T）|テンポ/.test(s)) return "T";
    if (/インターバル|レペ|Rペース/.test(s)) return "R";
    if (/M|マラソン|ロング.*後半/.test(s)) return "M";
    const st = laps && laps.length ? streakOf(laps) : null;
    if (st && st.km >= 2) return st.sec <= ZONE_EDGE.t ? "T" : "M";
    return "E";
  }

  // 今日（DATA）と履歴（db）を合わせた走行記録。古い順。
  function allRuns() {
    const todays = todayRows();
    const todayD = todays.length ? todays[0].d : null;
    const rows = todays.concat((histRows || []).filter(h => h && h.d && h.d !== todayD));
    return rows.map(h => {
      const laps = expandLaps(h.laps);
      return { d: h.d, seq: h.seq || 1, km: Number(h.km) || 0, verdict: h.verdict, type: h.type || "",
        pred: secOf(h.pred), laps, streak: laps.length ? streakOf(laps) : null, eff: laps.length ? eEffOf(laps) : null, raw: h };
    }).sort((a, b) => a.d.localeCompare(b.d) || a.seq - b.seq);
  }

  const phaseAt = (iso) => ((D.season && D.season.phases) || []).find(p => p.from <= iso && iso <= p.to) || null;

  // Mペースの持続力: 記録上の最長と、いま狙う到達目標
  function mStatus(runs, today) {
    const withStreak = runs.filter(r => r.streak && r.streak.km >= 2);
    // 同じ長さなら 4:15 に近いほう（閾値走より M 走を代表にする）、それも同じなら新しいほう
    const best = withStreak.slice().sort((a, b) => b.streak.km - a.streak.km
      || Math.abs(a.streak.sec - 255) - Math.abs(b.streak.sec - 255) || (a.d < b.d ? 1 : -1))[0] || null;
    const targets = (D.season && D.season.mTargets) || [];
    const bestBy = (iso) => Math.max(0, ...withStreak.filter(r => r.d <= iso).map(r => r.streak.km));
    const curT = targets.find(t => t.until >= today) || null;
    const nextT = curT ? targets[targets.indexOf(curT) + 1] || null : null;
    const aimT = curT && bestBy(today) >= curT.km ? (nextT || curT) : curT;
    const recent = withStreak.filter(r => dayDiff(r.d, today) < 14);
    return { withStreak, best, targets, bestBy, curT, aimT, recentBest: recent.length ? Math.max(...recent.map(r => r.streak.km)) : 0 };
  }

  // ヒーローに出す「記録上の最長を更新」。事実だけを出す（評価を甘くしない）
  function pbHtml() {
    if (histState !== "ready" || !D.today || !D.today.date) return "";
    const runs = allRuns();
    const mine = runs.filter(r => r.d === D.today.date);
    const before = runs.filter(r => r.d < D.today.date && r.streak);
    const s = mine.map(r => r.streak).filter(Boolean).sort((a, b) => b.km - a.km)[0];
    if (!s || s.km < 3 || !before.length) return "";
    const prev = Math.max(...before.map(r => r.streak.km));
    if (s.km < prev) return "";
    return `<span class="pb">🏅 ${s.km > prev ? "記録上の最長を更新" : "記録上の最長に並んだ"}：4:25以内を <b>${s.km}km</b> 連続（平均 ${mmssOf(s.sec)}${s.hr ? `・HR${s.hr}` : ""}）</span>`;
  }

  /* ======================================================================
     ホーム
     ====================================================================== */
  function goalBlock() {
    const r = D.race;
    if (!r) return "";
    const ph = phaseAt(viewDay);
    const phName = ph ? ph.name : (D.phase && D.phase.name) || "";
    const phLeft = ph ? dayDiff(viewDay, ph.to) + 1 : null;
    return `<section class="goal" aria-label="目標レースまで">
      <div class="goal-main">
        <span class="goal-days">${daysTo(r.date)}</span><span class="goal-unit">日</span>
        <div class="goal-txt"><span class="goal-name">${esc(r.name)}まで</span>
          <span class="goal-aim">目標 <b>${esc(r.goal)}</b>（${esc(r.pace)}）・${esc(r.date)}</span></div>
      </div>
      <div class="goal-chips">
        ${D.tuneup && D.tuneup.name ? `<span class="chip">🏁 ${esc(shortRace(D.tuneup.name))} あと<b>${daysTo(D.tuneup.date)}</b>日</span>` : ""}
        ${phName ? `<span class="chip">${esc(phName.replace(/—/g, "").replace(/\s+/g, " "))}${phLeft ? `・残り<b>${phLeft}</b>日` : ""}</span>` : ""}
      </div>
    </section>`;
  }

  // ホームに出す主要な数値は4つ。距離・ペース・心拍に、警告の付いた指標を1つ足す（無ければ4番目）
  function keyStats(stats) {
    if (!stats || !stats.length) return [];
    const base = ["距離", "平均ペース", "平均心拍"].map(l => stats.find(s => s.label === l)).filter(Boolean);
    const rest = stats.filter(s => !base.includes(s));
    const flag = rest.find(s => s.state === "crit") || rest.find(s => s.state === "warn") || rest[0];
    return base.concat(flag ? [flag] : []).slice(0, 4);
  }

  function runCard() {
    const t = D.today;
    if (!t || !t.date) return "";
    const kicker = MODE === "same" ? "今日の走り" : MODE === "morning" ? "昨日の走り" : `${mdOf(t.date)} の走り`;
    const ks = keyStats(t.stats);
    const kmStat = (t.stats || []).find(s => s.label === "距離");
    const extras = Array.isArray(t.extra) ? t.extra : [];
    return `<section class="card run" data-today="${esc(t.date)}">
      <div class="run-head">
        <div class="run-id">
          <span class="kicker">${esc(kicker)}</span>
          <div class="run-line"><span class="run-date">${mdOf(t.date)}<em>(${esc(t.dow)})</em></span><span class="run-type">${esc(t.type)}</span></div>
        </div>
        <div class="verdict ${vcls(t.verdict)}" aria-label="総合評価 ${esc(t.verdict)} ${esc(t.verdictLabel)}"><span class="vm">${esc(t.verdict)}</span><span class="vl">${esc(t.verdictLabel)}</span></div>
      </div>
      <div class="card-body">
        <p class="headline">${esc(t.headline)}</p>
        ${t.plan && t.plan.title ? `<div class="planline">処方 <b>${esc(t.plan.title)}</b>${numOf(t.plan.km) && !/km/.test(t.plan.title) ? `（${esc(t.plan.km)}km）` : ""}<span class="arrow">→</span>実走 <b>${kmStat ? esc(kmStat.value) + "km" : "なし"}</b></div>` : ""}
        <span class="hero-pb" id="pb">${pbHtml()}</span>
        ${ks.length ? `<div class="kstats">${ks.map(s => `<div class="kstat ${s.state === "ok" ? "" : esc(s.state)}">
            <div class="kstat-l">${esc(s.label)}</div>
            <div class="kstat-v">${esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
            ${s.state !== "ok" && s.note ? `<div class="kstat-n">${esc(s.note)}</div>` : ""}
          </div>`).join("")}</div>` : ""}
        ${pointsList(t.points)}
        ${extras.length ? `<div class="extra-line">同じ日のほかの記録: ${extras.map(x => `${esc(x.type)} ${esc(x.verdict || "")}`).join(" ／ ")}</div>` : ""}
        <button class="more" type="button" data-go="run">ラップ・全指標・4軸の評価 →</button>
      </div>
    </section>`;
  }

  function menuCard() {
    const tm = D.tomorrow;
    if (!tm || !tm.title) return "";
    const kicker = MODE === "same" ? "明日のメニュー" : MODE === "morning" ? "今日のメニュー" : `${mdOf(tm.date)} のメニュー`;
    const km = (tm.segments || []).reduce((a, s) => a + (Number(s.km) || 0), 0);
    return `<section class="card rx">
      <div class="rx-top"><span class="kicker">${esc(kicker)}</span><span class="rx-date">${mdOf(tm.date)}(${esc(tm.dow)})</span>
        ${km ? `<span class="rx-km">${Math.round(km * 10) / 10}<em>km</em></span>` : ""}</div>
      <div class="card-body">
        <h3 class="rx-title">${esc(tm.title)}</h3>
        ${tm.headline ? `<p class="rx-headline">${esc(tm.headline)}</p>` : ""}
        ${segTable(tm.segments)}
        ${(tm.prescription || []).length ? `<dl class="rx-list">${tm.prescription.map(p => `<dt>${esc(p.k)}</dt><dd>${esc(p.v)}</dd>`).join("")}</dl>` : ""}
        ${Array.isArray(tm.alt) && tm.alt.length
          ? `<div class="blk"><b>当日の状態で切り替える</b><ol class="alts">${tm.alt.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`
          : prose("当日の状態で切り替える", tm.alt)}
        ${prose("なぜこの内容か", tm.why)}
        <button class="more" type="button" data-go="plan">この先1週間とフェーズ →</button>
      </div>
    </section>`;
  }

  const CHIP_LABEL = { "HRV（前夜平均）": "HRV", "安静時心拍": "安静心拍", "睡眠スコア": "睡眠", "トレーニング準備度": "準備度", "ボディバッテリー最低": "BB最低", "平均ストレス": "ストレス" };
  function condMini() {
    const h = D.health;
    if (!h || !h.summary || !h.summary.length) return "";
    const latest = (h.days || []).slice().reverse().find(d => d.hrv != null || d.rhr != null || d.sleep != null);
    const chips = h.summary.map(s => {
      const st = s.state === "crit" ? "crit" : s.state === "warn" ? "warn" : "ok";
      return `<div class="cchip ${st}" title="${esc(s.label)}：${esc(s.note || "")}">
        <span class="cchip-l">${esc(CHIP_LABEL[s.label] || String(s.label).replace(/（.*?）/g, ""))}</span>
        <span class="cchip-v">${s.value == null ? "—" : esc(s.value)}${s.unit && s.value != null ? `<em>${esc(s.unit)}</em>` : ""}</span>
        <span class="cchip-s">${st === "ok" ? "平常" : stateName[st]}</span>
      </div>`;
    }).join("");
    return `<section class="card">
      <div class="card-head"><h2>体調</h2><span class="sub">${latest ? `${esc(latest.d)} の値` : ""}</span></div>
      <div class="card-body">
        <div class="cchips">${chips}</div>
        ${MODE !== "same" ? `<p class="hnote">今朝の HRV と安静心拍はウォッチで確かめ、メニューの「切り替える」条件に当てはめる。</p>` : ""}
        <button class="more" type="button" data-go="health">睡眠・HRV の推移と読み取り →</button>
      </div>
    </section>`;
  }

  function weekBars(w) {
    const max = Math.max(...w.days.map(d => d.km), 1);
    return w.days.map(d => {
      const h = d.km > 0 ? Math.max(4, (d.km / max) * 70) : 4;
      const cls = d.km > 0 ? d.type : "rest";
      return `<div class="wd">
        <span class="wd-km">${d.km > 0 ? d.km.toFixed(1) : "—"}</span>
        <span class="wd-bar ${esc(cls)}" style="height:${h.toFixed(0)}px" title="${esc(d.d)} ${d.km}km${d.hr ? " HR" + d.hr : ""}"></span>
        <span class="wd-d">${esc(d.d)}<br>${esc(d.dow)}</span>
      </div>`;
    }).join("");
  }

  // 現在地: 目標に対する位置（予測・Mペース持続力）と直近7日。履歴が読めたら描き直す
  function kpiHtml() {
    const today = dataDay;
    const runs = allRuns();
    const haveHist = histState === "ready";
    const tiles = [];
    const tile = (l, v, unit, n, cls, s, pct) => `<div class="ktile"><span class="ktile-l">${esc(l)}</span>
        <span class="ktile-v">${v}${unit ? `<em>${esc(unit)}</em>` : ""}</span>
        ${pct != null ? `<span class="meter"><i style="width:${Math.max(2, Math.min(100, pct)).toFixed(0)}%"></i></span>` : ""}
        ${n ? `<span class="ktile-n ${cls || ""}">${n}</span>` : ""}
        ${s ? `<span class="ktile-s">${s}</span>` : ""}</div>`;
    const goalSec = secOf(D.race && D.race.goal);
    const predNow = secOf(fit().race && fit().race.full);
    if (predNow && goalSec) {
      const gap = predNow - goalSec;
      // 4週間前の予測と比べる（毎日の数秒の揺れより、流れのほうが意味がある）
      const base = runs.filter(r => r.pred && r.d < today && dayDiff(r.d, today) <= 28)[0];
      const trend = base && base.pred !== predNow
        ? `${mdOf(base.d)} の ${hmsOf(base.pred)} から ${predNow < base.pred ? "−" : "+"}${mmssOf(Math.abs(predNow - base.pred))}` : "";
      tiles.push(tile("Garmin フル予測", esc(hmsOf(predNow)), "",
        gap > 0 ? `サブ3まで あと ${gapOf(gap)}` : "目標タイムを上回っている", gap > 0 ? "warn" : "good", esc(trend)));
    }
    if (haveHist) {
      const m = mStatus(runs, today);
      const bestKm = m.best ? m.best.streak.km : 0;
      tiles.push(tile("Mペース（4:25以内）の連続 最長", m.best ? bestKm : "—", "km",
        m.aimT ? `次の目標 ${m.aimT.km}km（${esc(m.aimT.label)}・あと${dayDiff(today, m.aimT.until)}日）` : "", "",
        m.best ? `${mdOf(m.best.d)}・平均 ${mmssOf(m.best.streak.sec)}${m.best.streak.hr ? `・HR${m.best.streak.hr}` : ""}　／　直近2週の最長 ${m.recentBest}km` : "",
        m.aimT ? (bestKm / m.aimT.km) * 100 : null));
    } else {
      tiles.push(tile("Mペース（4:25以内）の連続 最長", "…", "", "", "", histState === "loading" ? "履歴を読み込んでいます" : "この画面では履歴を読めません"));
    }

    let week = "";
    const wk = D.week;
    if (wk && Array.isArray(wk.days) && wk.days.length) {
      const low = numOf(wk.targetKm);
      const delta = wk.prevKm > 0 ? Math.round((wk.totalKm / wk.prevKm - 1) * 100) : null;
      // 急な跳ね上がり（前の7日比 +30% 超）だけを色で立てる。+10% ルールは根拠が弱いので使わない（プロファイル）
      week = `<div class="sub-h">直近7日（${esc(String(wk.label || "").replace(/\s*直近7日\s*$/, ""))}）</div>
        <div class="week-grid">${weekBars(wk)}</div>
        <div class="tot">
          <div><span class="n">${kmFmt(wk.totalKm)}<em>km</em></span><span class="l">目標 ${esc(wk.targetKm)} km</span></div>
          <div><span class="n">${esc(wk.runs)}<em>日</em></span><span class="l">走った日</span></div>
          ${delta !== null ? `<div><span class="n ${delta > 30 ? "warn" : ""}">${delta > 0 ? "+" : ""}${delta}<em>%</em></span><span class="l">前の7日（${kmFmt(wk.prevKm)}km）比</span></div>` : ""}
          ${wk.monthKm != null ? `<div><span class="n">${kmFmt(wk.monthKm)}<em>km</em></span><span class="l">今月（${esc(wk.monthDayCount)}日経過）</span></div>` : ""}
        </div>
        ${low ? `<div><div class="meter"><i style="width:${Math.min(100, wk.totalKm / low * 100).toFixed(1)}%"></i></div>
          <div class="goalline"><span>週の下限 ${low}km</span>${wk.totalKm >= low ? `<b>到達 ✓</b>` : `<span>あと ${kmFmt(low - wk.totalKm)}km</span>`}</div></div>` : ""}`;
    }
    return `${tiles.length ? `<div class="ktiles">${tiles.join("")}</div>` : ""}${week}`;
  }

  function kpiCard() {
    return `<section class="card">
      <div class="card-head"><h2>現在地</h2><span class="sub">サブ3に向けて</span></div>
      <div class="card-body"><div class="stack" id="kpi" style="gap:14px">${kpiHtml()}</div>
        <button class="more" type="button" data-go="grow">カレンダーと推移 →</button></div>
    </section>`;
  }

  const safeUrl = (u) => /^https?:\/\/[^\s"<>]+$/i.test(String(u || "")) ? String(u) : null;
  function newsCard() {
    const n = D.news;
    if (!n || !n.title) return "";
    const url = safeUrl(n.url);
    const more = (Array.isArray(n.more) ? n.more : []).filter(x => x && x.title && safeUrl(x.url)).slice(0, 2);
    return `<section class="card news">
      <div class="card-head"><h2>今日の読みもの</h2>${n.theme ? `<span class="news-theme">${esc(n.theme)}</span>` : ""}<span class="sub">${esc(n.kind || "")}</span></div>
      <div class="card-body">
        ${url ? `<a class="news-title" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}<span class="ext" aria-hidden="true">↗</span></a>`
              : `<span class="news-title">${esc(n.title)}</span>`}
        <div class="news-meta">${esc(n.source || "")}${n.published ? `　${esc(n.published)}` : ""}</div>
        ${n.summary ? `<p class="news-sum">${esc(n.summary)}</p>` : ""}
        ${n.takeaway ? `<div class="news-take"><b>いまの練習に引きつけると</b>${esc(n.takeaway)}</div>` : ""}
        ${more.length ? `<div class="blk"><b>ほかの話題</b><ul class="news-more">${more.map(x => `<li><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><span>${esc(x.source || "")}</span></li>`).join("")}</ul></div>` : ""}
      </div>
    </section>`;
  }

  /* ======================================================================
     走りの詳細
     ====================================================================== */
  function runDetailCard(run, date, dow, label) {
    const rest = run.verdict === "—" && !(run.stats || []).length;
    const laps = expandLaps(run.laps);
    return `<section class="card">
      <div class="card-head"><h2>${esc(label)}</h2><span class="sub">${mdOf(date)}(${esc(dow)}) ${esc(run.type || "")}</span>
        <span class="pill ${run.verdict === "—" ? "rest" : vcls(run.verdict).replace("v-", "")}">${esc(run.verdict || "")} ${esc(run.verdictLabel || "")}</span></div>
      ${rest ? `<div class="card-body"><p class="hnote">走行データはありません。</p></div>` : `
        ${statsGrid(run.stats)}
        ${run.effect ? `<div class="effect">トレーニング効果: ${esc(run.effect)}</div>` : ""}
        ${laps.length ? `<div class="chart-box">${lapChart(laps)}${lapTable(laps, "run:" + date + ":" + label)}</div>` : ""}`}
    </section>`;
  }

  function runPanel() {
    const t = D.today || {};
    const extras = Array.isArray(t.extra) ? t.extra : [];
    // 2本目以降は結論と要点もここにしか出ない（ホームは1本目だけ）
    const extraCards = extras.map((x, i) => runDetailCard(x, t.date, t.dow, `${i + 2}本目`).replace("</section>",
      `<div class="card-body">${x.headline ? `<p class="headline">${esc(x.headline)}</p>` : ""}${pointsList(x.points)}</div></section>`)).join("");
    const axes = (D.axes || []).length ? `<section class="card">
      <div class="card-head"><h2>4軸の評価</h2><span class="sub">総合評価はホーム</span></div>
      <div class="card-body"><div class="axes">${D.axes.map(a => `<div class="axis">
          <div class="axis-h"><b>${esc(a.name)}</b><span class="pill ${esc(a.state)}">${esc(stateName[a.state] || a.state)}</span></div>
          <p>${esc(a.summary || a.text || "")}</p></div>`).join("")}</div></div>
    </section>` : "";
    const view = ((D.good || []).length || (D.issues || []).length) ? `<section class="card">
      <div class="card-head"><h2>週とシーズンの視点</h2></div>
      <div class="card-body"><div class="cols">
        ${(D.good || []).length ? `<div class="blk"><b>手応え</b><ul class="lst">${D.good.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
        ${(D.issues || []).length ? `<div class="blk"><b>課題</b><ul class="lst neg">${D.issues.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
      </div></div>
    </section>` : "";
    return runDetailCard(t, t.date, t.dow, extras.length ? "1本目" : "走りのデータ") + extraCards + axes + view;
  }

  /* ======================================================================
     予定
     ====================================================================== */
  /* シーズンの帯。フェーズを期間に比例した幅で並べ、レースと今日を印で示す。 */
  function seasonChart(season, today) {
    const ph = season.phases;
    const start = ph[0].from, end = ph[ph.length - 1].to;
    const total = dayDiff(start, end) + 1;
    const W = NARROW ? 360 : 900, H = NARROW ? 96 : 92;
    const padL = 4, padR = 4, top = 30, bh = 22;
    const x = (iso) => padL + (dayDiff(start, iso) / total) * (W - padL - padR);
    const kind = (p) => /回復/.test(p.name) ? "rec" : /テーパー|レース週/.test(p.name) ? "tap" : /特異|最終ビルド/.test(p.name) ? "spec" : "base";
    const fill = { base: "var(--z-e)", spec: "var(--z-m)", tap: "var(--accent-soft)", rec: "var(--surface-2)" };
    const rects = ph.map(p => {
      const x0 = x(p.from), x1 = x(isoAdd(p.to, 1)), w = Math.max(1, x1 - x0 - 2);
      const num = (p.name.match(/Phase\s*(\d+)/) || [])[1];
      const done = p.to < today;
      return `<rect x="${x0.toFixed(1)}" y="${top}" width="${w.toFixed(1)}" height="${bh}" rx="3" fill="${fill[kind(p)]}" opacity="${done ? .4 : .95}"><title>${esc(p.name)} ${mdOf(p.from)}〜${mdOf(p.to)} ／ 週 ${esc(p.km)}km</title></rect>
        ${num && w >= (NARROW ? 13 : 20) ? `<text x="${(x0 + w / 2).toFixed(1)}" y="${top + bh / 2 + 4}" class="s-ph${kind(p) === "tap" || kind(p) === "rec" ? " dark" : ""}">${NARROW ? num : "P" + num}</text>` : ""}`;
    }).join("");
    const races = season.races.map(r => {
      const rx = x(r.date);
      const anchor = rx > W * 0.8 ? "end" : rx < W * 0.2 ? "start" : "middle";
      return `<line x1="${rx.toFixed(1)}" y1="${top - 4}" x2="${rx.toFixed(1)}" y2="${top + bh + 4}" stroke="var(--ink)" stroke-width="1.5"/>
        <text x="${rx.toFixed(1)}" y="${top - 8}" class="s-race" text-anchor="${anchor}">🏁 ${esc(shortRace(r.name))}</text>`;
    }).join("");
    const months = [];
    for (let d = start.slice(0, 8) + "01"; d <= end; d = isoAdd(d.slice(0, 8) + "28", 4).slice(0, 8) + "01") {
      if (d >= start) months.push(`<text x="${x(d).toFixed(1)}" y="${top + bh + 18}" class="s-ax">${+d.slice(5, 7)}月</text>`);
    }
    const tIn = today >= start && today <= end;
    const tx = tIn ? x(today) : null;
    const marker = tIn ? `<path d="M${(tx - 5).toFixed(1)},${top + bh + 5} L${(tx + 5).toFixed(1)},${top + bh + 5} L${tx.toFixed(1)},${top + bh - 3} Z" fill="var(--crit)"/>
      <line x1="${tx.toFixed(1)}" y1="${top}" x2="${tx.toFixed(1)}" y2="${top + bh}" stroke="var(--crit)" stroke-width="2"/>` : "";
    return `<div class="chart-legend" style="padding:0 0 4px">
        <span><i style="background:var(--z-e)"></i>ベース・LT</span>
        <span><i style="background:var(--z-m)"></i>マラソン特異</span>
        <span><i style="background:var(--accent-soft)"></i>テーパー</span>
        <span><i style="background:var(--surface-2);outline:1px solid var(--line)"></i>回復</span>
        <span><i style="background:var(--crit)"></i>今日</span>
      </div>
      <svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="シーズンのフェーズと現在地">
        <style>
          .s-ph{font-family:var(--num);font-weight:700;font-size:11px;fill:#fff;text-anchor:middle}
          .s-ph.dark{fill:var(--ink-2)}
          .s-race{font-family:var(--jp);font-weight:700;font-size:${fs(11, 11.5)}px;fill:var(--ink)}
          .s-ax{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3)}
        </style>
        ${rects}${races}${months.join("")}${marker}
      </svg>`;
  }

  function seasonCard() {
    const season = D.season && D.season.phases && D.season.phases.length ? D.season : null;
    const today = viewDay;
    if (!season) {
      const p = D.phase || {};
      return p.name ? `<section class="card"><div class="card-head"><h2>いまのフェーズ</h2><span class="sub">${esc(p.window || "")}</span></div>
        <div class="card-body"><dl class="phase-now"><dt>いま</dt><dd><b>${esc(p.name)}</b></dd><dt>方針</dt><dd>${esc(p.policy || "")}</dd><dt>週間距離</dt><dd>${esc(p.weeklyTarget || "")}</dd></dl>
        <p class="hnote">シーズンの骨格（docs/athlete_profile.md のロードマップ表）を読めなかったため、帯は表示していません。</p></div></section>` : "";
    }
    const ph = phaseAt(today);
    const idx = ph ? season.phases.indexOf(ph) : -1;
    const nx = idx >= 0 ? season.phases[idx + 1] : season.phases.find(p => p.from > today);
    const nextRace = season.races.find(r => r.date >= today);
    return `<section class="card">
      <div class="card-head"><h2>シーズン</h2><span class="sub">${esc(season.races.map(r => shortRace(r.name)).join(" → "))}</span></div>
      <div class="card-body">
        ${seasonChart(season, today)}
        ${ph ? `<dl class="phase-now">
          <dt>いま</dt><dd><b>${esc(ph.name)}</b>（${mdOf(ph.from)}〜${mdOf(ph.to)}・残り ${dayDiff(today, ph.to) + 1}日）</dd>
          <dt>方針</dt><dd>${esc(ph.policy)}</dd>
          <dt>規定</dt><dd>週 ${esc(ph.km)}${/km/.test(ph.km) ? "" : " km"} ／ 質練習 ${esc(ph.quality)} ／ 休養 ${esc(ph.rest)}</dd>
          ${nx ? `<dt>次</dt><dd>${esc(nx.name)}（${mdOf(nx.from)}〜・あと ${dayDiff(today, nx.from)}日）— ${esc(nx.policy)}</dd>` : ""}
          ${nextRace ? `<dt>次のレース</dt><dd>${esc(nextRace.name)}（${mdOf(nextRace.date)}・あと ${dayDiff(today, nextRace.date)}日）— ${esc(nextRace.aim)}</dd>` : ""}
        </dl>` : ""}
      </div>
    </section>`;
  }

  function planCard() {
    const p = D.weekPlan;
    if (!p || !p.days || !p.days.length) return "";
    const tag = MODE === "same" ? "明日" : "今日";
    const firstIso = D.tomorrow && D.tomorrow.date;
    const rows = p.days.map((d, i) => `<div class="plan-row ${d.type === "rest" ? "rest" : ""}">
        <span class="plan-d">${esc(d.d)}(${esc(d.dow)})${i === 0 && MODE !== "stale" ? `<span class="tm">${tag}</span>` : ""}${i === 1 && MODE === "morning" ? `<span class="tm">明日</span>` : ""}</span>
        <span class="tp ${esc(d.type)}">${d.type === "rest" ? "休" : esc(d.type)}</span>
        <span class="plan-t">${esc(d.title)}</span>
        <span class="plan-km">${d.km == null || d.km === "0" ? "—" : `${esc(d.km)}<em>km</em>`}</span>
        <span class="plan-n">${d.note ? esc(d.note) : ""}</span>
      </div>`).join("");
    // 要約行。手順書の自己チェック（質練習の本数・休養日・週間距離）がそのまま目で確認できるようにする
    const sumKm = p.days.reduce((a, d) => a + (numOf(d.km) || 0), 0);
    const quality = p.days.filter(d => ["M", "T", "R"].includes(d.type)).length;
    const restDays = p.days.filter(d => d.type === "rest").length;
    return `<section class="card">
      <div class="card-head"><h2>この先1週間</h2><span class="sub">${esc(p.label || (firstIso ? mdOf(firstIso) + "〜" : ""))}</span></div>
      <div class="card-body">
        ${p.aim ? prose("この週のねらい", p.aim) : ""}
        <div class="plan-sum"><span>予定 <b>${esc(p.totalKm || sumKm)}</b> km</span><span>質練習 <b>${quality}</b> 本</span><span>走る日 <b>${p.days.length - restDays}</b> 日</span><span>休養 <b>${restDays}</b> 日</span></div>
        <div class="plan">${rows}</div>
      </div>
    </section>`;
  }

  /* ======================================================================
     コンディション
     ====================================================================== */
  function condCard() {
    const h = D.health;
    if (!h || !h.days || !h.days.length) return "";
    const cmp = (s) => {
      if (s.avg == null) return "";
      const bits = [`週平均 ${s.avg}`];
      if (s.prev != null) {
        const pct = s.prev !== 0 ? Math.round((s.avg / s.prev - 1) * 100) : 0;
        const arrow = Math.abs(pct) < 3 ? "→" : (pct > 0 ? "▲" : "▼");
        // 安静時心拍やストレスは上がるほど悪い。矢印の向きではなく良し悪しで色を決める
        const better = s.lowerIsBetter ? pct < 0 : pct > 0;
        const dir = Math.abs(pct) < 3 ? "flat" : (better ? "up" : "down");
        bits.push(`<span class="d ${dir}">${arrow} 前週 ${s.prev}${pct !== 0 ? `（${pct > 0 ? "+" : ""}${pct}%）` : ""}</span>`);
      }
      return `<div class="hstat-cmp">${bits.join(" ")}</div>`;
    };
    const f = h.fitness || {};
    const r = f.race || {};
    const vo2delta = (f.vo2max != null && f.vo2maxPrev != null) ? (f.vo2max - f.vo2maxPrev).toFixed(1) : null;
    const races = [["5K", r.k5], ["10K", r.k10], ["ハーフ", r.half], ["フル", r.full]].filter(x => x[1])
      .map(x => `<div><span class="t">${esc(x[1])}</span><span class="l">${esc(x[0])}</span></div>`).join("");
    return `<section class="card">
      <div class="card-head"><h2>健康データ</h2><span class="sub">${esc(h.label || "")}</span></div>
      <div class="card-body">
        <div class="hstats">${(h.summary || []).map(s => `<div class="hstat ${s.state === "ok" ? "" : esc(s.state)}">
            <div class="hstat-l">${esc(s.label)}</div>
            <div class="hstat-v">${s.value == null ? "—" : esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
            ${cmp(s)}
            <div class="hstat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
          </div>`).join("")}</div>
        ${prose("読み取り", h.read)}
        <div class="divider"></div>
        <div class="sub-h">睡眠</div>
        ${sleepChart(h)}
        <div class="sub-h">HRV（心拍変動）</div>
        ${hrvChart(h)}
        <div class="sub-h">日次データ</div>
        ${condTable(h.days, { ...(h.baseline || {}), sleepTargetMin: h.sleepTargetMin })}
        <p class="hnote">色付きの値は警戒側（睡眠が目標未満・HRV がバランス域の下・BB最低 20 未満・準備度 50 未満${h.days.some(d => d.steps != null) ? `・歩数 ${STEPS_HIGH.toLocaleString("en-US")} 以上` : ""}）。「—」は取れていない日（当日の BB最低・ストレス・歩数は一日が終わるまで確定しないので空けてある）。</p>
        ${(f.vo2max != null || races) ? `<div class="divider"></div>
        <div class="fitrow">
          ${f.vo2max != null ? `<div><span class="n">${esc(f.vo2max)}</span><span class="l">VO2max${vo2delta !== null ? `（週初 ${esc(f.vo2maxPrev)} → ${vo2delta >= 0 ? "+" : ""}${vo2delta}）` : ""}</span></div>` : ""}
          ${f.trainingStatus ? `<div><span class="n">${esc(f.trainingStatus)}</span><span class="l">トレーニングステータス</span></div>` : ""}
          ${races ? `<div><div class="racelist">${races}</div><span class="l" style="margin-top:4px">Garmin レース予測タイム</span></div>` : ""}
        </div>` : ""}
        <div class="divider"></div>
        <details class="gloss-box"><summary>指標の見かた</summary>
          <dl class="gloss">
            <dt>HRV（心拍変動）</dt><dd>拍と拍の間隔のゆらぎ（ms）。睡眠中に測る。回復モード（副交感神経）が優位なほど高い。疲労・ストレス・暑熱・飲酒で下がる。個人差が大きいので絶対値ではなく、Garmin が直近3週間から作る「バランス域」との相対で見る。</dd>
            <dt>安静時心拍</dt><dd>睡眠中の最も低い心拍。平常より +5bpm 以上の日が続くときは、疲労か体調不良を疑う。</dd>
            <dt>睡眠の内訳</dt><dd>深い睡眠は身体の回復（成長ホルモン分泌）、REM睡眠は神経系の回復に効く。</dd>
            <dt>ボディバッテリー</dt><dd>HRV・ストレス・活動量から算出する 0〜100 の残量計。最低値が 20 を切る日が続くのは使い切っているサイン。</dd>
            <dt>トレーニング準備度</dt><dd>睡眠・HRV・直近の練習負荷・ストレスをまとめた 0〜100 の合成スコア。走った日は走行後の値が入るので低く出る。</dd>
          </dl>
        </details>
      </div>
    </section>`;
  }

  /* ======================================================================
     成長の記録
     ====================================================================== */
  // カレンダーの1本ぶんの中身（数値・ラップ・結論・要点）
  function runBody(h, key) {
    const laps = expandLaps(h.laps);
    return `<div class="run1">
      <div class="detail-head"><b>${mdOf(h.d)}(${esc(h.dow || dowOf(h.d))})${h.seq > 1 ? ` ${h.seq}本目` : ""}</b><span>${esc(h.type || "")}</span>
        <span class="pill ${h.verdict === "—" || !h.verdict ? "rest" : vcls(h.verdict).replace("v-", "")}">${esc(h.verdict || "")} ${esc(h.verdictLabel || "")}</span></div>
      ${h.headline ? `<p class="headline" style="font-size:14px">${esc(h.headline)}</p>` : ""}
      ${statsGrid(h.stats)}
      ${h.effect && h.effect !== "—" ? `<div class="effect">トレーニング効果: ${esc(h.effect)}</div>` : ""}
      ${laps.length ? `<div class="chart-box">${lapChart(laps)}${lapTable(laps, "cal:" + key)}</div>` : ""}
      ${pointsList(h.points)}
    </div>`;
  }

  /* トレーニングカレンダー。1マス＝1日（色＝練習の種類、右上＝総合評価、数字＝距離）、右端＝その週の合計。
     マスを押すとその日の評価が週の下に開く。旧「過去の評価」の一覧と「週間距離の推移」をこれ1つにまとめた。 */
  function calendarHtml() {
    const today = dataDay;
    if (!today) return "";
    const runs = allRuns();
    const haveHist = histState === "ready";
    const byDay = new Map();
    runs.forEach(r => { if (!byDay.has(r.d)) byDay.set(r.d, []); byDay.get(r.d).push(r); });
    // 直近7日は DATA.week が正（type が E/M/T/R/rest で入っている）
    const wk = new Map();
    if (D.week && Array.isArray(D.week.days) && D.week.days.length === 7) {
      D.week.days.forEach((x, i) => wk.set(isoAdd(today, i - 6), x));
    }
    const start = haveHist && runs.length ? runs[0].d < isoAdd(today, -6) ? runs[0].d : isoAdd(today, -6) : isoAdd(today, -6);
    const dayInfo = (iso) => {
      const rs = byDay.get(iso) || [];
      const ran = rs.filter(r => r.km > 0);
      const w = wk.get(iso);
      const km = ran.length ? ran.reduce((a, r) => a + r.km, 0) : (w ? Number(w.km) || 0 : 0);
      const zone = km <= 0 ? "rest" : (w && w.km > 0 && w.type !== "rest" ? w.type : zoneOfType(ran[0] && ran[0].type, ran[0] && ran[0].laps));
      return { rs, km, zone, main: rs[0] || null };
    };
    const cell = (iso) => {
      const dd = +iso.slice(8, 10);
      const first = dd === 1 ? `${+iso.slice(5, 7)}/1` : dd;
      if (iso > today) return `<div class="cday fut"><span class="cd">${first}</span></div>`;
      if (iso < start) return `<div class="cday none"><span class="cd">${first}</span></div>`;
      const { km, zone, main } = dayInfo(iso);
      const v = main && JUDGED.includes(main.verdict) ? main.verdict : "";
      const label = `${mdOf(iso)}(${dowOf(iso)}) ${main ? main.type : km > 0 ? "" : "休養"}${km > 0 ? ` ${kmFmt(km)}km` : ""}${v ? ` 評価${v}` : ""}`;
      return `<button type="button" class="cday ${esc(zone)}${iso === today ? " today" : ""}${calSel === iso ? " sel" : ""}" data-day="${iso}" aria-pressed="${calSel === iso}" aria-label="${esc(label)}">
          <span class="cd">${first}</span>${v ? `<span class="cv ${vcls(v)}">${v}</span>` : ""}
          <span class="ck">${km > 0 ? kmFmt(km) : "休"}</span></button>`;
    };
    const weekCell = (mon) => {
      let km = 0;
      for (let i = 0; i < 7; i++) { const iso = isoAdd(mon, i); if (iso > today) break; km += dayInfo(iso).km; }
      const ph = phaseAt(isoAdd(mon, 3)) || phaseAt(mon);
      const nums = ph ? numsOf(ph.km) : [];
      // 回復週・テーパー週・レース週の距離は下限ではなく上限（プロファイル）
      const cap = ph && /回復|テーパー|レース週/.test(ph.name);
      const ref = nums.length ? (cap ? nums[nums.length - 1] : nums[0]) : null;
      const live = mon === mondayOf(today);
      const partial = mon < start;
      const short = ref && !cap && !live && !partial && km < ref;
      const lab = live ? "進行中" : partial ? "途中から" : ref ? `${cap ? "上限" : "下限"} ${ref}` : "";
      return `<div class="cwk${short ? " short" : ""}" title="${mdOf(mon)}〜 ${kmFmt(km)}km${ref ? `（${cap ? "上限" : "下限"} ${ref}km）` : ""}">
        <b>${Math.round(km)}<em>km</em></b>${ref ? `<span class="cm"><i style="width:${Math.min(100, km / ref * 100).toFixed(0)}%"></i></span>` : ""}<span class="cl">${esc(lab)}</span></div>`;
    };
    const detail = (iso) => {
      const { rs, km } = dayInfo(iso);
      if (!rs.length) return `<div class="cal-detail"><p class="hnote">${mdOf(iso)}(${dowOf(iso)}) — ${km > 0 ? `${kmFmt(km)}km（評価の記録なし）` : "休養（記録なし）"}</p></div>`;
      return `<div class="cal-detail">${rs.map(r => runBody(r.raw, iso + "-" + r.seq)).join("")}</div>`;
    };
    const thisMon = mondayOf(today);
    const totalWeeks = Math.floor(dayDiff(mondayOf(start), thisMon) / 7) + 1;
    const n = Math.min(calWeeks, totalWeeks);
    let grid = ["月", "火", "水", "木", "金", "土", "日"].map(d => `<div class="cal-h">${d}</div>`).join("") + `<div class="cal-h">週計</div>`;
    for (let w = 0; w < n; w++) {
      const mon = isoAdd(thisMon, -7 * w);
      for (let i = 0; i < 7; i++) grid += cell(isoAdd(mon, i));
      grid += weekCell(mon);
      if (calSel && calSel >= mon && calSel <= isoAdd(mon, 6)) grid += detail(calSel);
    }

    // 直近30日の総合評価（事実の集計。甘くしない）
    const judged = runs.filter(r => JUDGED.includes(r.verdict) && dayDiff(r.d, today) < 30);
    const ok = judged.filter(r => r.verdict === "◎" || r.verdict === "○").length;
    let streakOk = 0;
    for (let i = judged.length - 1; i >= 0 && (judged[i].verdict === "◎" || judged[i].verdict === "○"); i--) streakOk++;
    const cnt = (v) => judged.filter(r => r.verdict === v).length;
    const take = haveHist && judged.length
      ? `<p class="take">直近30日の評価は ${JUDGED.filter(v => cnt(v)).map(v => `${v}${cnt(v)}`).join("・")}（○以上 <span class="n">${ok}/${judged.length}</span> 本）。${streakOk >= 2 ? `いま <span class="n">${streakOk}</span> 本続けて○以上。` : ""}</p>` : "";
    const note = histState === "loading" ? `<p class="hnote">履歴を読み込んでいます…</p>`
      : histState === "ready" ? "" : `<p class="hnote">この画面では保存済みの履歴を読み出せないため、直近7日だけを表示しています。</p>`;
    return `${take}${note}
      <div class="cal-legend">
        ${[["E", "ジョグ"], ["M", "Mペース"], ["T", "閾値"], ["R", "インターバル"], ["rest", "休養"]].map(([z, l]) => `<span class="lg"><span class="tp ${z}">${z === "rest" ? "休" : z}</span>${l}</span>`).join("")}
        <span class="lg">右上＝総合評価・マスを押すと評価が開く</span>
      </div>
      <div class="cal" role="group" aria-label="トレーニングカレンダー">${grid}</div>
      ${n < totalWeeks ? `<button class="cal-more" type="button" data-cal-more="1">さらに前の週を表示</button>` : ""}`;
  }

  /* 棒グラフ（持続力）。bars: [{ label, v, fill, op, tip, top }] */
  function barChart(bars, o) {
    if (!bars.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 190 : 200;
    const padL = NARROW ? 8 : 12, padR = NARROW ? 8 : 12, padT = 22, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = Math.max(...bars.map(b => b.v), o.line ? o.line.v : 0, 1) * 1.1;
    const y = (v) => padT + ih - (v / max) * ih;
    const bw = iw / bars.length, barW = Math.min(bw * 0.62, 46);
    const body = bars.map((b, i) => {
      const cx = padL + bw * i + bw / 2, x0 = cx - barW / 2;
      const h = Math.max(b.v > 0 ? 2 : 0, padT + ih - y(b.v));
      return `<rect x="${x0.toFixed(1)}" y="${(padT + ih - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${b.fill}" opacity="${b.op ?? .9}"><title>${esc(b.tip || "")}</title></rect>
        ${b.top != null ? `<text x="${cx.toFixed(1)}" y="${(padT + ih - h - 5).toFixed(1)}" class="b-v">${esc(b.top)}</text>` : ""}
        ${(NARROW && bars.length > 8 && i % 2 && i !== bars.length - 1) ? "" : `<text x="${cx.toFixed(1)}" y="${H - 8}" class="b-ax">${esc(b.label)}</text>`}`;
    }).join("");
    const line = o.line ? `<line x1="${padL}" x2="${W - padR}" y1="${y(o.line.v).toFixed(1)}" y2="${y(o.line.v).toFixed(1)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
      <text x="${W - padR}" y="${(y(o.line.v) - 4).toFixed(1)}" class="b-ref">${esc(o.line.label)}</text>` : "";
    return `<svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
        <style>
          .b-v{font-family:var(--num);font-weight:700;font-size:${fs(11, 12)}px;fill:var(--ink);text-anchor:middle}
          .b-ax{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--ink-3);text-anchor:middle}
          .b-ref{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--crit);text-anchor:end}
        </style>
        <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--line)"/>
        ${line}${body}
      </svg>`;
  }

  /* 折れ線（有酸素の効率・フル予測で共用）。pts: [{ label, v, tip }] */
  function lineChart(pts, o) {
    if (pts.length < 2) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 160 : 170;
    const padL = NARROW ? 10 : 16, padR = NARROW ? 10 : 16, padT = 22, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const vs = pts.map(p => p.v).concat(o.line ? [o.line.v] : []);
    const lo = Math.min(...vs), hi = Math.max(...vs), span = Math.max(hi - lo, o.minSpan || 1);
    const y = (v) => padT + ih - ((v - (lo - span * .15)) / (span * 1.3)) * ih;
    const x = (i) => padL + (i / (pts.length - 1)) * iw;
    const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const stride = Math.max(1, Math.ceil(pts.length / (NARROW ? 6 : 14)));
    // 両端のラベルは内側へ寄せる（中央揃えだと画面の外にはみ出す）
    const edge = (i) => i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle";
    const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="var(--surface)" stroke="${o.color}" stroke-width="2"><title>${esc(p.tip || "")}</title></circle>
      ${(i % stride === 0 || i === pts.length - 1) ? `<text x="${x(i).toFixed(1)}" y="${(y(p.v) - 10).toFixed(1)}" class="l-v" text-anchor="${edge(i)}">${esc(o.fmt ? o.fmt(p.v) : p.v)}</text>
      <text x="${x(i).toFixed(1)}" y="${H - 8}" class="l-ax" text-anchor="${edge(i)}">${esc(p.label)}</text>` : ""}`).join("");
    const line = o.line ? `<line x1="${padL}" x2="${W - padR}" y1="${y(o.line.v).toFixed(1)}" y2="${y(o.line.v).toFixed(1)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
      <text x="${W - padR}" y="${(y(o.line.v) - 4).toFixed(1)}" class="b-ref">${esc(o.line.label)}</text>` : "";
    return `<svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
        <style>
          .l-v{font-family:var(--mono);font-size:${fs(10.5, 11.5)}px;fill:var(--ink);font-weight:500}
          .l-ax{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--ink-3)}
          .b-ref{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--crit);text-anchor:end}
        </style>
        <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--line)"/>
        ${line}
        <path d="${path}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
      </svg>`;
  }

  function progressHtml() {
    const today = dataDay;
    if (histState !== "ready") return "";
    const runs = allRuns();
    const out = [];
    // ===== Mペースの持続力 =====
    const m = mStatus(runs, today);
    const sBars = m.withStreak.slice(-16).map(r => ({
      label: mdOf(r.d), v: r.streak.km, top: `${r.streak.km}`,
      fill: r === m.best ? "var(--accent)" : "var(--z-m)", op: r === m.best ? 1 : .85,
      tip: `${r.d} ${r.type} — 4:25以内 ${r.streak.km}km 連続（平均 ${mmssOf(r.streak.sec)}${r.streak.hr ? `・HR${r.streak.hr}` : ""}）`
    }));
    let take = "";
    if (m.best) {
      take = `記録上の最長は <span class="n">${m.best.streak.km}km</span>（${mdOf(m.best.d)}）、直近2週の最長は <span class="n">${m.recentBest}km</span>。`;
      if (m.aimT) take += ` 次の目標 <span class="n">${m.aimT.km}km</span>（${esc(m.aimT.label)}）まで、あと <span class="n">${Math.max(0, m.aimT.km - m.best.streak.km)}km</span> 伸ばす。`;
    }
    // 到達目標の一覧。期限を過ぎたものは達成/未達、いまの目標は達成済みか進行中かを出す
    const steps = m.targets.map(t => {
      let cls = "", icon = "・";
      if (t.until < today) { const ok = m.bestBy(t.until) >= t.km; cls = ok ? "done" : ""; icon = ok ? "✓" : "✕"; }
      else if (t === m.curT) { const ok = m.bestBy(today) >= t.km; cls = ok ? "done" : "now"; icon = ok ? "✓" : "▶"; }
      else if (t === m.aimT) { cls = "now"; icon = "▶"; }
      return `<li class="${cls}"><span class="ic">${icon}</span><span class="w">${esc(t.label)}${/\d+\/\d+/.test(t.label) ? "" : `（〜${mdOf(t.until)}）`}</span><span class="x">${esc(t.text)}</span></li>`;
    }).join("");
    out.push(`<section class="card">
      <div class="card-head"><h2>Mペースの持続力</h2><span class="sub">4:25/km 以内で続けた距離</span></div>
      <div class="card-body">
        ${take ? `<p class="take">${take}</p>` : `<p class="hnote">4:25/km 以内のラップが2本以上続いた記録はまだありません。</p>`}
        ${barChart(sBars, { aria: "走行ごとの4:25以内の連続距離", line: m.aimT ? { v: m.aimT.km, label: `目標 ${m.aimT.km}km` } : null })}
        ${steps ? `<div class="sub-h">1回あたりのMペース量の到達目標</div><ul class="steps">${steps}</ul>` : ""}
        <p class="hnote">1kmラップのうち 4:25/km 以内（流し・短いレペを除く）が何本続いたか。閾値走の本セットも含む。サブ3は 4:15 を 42km 続ける競技なので、本数ではなくこの長さを伸ばす。</p>
      </div>
    </section>`);

    // ===== 有酸素の効率 と フル予測 =====
    const effRuns = runs.filter(r => r.eff).slice(-20);
    const ePts = effRuns.map(r => ({ label: mdOf(r.d), v: r.eff.hr, tip: `${r.d} ${r.type} — E帯 ${r.eff.n}本 平均 ${mmssOf(r.eff.sec)}・HR${r.eff.hr}` }));
    let eTake = "";
    if (effRuns.length >= 4) {
      const h = Math.floor(effRuns.length / 2);
      const a = avg(effRuns.slice(0, h).map(r => r.eff.hr)), b = avg(effRuns.slice(h).map(r => r.eff.hr));
      const as = avg(effRuns.slice(0, h).map(r => r.eff.sec)), bs = avg(effRuns.slice(h).map(r => r.eff.sec));
      const d = Math.round((b - a) * 10) / 10;
      eTake = `後半${effRuns.length - h}本の平均 <span class="n">HR${b.toFixed(1)}</span>（${mmssOf(Math.round(bs))}/km）は、前半${h}本の HR${a.toFixed(1)}（${mmssOf(Math.round(as))}/km）より ${d <= 0 ? `<span class="n">${Math.abs(d)}bpm 低い</span>` : `<span class="n">${d}bpm 高い</span>`}。${Math.abs(bs - as) >= 8 ? "ただしペースも違うので、差の一部はペース由来。" : ""}`;
    }
    const preds = runs.filter(r => r.pred).reduce((acc, r) => { acc.set(r.d, r.pred); return acc; }, new Map());
    const goalSec = secOf(D.race && D.race.goal);
    const pPts = [...preds.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, v]) => ({ label: mdOf(d), v, tip: `${d} フル予測 ${hmsOf(v)}` }));
    out.push(`<section class="card">
      <div class="card-head"><h2>有酸素の効率とフル予測</h2><span class="sub">E帯（5:30〜6:00/km）ラップの平均心拍</span></div>
      <div class="card-body">
        ${eTake ? `<p class="take">${eTake}</p>` : ""}
        ${ePts.length >= 2 ? lineChart(ePts, { aria: "E帯ラップの平均心拍の推移", color: "var(--z-e)", minSpan: 6, line: { v: 140, label: "E上限 140" } })
          : `<p class="hnote">E帯のラップが3本以上ある走りが2本たまると表示します。</p>`}
        <p class="hnote">同じ帯を低い心拍で走れていれば、有酸素の土台が伸びている。暑さ・睡眠不足・疲労でも上がるので、1本ではなく並びで見る。Eだけの日に限り、1本目（アップ）は除いている。</p>
        ${pPts.length >= 2 ? `<div class="divider"></div><div class="sub-h">Garmin フル予測の推移</div>
          ${lineChart(pPts, { aria: "Garmin フル予測の推移", color: "var(--z-t)", fmt: hmsOf, minSpan: 60, line: goalSec ? { v: goalSec, label: `目標 ${D.race.goal}` } : null })}` : ""}
      </div>
    </section>`);
    return out.join("");
  }

  // 読みものの記録。今日の分（DATA.news）と、履歴に写してある過去の分（runs の news）
  function archiveHtml() {
    const items = [];
    const seen = new Set();
    const push = (d, n) => {
      if (!n) return;
      const url = safeUrl(n.url || n.u);
      const title = n.title || n.t;
      if (!title || (url && seen.has(url))) return;
      if (url) seen.add(url);
      items.push({ d, title, url, source: n.source || n.s || "", theme: n.theme || n.th || "" });
    };
    if (dataDay) push(dataDay, D.news);
    (histRows || []).slice().sort((a, b) => String(b.d).localeCompare(String(a.d))).forEach(h => { if (h && h.d !== dataDay) push(h.d, h.news); });
    if (!items.length) return `<p class="hnote">${histState === "loading" ? "読み込んでいます…" : "まだ記録がありません。毎日の「今日の読みもの」がここに積み上がります。"}</p>`;
    return `<ul class="arch">${items.slice(0, archShow).map(x => `<li><span class="ad">${mdOf(x.d)}</span>
        ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>` : `<b>${esc(x.title)}</b>`}
        <span class="as">${esc([x.theme, x.source].filter(Boolean).join(" ・ "))}</span></li>`).join("")}</ul>
      ${items.length > archShow ? `<button class="cal-more" type="button" data-arch-more="1">さらに表示（残り ${items.length - archShow} 件）</button>` : ""}`;
  }

  function growPanel() {
    return `<section class="card">
        <div class="card-head"><h2>トレーニングカレンダー</h2><span class="sub">週は月曜始まり</span></div>
        <div class="card-body" id="cal">${calendarHtml()}</div>
      </section>
      <div class="stack" id="prog">${progressHtml()}</div>
      <section class="card">
        <div class="card-head"><h2>読みものの記録</h2></div>
        <div class="card-body" id="arch">${archiveHtml()}</div>
      </section>`;
  }

  // db を読み終えたら、履歴に依存する部分だけを描き直す
  function paintAsync() {
    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    set("pb", pbHtml());
    set("kpi", kpiHtml());
    set("cal", calendarHtml());
    set("prog", progressHtml());
    set("arch", archiveHtml());
  }

  /* ======================================================================
     全体の描画
     画面幅の区分が変わったら（回転など）グラフを描き直す。選択中のタブは URL のハッシュから復元する。
     ====================================================================== */
  const LEGACY_TAB = { menu: "home", prog: "grow", past: "grow" };
  let tabIds = [];

  function render() {
    const runWarn = (D.axes || []).some(a => a.state === "warn" || a.state === "crit")
      || ((D.today && D.today.stats) || []).some(s => s.state === "warn" || s.state === "crit");
    const healthWarn = ((D.health && D.health.summary) || []).some(s => s.state === "warn" || s.state === "crit");
    // ホームの並び: 分析した日のうちは「走り → 明日」、翌朝以降は「今日のメニュー → 体調 → 昨日の走り」
    const home = MODE === "same"
      ? [goalBlock(), runCard(), menuCard(), condMini(), kpiCard(), newsCard()]
      : [goalBlock(), menuCard(), condMini(), runCard(), kpiCard(), newsCard()];
    const tabDefs = [
      { id: "home",   label: "ホーム",         short: "ホーム", body: home.join("") },
      { id: "run",    label: "走りの詳細",     short: "走り",   warn: runWarn, body: runPanel() },
      { id: "plan",   label: "予定",           short: "予定",   body: seasonCard() + planCard() },
      { id: "health", label: "コンディション", short: "体調",   warn: healthWarn, body: condCard() },
      { id: "grow",   label: "成長の記録",     short: "成長",   body: growPanel() }
    ].filter(x => x.body);
    tabIds = tabDefs.map(x => x.id);

    const m = D.meta || {};
    const staleView = MODE === "stale" && D.tomorrow
      ? `<div class="stale-band">この分析は ${esc(m.generatedAt || dataDay)} のものです（${dayDiff(dataDay, viewDay)}日前）。毎日12:00 の更新が止まっている可能性があります。</div>` : "";
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="top">
        <h1 class="brand">サブ3デイリーコーチ</h1>
        <span class="top-meta">${esc(m.generatedAt || "")} 更新</span>
      </div>
      ${m.sourceFresh === false ? `<div class="stale-band">データが最新ではありません — ドライブ「ランニングログ」は ${esc(m.sourceUpdatedAt || "")} 時点。GitHub Actions の同期が失敗している可能性があります。</div>` : ""}
      ${staleView}
      <div class="tabs" role="tablist" aria-label="表示の切り替え">
        ${tabDefs.map((x, i) => `<button class="tab" type="button" role="tab" id="tab-${x.id}" aria-controls="panel-${x.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">
          <span class="tl">${esc(x.label)}</span><span class="ts">${esc(x.short)}</span>${x.warn ? `<span class="dot" title="要注意の項目があります"></span>` : ""}
        </button>`).join("")}
      </div>
      ${tabDefs.map((x, i) => `<div class="panel" id="panel-${x.id}" role="tabpanel" aria-labelledby="tab-${x.id}"${i === 0 ? "" : " hidden"}>${x.body}</div>`).join("")}
      <footer>
        <span>データ元: Googleドライブ「ランニングログ」${esc(m.sourceUpdatedAt || "")} 時点${m.sourceFresh === false ? ` <span class="stale">／ データが最新ではありません</span>` : ""}</span>
        <span>毎日 12:00 JST に Claude Routine が自動更新</span>
      </footer>`;

    const tabs = [...app.querySelectorAll(".tab")];
    tabs.forEach((tab, i) => {
      tab.addEventListener("click", () => select(i, false, true));
      tab.addEventListener("keydown", (e) => {
        const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        select((i + step + tabs.length) % tabs.length, true, true);
      });
    });
    const h = location.hash.slice(1);
    const want = tabIds.indexOf(LEGACY_TAB[h] || h);
    select(want >= 0 ? want : 0);
  }

  // タブを切り替えたらページ先頭に戻す（前のタブのスクロール位置が残ると、次のタブが途中から表示される）。
  // toTop は利用者が操作したときだけ true。初期描画と画面幅の切り替えでは位置を動かさない。
  function select(i, focus, toTop) {
    const app = document.getElementById("app");
    const tabs = [...app.querySelectorAll(".tab")], panels = [...app.querySelectorAll(".panel")];
    if (!tabs[i]) return;
    tabs.forEach((tab, k) => { tab.setAttribute("aria-selected", String(k === i)); tab.tabIndex = k === i ? 0 : -1; });
    panels.forEach((p, k) => { p.hidden = k !== i; });
    if (focus) tabs[i].focus();
    if (toTop) { window.scrollTo(0, 0); requestAnimationFrame(() => window.scrollTo(0, 0)); }
    // リロードや共有で同じタブに戻れるようにする
    history.replaceState(null, "", "#" + tabIds[i]);
  }

  render();

  // ボタン類の操作。app 自体は render() で作り直されないので、ここで一度だけ張る
  const appEl = document.getElementById("app");
  appEl.addEventListener("click", (e) => {
    const t = e.target.closest ? e.target : null;
    if (!t) return;
    const go = t.closest("[data-go]");
    if (go) { const i = tabIds.indexOf(go.dataset.go); if (i >= 0) select(i, false, true); return; }
    const day = t.closest(".cday[data-day]");
    if (day) {
      calSel = calSel === day.dataset.day ? null : day.dataset.day;
      document.getElementById("cal").innerHTML = calendarHtml();
      const again = document.querySelector(`.cday[data-day="${calSel}"]`);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    if (t.closest("[data-cal-more]")) { calWeeks += 6; document.getElementById("cal").innerHTML = calendarHtml(); return; }
    if (t.closest("[data-arch-more]")) { archShow += 10; document.getElementById("arch").innerHTML = archiveHtml(); }
  });
  // ラップ一覧の開閉状態を覚える（toggle はバブリングしないので capture で拾う）
  appEl.addEventListener("toggle", (e) => {
    const d = e.target;
    if (!d.classList || !d.classList.contains("lapdata")) return;
    if (d.open) lapOpen.add(d.dataset.lap); else lapOpen.delete(d.dataset.lap);
  }, true);
  // db は初回描画のあとに解決される。読めたら履歴部分だけ差し替える
  loadHistory();

  const onBreakpoint = (e) => { NARROW = e.matches; render(); paintAsync(); };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener("change", onBreakpoint);
  else narrowMQ.addListener(onBreakpoint);
})();
</script>

</body></html>
