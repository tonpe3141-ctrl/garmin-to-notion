<style>
/* このダッシュボードはライト固定。閲覧環境がダークでも背景を暗くしない。
   color-scheme を light に固定してスクロールバーやフォーム部品の自動反転も止める。 */
:root {
  color-scheme: light;
  --ground: #f2f4f3;
  --surface: #ffffff;
  --surface-2: #e9edeb;
  --ink: #161c1a;
  --ink-2: #5a6764;
  --ink-3: #8b9995;
  --line: #d5dcd9;
  --line-soft: #e6ebe9;
  --accent: #0f6e5c;
  --accent-ink: #0b5245;
  --accent-soft: #dcece7;
  --z-e: #3f8f7f;
  --z-m: #c9932f;
  --z-t: #bd5533;
  --z-r: #8b3a62;
  --good: #2f7d5f;
  --warn: #b3762a;
  --crit: #a83c2f;
  --good-soft: #dcece4;
  --warn-soft: #f4e9d6;
  --crit-soft: #f4dfdb;
  --shadow: 0 1px 2px rgba(22,28,26,.05), 0 8px 24px -14px rgba(22,28,26,.28);

  --jp: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --num: "Chivo", "Zen Kaku Gothic New", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--jp);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 20px 72px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- status band ---------- */
.band {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
}
.band-title {
  font-family: var(--num);
  font-weight: 900;
  font-size: 15px;
  letter-spacing: .13em;
  text-transform: uppercase;
  margin: 0;
  color: var(--accent-ink);
}
.band-spacer { flex: 1 1 auto; }
.band-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

/* ---------- countdown ---------- */
.counters { display: flex; gap: 8px; flex-wrap: wrap; }
.counter {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 7px 12px 6px;
  display: flex;
  align-items: baseline;
  gap: 7px;
}
.counter .num {
  font-family: var(--num);
  font-weight: 900;
  font-size: 21px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.counter.primary .num { color: var(--accent); }
.counter .lbl { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.counter .lbl b { display: block; font-weight: 700; color: var(--ink); }

/* ---------- hero ---------- */
.hero {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hero-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line-soft);
}
.hero-date {
  font-family: var(--num);
  font-weight: 900;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.hero-dow { font-size: 13px; color: var(--ink-2); margin-left: 4px; font-family: var(--jp); font-weight: 500; }
.hero-type {
  font-weight: 700;
  font-size: 16px;
  padding: 3px 11px;
  border-radius: 3px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.verdict {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.verdict-mark {
  font-family: var(--num);
  font-weight: 700;
  font-size: 42px;
  line-height: 1;
  display: block;
}
.verdict-txt { font-weight: 700; font-size: 14px; }
.verdict-txt span { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.v-good { color: var(--good); }
.v-warn { color: var(--warn); }
.v-crit { color: var(--crit); }

/* ---------- コメント（要点先出し） ----------
   数値とグラフを先に見せ、そのあとに言葉を置く。言葉は
   「1行の結論 → 要点リスト → 全文（折りたたみ）」の3段。
   長文をそのまま流すと読まれないので、全文は必ず details の中に入れる。 */
.cmt {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 12px;
}
.cmt-h {
  margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.7;
  max-width: 60ch; text-wrap: balance;
}

/* 要点リスト。○=良かった点 / △=外した点 / ・=留保 */
.pts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.pt {
  display: grid;
  grid-template-columns: 16px minmax(7em, max-content) 1fr;
  gap: 2px 11px; align-items: baseline; font-size: 13.5px; line-height: 1.75;
}
.pt-i { font-family: var(--num); font-weight: 700; font-size: 12px; text-align: center; }
.pt.good .pt-i { color: var(--good); }
.pt.bad  .pt-i { color: var(--warn); }
.pt.note .pt-i { color: var(--ink-3); }
.pt-l { font-weight: 700; color: var(--ink); }
.pt-t { color: var(--ink-2); max-width: 58ch; }

/* ラベル付きの説明ブロック */
.blk { display: flex; flex-direction: column; gap: 5px; }
.blk > b {
  font-family: var(--num); font-weight: 900; font-size: 11px;
  letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase;
}
.lead { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--ink-2); max-width: 66ch; }
.alts {
  margin: 2px 0 0; padding-left: 1.4em;
  display: flex; flex-direction: column; gap: 7px;
  font-size: 13px; line-height: 1.8; color: var(--ink-2);
}
.alts li { max-width: 62ch; }

/* ---------- 過去の評価 ----------
   一覧は日付・種別・距離・総合評価だけの1行。選んだ日だけ中身を開く。 */
.hnote { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.hlist { display: flex; flex-direction: column; }
.hitem { border-bottom: 1px solid var(--line-soft); }
.hitem:last-child { border-bottom: none; }
.hitem.open { background: var(--surface-2); }
.hbtn {
  appearance: none; background: none; border: 0; width: 100%;
  display: grid; grid-template-columns: 8.6em 1fr auto 1.7em;
  align-items: baseline; gap: 3px 12px;
  padding: 11px 4px; cursor: pointer; text-align: left;
  font-family: var(--jp); font-size: 13.5px; color: var(--ink);
}
.hbtn:hover { color: var(--accent-ink); }
.hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 2px; }
.hd {
  font-family: var(--mono); font-size: 12.5px; color: var(--ink-2);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.hd em { font-style: normal; color: var(--ink-3); margin-left: 3px; }
.ht { font-weight: 700; }
.hk { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hk em { font-style: normal; font-size: 10.5px; font-weight: 400; color: var(--ink-3); margin-left: 2px; }
.hv { font-family: var(--num); font-weight: 700; font-size: 17px; text-align: right; }
.hbody { padding: 0 4px 18px; display: flex; flex-direction: column; gap: 12px; }
.hbody .stats {
  border: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft);
  border-radius: 3px; overflow: hidden; background: var(--surface);
}
.hbody .effect { padding: 0; }
.hbody .chart-box { padding: 0; background: var(--surface); border-radius: 3px; }
.hmeta {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.htoday {
  font-family: var(--jp); font-size: 9.5px; font-weight: 700; line-height: 1.6;
  padding: 0 4px; border-radius: 2px; margin-left: 5px;
  background: var(--accent-soft); color: var(--accent-ink); vertical-align: 1px;
}

/* ---------- stat grid ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  border-top: 1px solid var(--line-soft);
}
.stat {
  padding: 14px 16px 13px;
  border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.stat::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: transparent;
}
.stat.warn::before { background: var(--warn); }
.stat.crit::before { background: var(--crit); }
.stat-l {
  font-size: 10.5px;
  letter-spacing: .09em;
  color: var(--ink-3);
  font-weight: 500;
  text-transform: none;
}
.stat-v {
  font-family: var(--num);
  font-weight: 700;
  font-size: 25px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-v em { font-style: normal; font-size: 12px; font-weight: 400; color: var(--ink-2); margin-left: 3px; }
.stat-n { font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }
.stat.warn .stat-n { color: var(--warn); }

.effect {
  padding: 12px 24px;
  font-size: 12.5px;
  color: var(--ink-2);
  font-family: var(--mono);
}

/* ---------- chart ---------- */
.chart-box { padding: 4px 12px 18px; }
.chart-legend {
  display: flex; gap: 16px; flex-wrap: wrap;
  padding: 0 12px 10px;

<script>
(function () {
  const D = DATA;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const vClass = { "◎": "v-good", "○": "v-good", "△": "v-warn", "✕": "v-crit" };
  const stateName = { good: "良好", ok: "良好", warn: "要調整", crit: "要注意" };
  const toneMark = { good: "○", bad: "△", note: "・" };

  /* ---------- 長文の扱い ----------
     折りたたみは廃止した（読まれないうえに、毎日その全文を生成するのが
     そのまま無駄なコストになるため）。DATA 側は要点だけを持ち、
     箇条書きは先頭の1文を太字にして拾い読みできるようにする。 */
  function splitLead(v) {
    const t = String(v == null ? "" : v).trim();
    const m = t.match(/^[\s\S]{1,120}?。/);
    if (!m) return { lead: t, rest: "" };
    return { lead: m[0], rest: t.slice(m[0].length).trim() };
  }
  // ラベル付きの説明ブロック（「なぜこの内容か」「読み取り」など）
  function prose(label, v) {
    const t = String(v == null ? "" : v).trim();
    if (!t) return "";
    return `<div class="blk"><b>${esc(label)}</b><p class="lead">${esc(t)}</p></div>`;
  }
  // 箇条書きは先頭の1文を太字にして拾い読みできるようにする
  function bullet(v) {
    const { lead, rest } = splitLead(v);
    return `<b>${esc(lead)}</b>${rest ? " " + esc(rest) : ""}`;
  }

  // スマホでは横スクロールさせずに1画面へ収める。viewBox を狭くして
  // その分だけ SVG 内の文字を大きめの単位で描く（描画後の実寸は約10〜11px）。
  const narrowMQ = window.matchMedia("(max-width: 640px)");
  let NARROW = narrowMQ.matches;
  // SVG 内フォントの基準サイズ（viewBox 単位）
  const fs = (desktop, mobile) => NARROW ? mobile : desktop;

  /* ---------- lap profile chart ---------- */
  function lapChart(laps) {
    if (!laps || !laps.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 230 : 260;
    const padL = NARROW ? 26 : 44, padR = NARROW ? 16 : 46;
    const padT = 16, padB = NARROW ? 34 : 40;
    const iw = W - padL - padR, ih = H - padT - padB;
    // 本数が多いとラベルが潰れるので、狭い画面では間引く
    const stride = Math.max(1, Math.ceil(laps.length / (NARROW ? 6 : 24)));

    const secs = laps.map(l => l.sec);
    const hrs = laps.map(l => l.hr).filter(h => h != null);
    const sMin = Math.min(...secs), sMax = Math.max(...secs);
    const sLo = sMin - (sMax - sMin) * 0.25 - 6;
    const sHi = sMax + (sMax - sMin) * 0.12 + 6;
    const hLo = hrs.length ? Math.min(...hrs) - 12 : 0;
    const hHi = hrs.length ? Math.max(...hrs) + 12 : 1;

    const bw = iw / laps.length;
    const barW = Math.min(bw * 0.62, 42);

    const labelled = (i) => i % stride === 0 || i === laps.length - 1;
    // 心拍ラベルのY座標を先に出しておく（ペースラベルとの衝突判定に使う）
    const hrY = laps.map(l => l.hr == null ? null
      : padT + ih - ((l.hr - hLo) / (hHi - hLo)) * ih);

    // pace bars: faster (smaller sec) = taller
    const bars = laps.map((l, i) => {
      const t = (sHi - l.sec) / (sHi - sLo);
      const h = Math.max(3, t * ih);
      const x = padL + bw * i + (bw - barW) / 2;
      const y = padT + ih - h;
      const zone = l.sec <= 260 ? "z-r" : l.sec <= 300 ? "z-t" : l.sec <= 340 ? "z-m" : "z-e";
      // 心拍ラベルと重なる位置ならペースは出さない（バーの高さが残るので情報は失われない）
      const clash = hrY[i] != null && labelled(i) && Math.abs((y - 6) - (hrY[i] - 10)) < (NARROW ? 16 : 14);
      const show = labelled(i) && !clash;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--${zone})" opacity=".85"><title>Lap ${l.n} — ${esc(l.pace)}/km, HR ${l.hr ?? "-"}</title></rect>
        ${show ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" class="c-pace">${esc(l.pace)}</text>` : ""}`;
    }).join("");

    // hr line
    const pts = laps.map((l, i) => hrY[i] == null ? null
      : [padL + bw * i + bw / 2, hrY[i], l.hr, i]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const dots = pts.map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${NARROW ? 2.6 : 3.4}" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/>
       ${labelled(p[3])
         ? `<text x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" class="c-hr">${p[2]}</text>` : ""}`).join("");

    const xlab = laps.map((l, i) => labelled(i)
      ? `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 12 : 14)}" class="c-ax">${l.n}</text>` : "").join("");

    return `<div class="chart-legend">
        <span><i style="background:var(--z-e)"></i>E域ペース</span>
        <span><i style="background:var(--z-m)"></i>M域</span>
        <span><i style="background:var(--z-t)"></i>T域</span>
        <span><i style="background:var(--z-r)"></i>R域</span>
        <span><i style="background:var(--crit);border-radius:50%"></i>心拍 bpm</span>
        <span class="ref">横軸 = ラップ番号</span>
      </div>
      <div class="chart-scroll"><svg class="laps" viewBox="0 0 ${W} ${H}" role="img" aria-label="ラップごとのペースと心拍">
        <style>
          .c-pace{font-family:var(--mono);font-size:${fs(11, 13)}px;fill:var(--ink-2);text-anchor:middle}
          .c-hr{font-family:var(--mono);font-size:${fs(10.5, 12.5)}px;fill:var(--crit);text-anchor:middle;font-weight:500}
          .c-ax{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-3);text-anchor:middle}
          .c-side{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3)}
        </style>
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <text x="${NARROW ? 2 : 6}" y="${padT + 10}" class="c-side">速い</text>
        <text x="${NARROW ? 2 : 6}" y="${padT + ih}" class="c-side">遅い</text>
        ${bars}
        <path d="${path}" fill="none" stroke="var(--crit)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
        ${xlab}
      </svg></div>`;
  }

  /* ---------- condition charts ----------
     睡眠と HRV は別々のグラフにする。1枚に重ねると凡例がどちらの系列のものか
     分かりにくくなるため、それぞれの凡例をそのグラフの直上に置く。
     トレーニング準備度は睡眠とHRVの合成スコアなのでグラフにはしない
     （同じ情報を二重に数えることになる）。タイルと表には残す。 */

  const chartCss = () => `
    .k-sl{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-2);text-anchor:middle}
    .k-sl.short{fill:var(--warn);font-weight:500}
    .k-hrv{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--z-t);text-anchor:middle;font-weight:500}
    .k-ax{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3);text-anchor:middle}
    .k-band{font-family:var(--mono);font-size:${fs(9.5, 10.5)}px;fill:var(--ink-3);text-anchor:end}
    .k-band.start{text-anchor:start}`;

  const hhmm = (m) => `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, "0")}m`;
  // スマホでは「7h13m」だと幅が足りないので「7:13」に縮める
  const hshort = (m) => NARROW
    ? `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`
    : hhmm(m);
  // X軸ラベル。スマホは「22(土)」、デスクトップは「8/22(土)」
  const dayLabel = (d) => NARROW
    ? `${String(d.d).split("/").pop()}(${d.dow})`
    : `${d.d}(${d.dow})`;

  /* 睡眠: 深い / REM / 浅い の積み上げ。濃いほど深い眠り。 */
  function sleepChart(h) {
    const days = (h && h.days) || [];
    if (!days.some(d => d.sleepMin != null)) return "";

    const W = NARROW ? 360 : 900, H = NARROW ? 200 : 212;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26;
    const padT = 22, padB = NARROW ? 26 : 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const base = padT + ih;

    const target = h.sleepTargetMin ?? 420;
    const max = Math.max(...days.map(d => d.sleepMin || 0), target) * 1.14;
    const y = (m) => base - (m / max) * ih;

    const bw = iw / days.length;
    const barW = Math.min(bw * 0.5, 36);

    const layers = [
      { key: "sleepDeep",  label: "深い", op: 1 },
      { key: "sleepRem",   label: "REM",  op: .58 },
      { key: "sleepLight", label: "浅い", op: .26 }
    ];

    const bars = days.map((d, i) => {
      const total = d.sleepMin;
      if (total == null) return "";
      const x = padL + bw * i + (bw - barW) / 2;
      const parts = layers.filter(l => d[l.key] != null);
      let acc = 0;
      // 内訳が取れていなければ合計だけの単色バーにする
      const segs = (parts.length ? parts : [{ key: null, label: "睡眠", op: .7 }]).map(l => {
        const v = l.key ? d[l.key] : total;
        const yTop = y(acc + v), hgt = Math.max(1, y(acc) - yTop);
        acc += v;
        return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}"
                  height="${hgt.toFixed(1)}" fill="var(--accent)" opacity="${l.op}">
                  <title>${esc(d.d)} ${l.label} ${hhmm(v)}</title></rect>`;
      }).join("");
      const short = total < target;
      return segs + `<text x="${(x + barW / 2).toFixed(1)}" y="${(y(total) - 6).toFixed(1)}"
        class="k-sl${short ? " short" : ""}">${hshort(total)}</text>`;
    }).join("");

    const xlab = days.map((d, i) =>
      `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 8 : 10)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");

    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--accent)"></i>深い睡眠</span>
        <span><i style="background:var(--accent);opacity:.58"></i>REM睡眠</span>
        <span><i style="background:var(--accent);opacity:.26"></i>浅い睡眠</span>
        <span class="ref">破線 = 目標 ${hhmm(target)}</span>
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="直近7日の睡眠時間と内訳">
        <style>${chartCss()}</style>
        <line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${padL}" y1="${y(target).toFixed(1)}" x2="${W - padR}" y2="${y(target).toFixed(1)}"
              stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>
        <text x="${padL - 5}" y="${(y(target) + 3).toFixed(1)}" class="k-band">${hshort(target)}</text>
        ${bars}
        ${xlab}
      </svg></div></div>`;
  }

  /* HRV: バランス域の帯 + 前夜平均のライン */
  function hrvChart(h) {
    const days = (h && h.days) || [];
    const hrvs = days.map(d => d.hrv).filter(v => v != null);
    if (!hrvs.length) return "";

    const W = NARROW ? 360 : 900, H = NARROW ? 142 : 150;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26;
    const padT = 20, padB = NARROW ? 24 : 28;
    const iw = W - padL - padR, ih = H - padT - padB;

    const bl = h.baseline || {};
    const lo = Math.min(...hrvs, bl.hrvLow ?? Infinity) - 8;
    const hi = Math.max(...hrvs, bl.hrvHigh ?? -Infinity) + 8;
    const y = (v) => padT + ih - ((v - lo) / (hi - lo)) * ih;

    const bw = iw / days.length;

    const band = (bl.hrvLow != null && bl.hrvHigh != null)
      ? `<rect x="${padL}" y="${y(bl.hrvHigh).toFixed(1)}" width="${iw}"
           height="${(y(bl.hrvLow) - y(bl.hrvHigh)).toFixed(1)}"
           fill="var(--accent)" opacity=".08"/>
         <text x="${padL - 5}" y="${(y(bl.hrvHigh) + 4).toFixed(1)}" class="k-band">${bl.hrvHigh}</text>
         <text x="${padL - 5}" y="${(y(bl.hrvLow) + 4).toFixed(1)}" class="k-band">${bl.hrvLow}</text>`
      : "";

    const pts = days.map((d, i) => d.hrv == null ? null
      : [padL + bw * i + bw / 2, y(d.hrv), d.hrv]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const dots = pts.map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--z-t)" stroke-width="2"/>
       <text x="${p[0].toFixed(1)}" y="${(p[1] - 9).toFixed(1)}" class="k-hrv">${p[2]}</text>`).join("");

    const xlab = days.map((d, i) =>
      `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 7 : 9)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");

    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--z-t);border-radius:50%"></i>HRV 前夜平均 ms</span>
        ${bl.hrvLow != null ? `<span class="ref">帯 = バランス域 ${bl.hrvLow}–${bl.hrvHigh}（ここを下抜けしたら要注意）</span>` : ""}
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="直近7日のHRVの推移">
        <style>${chartCss()}</style>
        ${band}
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <path d="${path}" fill="none" stroke="var(--z-t)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
        ${xlab}
      </svg></div></div>`;
  }

  /* ---------- condition table ---------- */
  function condTable(days) {
    const num = (v, suffix) => v == null ? "—" : `${v}${suffix || ""}`;
    const hm = (m) => m == null ? "—" : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
    const rows = days.map(d => `<tr>
        <td>${esc(d.d)}(${esc(d.dow)})</td>
        <td>${num(d.sleep)}</td>
        <td>${hm(d.sleepMin)}</td>
        <td>${num(d.hrv)}</td>
        <td>${num(d.rhr)}</td>
        <td class="${d.bbLow != null && d.bbLow < 20 ? "lo" : ""}">${num(d.bbLow)}</td>
        <td>${num(d.stress)}</td>
        <td class="${d.readiness != null && d.readiness < 50 ? "lo" : ""}">${num(d.readiness)}</td>
      </tr>`).join("");
    return `<div class="htab-scroll"><table class="htab">
      <thead><tr>
        <th>日付</th><th>睡眠</th><th>睡眠時間</th><th>HRV</th>
        <th>安静心拍</th><th>BB最低</th><th>ストレス</th><th>準備度</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  /* ---------- condition card ---------- */
  function condCard(h) {
    if (!h || !h.days || !h.days.length) return "";
    const cmp = (s) => {
      if (s.avg == null) return "";
      const bits = [`週平均 ${s.avg}`];
      if (s.prev != null) {
        const pct = s.prev !== 0 ? Math.round((s.avg / s.prev - 1) * 100) : 0;
        const arrow = Math.abs(pct) < 3 ? "→" : (pct > 0 ? "▲" : "▼");
        // 安静時心拍やストレスは上がるほど悪い。矢印の向きではなく良し悪しで色を決める。
        const better = s.lowerIsBetter ? pct < 0 : pct > 0;
        const dir = Math.abs(pct) < 3 ? "flat" : (better ? "up" : "down");
        bits.push(`<span class="d ${dir}">${arrow} 前週 ${s.prev}${pct !== 0 ? `（${pct > 0 ? "+" : ""}${pct}%）` : ""}</span>`);
      }
      return `<div class="hstat-cmp">${bits.join(" ")}</div>`;
    };
    const f = h.fitness || {};
    const r = f.race || {};
    const vo2delta = (f.vo2max != null && f.vo2maxPrev != null)
      ? (f.vo2max - f.vo2maxPrev).toFixed(1) : null;
    const races = [["5K", r.k5], ["10K", r.k10], ["ハーフ", r.half], ["フル", r.full]]
      .filter(x => x[1])
      .map(x => `<div><span class="t">${esc(x[1])}</span><span class="l">${esc(x[0])}</span></div>`).join("");

    return `<section class="card">
      <div class="card-head"><h2>健康データ</h2><span class="sub">${esc(h.label || "")}</span></div>
      <div class="card-body">
        <div class="hstats">
          ${h.summary.map(s => `<div class="hstat ${s.state === "ok" ? "" : esc(s.state)}">
            <div class="hstat-l">${esc(s.label)}</div>
            <div class="hstat-v">${s.value == null ? "—" : esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
            ${cmp(s)}
            <div class="hstat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
          </div>`).join("")}
        </div>
        ${prose("読み取り", h.read)}
        <div class="divider"></div>
        <div class="sub-h">睡眠</div>
        ${sleepChart(h)}
        <div class="sub-h">HRV（心拍変動）</div>
        ${hrvChart(h)}
        <div class="sub-h">日次データ</div>
        ${condTable(h.days)}
        ${(f.vo2max != null || races) ? `<div class="divider"></div>
        <div class="fitrow">
          ${f.vo2max != null ? `<div><span class="n">${f.vo2max}</span>
            <span class="l">VO2max${vo2delta !== null
              ? `（週初 ${f.vo2maxPrev} → ${vo2delta >= 0 ? "+" : ""}${vo2delta}）` : ""}</span></div>` : ""}
          ${f.trainingStatus ? `<div><span class="n">${esc(f.trainingStatus)}</span>
            <span class="l">トレーニングステータス</span></div>` : ""}
          ${races ? `<div><div class="racelist">${races}</div>
            <span class="l" style="margin-top:4px">Garmin レース予測タイム</span></div>` : ""}
        </div>` : ""}
        <div class="divider"></div>
        <div class="sub-h">指標の見かた</div>
        <dl class="gloss">
          <dt>HRV（心拍変動）</dt>
          <dd>拍と拍の間隔のゆらぎ（ms）。睡眠中に測る。回復モード（副交感神経）が優位なほど高い。
            疲労・ストレス・暑熱・飲酒で下がる。個人差が大きいので絶対値ではなく、
            Garmin が直近3週間から作る「バランス域」との相対で見る。下抜けが続いたら要注意。</dd>
          <dt>安静時心拍</dt>
          <dd>睡眠中の最も低い心拍。平常より +3bpm 以上の日が続くときは、疲労か体調不良を疑う。</dd>
          <dt>睡眠の内訳</dt>
          <dd>深い睡眠は身体の回復（成長ホルモン分泌）、REM睡眠は神経系の回復に効く。
            合計時間が足りていても深い睡眠が短い夜が続くと、脚の回復が追いつかない。</dd>
          <dt>ボディバッテリー</dt>
          <dd>HRV・ストレス・活動量から算出する 0〜100 の残量計。最低値が 20 を切る日が続くのは
            使い切っているサイン。</dd>
          <dt>トレーニング準備度</dt>
          <dd>睡眠・睡眠負債・HRV・直近の練習負荷・ストレスをまとめた 0〜100 の合成スコア。
            上の各指標の要約なので、グラフではなくこの数値だけを見れば足りる。</dd>
        </dl>
      </div>
    </section>`;
  }

  /* ---------- 明日のメニューの構成 ----------
     segments[] は { zone, km, label, pace, hr, note }。
     zone は週プランと同じ E / M / T / R / rest。 */
  const numOf = (v) => {
    const m = String(v == null ? "" : v).match(/\d+(\.\d+)?/);
    return m ? Number(m[0]) : null;
  };

  function segBar(segs) {
    if (!segs || !segs.length) return "";
    const total = segs.reduce((a, x) => a + (numOf(x.km) || 0), 0);
    if (!total) return "";
    return `<div class="segbar" role="img" aria-label="練習の構成">${segs.map(x => {
      const km = numOf(x.km) || 0;
      if (!km) return "";
      return `<i class="seg ${esc(x.zone || "E")}" style="flex:${km}"
        title="${esc(x.label || x.zone || "")} ${esc(x.km)}km"></i>`;
    }).join("")}</div>`;
  }

  function segTable(segs) {
    if (!segs || !segs.length) return "";
    return `<div class="segs">${segs.map(x => {
      const meta = [x.pace ? `ペース ${x.pace}` : null, x.hr ? `HR ${x.hr}` : null]
        .filter(Boolean).join("　／　");
      return `<div class="segrow">
        <span class="tp ${esc(x.zone || "E")}">${x.zone === "rest" ? "休" : esc(x.zone || "E")}</span>
        <span class="seg-n">${esc(x.label || "")}</span>
        <span class="seg-k">${numOf(x.km) ? `${esc(x.km)}<em>km</em>` : "—"}</span>
        ${meta ? `<span class="seg-m">${esc(meta)}</span>` : ""}
        ${x.note ? `<span class="seg-o">${esc(x.note)}</span>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  /* ---------- week plan（明日から1週間・要点だけ） ---------- */
  // 予定の7日を棒で見せる。km は "14〜16" のような幅つき文字列も来るので先頭の数を使う。
  function planBars(days) {
    const max = Math.max(...days.map(d => numOf(d.km) || 0), 1);
    return days.map(d => {
      const km = numOf(d.km) || 0;
      const h = km > 0 ? Math.max(4, (km / max) * 74) : 4;
      return `<div class="wd">
        <span class="wd-km">${km > 0 ? esc(d.km) : "—"}</span>
        <span class="wd-bar ${km > 0 ? esc(d.type) : "rest"}" style="height:${h.toFixed(0)}px"
          title="${esc(d.d)} ${esc(d.title || "")}"></span>
        <span class="wd-d">${esc(d.dow)}</span>
      </div>`;
    }).join("");
  }

  // フェーズ規定に対して足りているかを、その場で見せる。
  // 質練習は E を数えない（プロファイルの定義どおり M / T / R のみ）。
  function planSummary(p) {
    const days = p.days || [];
    const q = days.filter(d => d.type === "M" || d.type === "T" || d.type === "R").length;
    const rest = days.filter(d => d.type === "rest").length;
    const ph = D.phase || {};
    const kmLo = numOf(p.totalKm), kmTgt = numOf(ph.weeklyTarget);
    const qTgt = numOf(ph.qualityTarget), rTgt = numOf(ph.restTarget);
    const tile = (n, unit, label, state) => `<div class="ptile ${state}">
      <span class="n">${esc(n)}<em>${esc(unit)}</em></span><span class="l">${esc(label)}</span></div>`;
    return `<div class="ptiles">
      ${tile(p.totalKm || "—", " km", `予定合計${ph.weeklyTarget ? `／ 目標 ${ph.weeklyTarget}` : ""}`,
        kmLo != null && kmTgt != null && kmLo < kmTgt ? "warn" : "good")}
      ${tile(q, " 本", `質練習${ph.qualityTarget ? `／ 規定 ${ph.qualityTarget}` : ""}`,
        qTgt != null && q < qTgt ? "warn" : "good")}
      ${tile(rest, " 日", `休養${ph.restTarget ? `／ 規定 ${ph.restTarget}` : ""}`,
        rTgt != null && rest > rTgt ? "warn" : "good")}
    </div>`;
  }

  function planCard(p) {
    if (!p || !p.days || !p.days.length) return "";
    const rows = p.days.map((d, i) => `<div class="plan-row ${d.type === "rest" ? "rest" : ""}">
        <span class="plan-d">${esc(d.d)}(${esc(d.dow)})${i === 0 ? `<span class="tm">明日</span>` : ""}</span>
        <span class="tp ${esc(d.type)}">${d.type === "rest" ? "休" : esc(d.type)}</span>
        <span class="plan-t">${esc(d.title)}</span>
        <span class="plan-km">${d.km == null || d.km === "0" ? "—" : `${esc(d.km)}<em>km</em>`}</span>
        <span class="plan-n">${d.note ? esc(d.note) : ""}</span>
      </div>`).join("");
    return `<section class="card">
      <div class="card-head"><h2>この先1週間</h2><span class="sub">${esc(p.label || "")}</span></div>
      <div class="card-body">
        ${p.aim || p.policy ? `<div class="blk"><b>ねらい</b><p class="lead">${esc(p.aim || p.policy)}</p></div>` : ""}
        ${planSummary(p)}
        <div class="week-grid plan">${planBars(p.days)}</div>
        <div class="plan">${rows}</div>
      </div>
    </section>`;
  }

  /* ---------- week bars ---------- */
  function weekBars(w) {
    const max = Math.max(...w.days.map(d => d.km), 1);
    return w.days.map(d => {
      const h = d.km > 0 ? Math.max(4, (d.km / max) * 74) : 4;
      const cls = d.km > 0 ? d.type : "rest";
      return `<div class="wd">
        <span class="wd-km">${d.km > 0 ? d.km.toFixed(1) : "—"}</span>
        <span class="wd-bar ${cls}" style="height:${h.toFixed(0)}px" title="${esc(d.d)} ${d.km}km${d.hr ? " HR" + d.hr : ""}"></span>
        <span class="wd-d">${esc(d.dow)}</span>
      </div>`;
    }).join("");
  }

  function statsGrid(stats) {
    if (!stats || !stats.length) return "";
    return `<div class="stats">${stats.map(s => `<div class="stat ${s.state === "ok" ? "" : esc(s.state)}">
        <div class="stat-l">${esc(s.label)}</div>
        <div class="stat-v">${esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
        <div class="stat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
      </div>`).join("")}</div>`;
  }

  // 履歴のラップは "sec:hr,sec:hr,…" の1行で持つ。
  // ペースは秒から復元できるので保存しない（保存量をおよそ1/4にするため）。
  function expandLaps(v) {
    if (Array.isArray(v)) return v;
    if (typeof v !== "string" || !v) return [];
    return v.split(",").map((pair, i) => {
      const parts = pair.split(":");
      const sec = Number(parts[0]);
      if (!isFinite(sec) || sec <= 0) return null;
      const hr = parts[1] === "" || parts[1] == null ? null : Number(parts[1]);
      return {
        n: i + 1, sec,
        pace: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`,
        hr: isFinite(hr) ? hr : null
      };
    }).filter(Boolean);
  }

  function pointsList(pts) {
    if (!pts || !pts.length) return "";
    return `<ul class="pts">${pts.map(p => `<li class="pt ${esc(p.tone || "note")}">
        <span class="pt-i">${toneMark[p.tone] || toneMark.note}</span>
        <span class="pt-l">${esc(p.label)}</span>
        <span class="pt-t">${esc(p.text)}</span>
      </li>`).join("")}</ul>`;
  }

  /* ---------- 過去の評価 ----------
     過去分は DATA に持たせない。持たせると Routine が毎日その全部を
     書き直すことになり、日を追うごとに生成コストが増え続けるため。
     代わりに Artifact の db に 1日1件だけ書き、ページ側が開いたときに読む。
     したがって DATA の大きさは何日経っても変わらない。 */
  const HIST_DAYS = 60;
  let histRows = null;            // db から読んだ過去エントリ
  let histState = "loading";      // loading / ready / off / error
  let histSel = null;             // 開いている日付

  // 今日の分は db への書き込みを待たずに DATA から組み立てて先頭に出す
  function todayRow() {
    const t = D.today || {};
    const pick = (label) => {
      const s = (t.stats || []).find(x => x.label === label);
      return s ? s.value : null;
    };
    return {
      d: t.date, dow: t.dow, type: t.type, verdict: t.verdict, verdictLabel: t.verdictLabel,
      km: pick("距離"), pace: pick("平均ペース"), hr: pick("平均心拍"),
      headline: t.headline, points: t.points || [],
      stats: t.stats || [], effect: t.effect || "", laps: t.laps || []
    };
  }

  async function loadHistory() {
    try {
      const use = window.claude && window.claude.use;
      const db = use ? await window.claude.use("db") : null;
      if (!db) { histState = "off"; paintHistory(); return; }
      const snap = await db.collection("runs").orderBy("d", "desc").limit(HIST_DAYS).get();
      histRows = snap.docs.map(x => x.data()).filter(Boolean);
      histState = "ready";
    } catch (e) {
      histState = "error";
    }
    paintHistory();
  }

  function histHtml() {
    const today = todayRow();
    const past = (histRows || []).filter(h => h && h.d && h.d !== today.d);
    const rows = today.d ? [today].concat(past) : past;

    let note = "";
    if (histState === "loading") note = `<p class="hnote">過去の評価を読み込んでいます…</p>`;
    else if (histState === "off") note = `<p class="hnote">この画面では保存済みの履歴を読み出せません。今日の分だけ表示しています。</p>`;
    else if (histState === "error") note = `<p class="hnote">履歴の読み込みに失敗しました。再読み込みしてください。今日の分だけ表示しています。</p>`;
    else if (!past.length) note = `<p class="hnote">保存済みの過去データはまだありません。毎日 12:00 JST の更新で1日ぶんずつ積み上がります。</p>`;

    const list = rows.map(h => {
      const open = histSel === h.d;
      const meta = [
        h.pace ? `平均ペース ${h.pace}/km` : null,
        h.hr ? `平均心拍 ${h.hr}bpm` : null,
        h.verdictLabel ? `総合評価 ${h.verdict || ""} ${h.verdictLabel}` : null
      ].filter(Boolean).join("　／　");
      return `<div class="hitem ${open ? "open" : ""}">
        <button class="hbtn" type="button" data-d="${esc(h.d)}" aria-expanded="${open}">
          <span class="hd">${esc(h.d)}${h.dow ? `<em>(${esc(h.dow)})</em>` : ""}${h.d === today.d ? `<span class="htoday">今日</span>` : ""}</span>
          <span class="ht">${esc(h.type || "")}</span>
          <span class="hk">${h.km != null && h.km !== "" ? `${esc(h.km)}<em>km</em>` : ""}</span>
          <span class="hv ${vClass[h.verdict] || "v-warn"}">${esc(h.verdict || "")}</span>
        </button>
        ${open ? `<div class="hbody">
          ${statsGrid(h.stats)}
          ${h.effect ? `<div class="effect">トレーニング効果: ${esc(h.effect)}</div>` : ""}
          ${(() => { const lp = expandLaps(h.laps); return lp.length ? `<div class="chart-box">${lapChart(lp)}</div>` : ""; })()}
          ${h.headline ? `<p class="cmt-h">${esc(h.headline)}</p>` : ""}
          ${pointsList(h.points)}
          ${meta ? `<div class="hmeta">${esc(meta)}</div>` : ""}
        </div>` : ""}
      </div>`;
    }).join("");

    return `${note}<div class="hlist">${list}</div>`;
  }

  function paintHistory() {
    const el = document.getElementById("hist");
    if (el) el.innerHTML = histHtml();
  }

  /* ---------- render ----------
     画面幅の区分が変わったら（回転など）グラフを描き直す。
     選択中のタブは URL のハッシュから復元されるので状態は失われない。 */
  function render() {
  const t = D.today, wk = D.week;
  const deltaPct = wk.prevKm > 0 ? Math.round((wk.totalKm / wk.prevKm - 1) * 100) : null;
  const monthPct = Math.min(100, (wk.monthKm / wk.monthTargetKm) * 100);
  const monthPace = Math.round(wk.monthKm / wk.monthDayCount * 31);

  // タブに要注意の点があるかどうか。隠れている側の警告を見落とさないための印。
  const runWarn = (D.axes || []).some(a => a.state === "warn" || a.state === "crit")
    || (t.stats || []).some(s => s.state === "warn" || s.state === "crit");
  const healthWarn = ((D.health && D.health.summary) || [])
    .some(s => s.state === "warn" || s.state === "crit");
  const hasHealth = !!(D.health && D.health.days && D.health.days.length);

  // 数値とグラフのあとに置くコメント。結論 → 要点 → 全文の3段。
  function commentBlock(t) {
    const pts = t.points || [];
    const head = t.headline
      ? `<p class="cmt-h">${esc(t.headline)}</p>` : "";
    const list = pointsList(pts);
    if (!head && !list) return "";
    return `<div class="cmt">
        <div class="sub-h">コーチのコメント</div>
        ${head}${list}
      </div>`;
  }

  // 走りの評価パネル（今日の走り / コーチ評価 / 週間・月間ロード）
  // 明日以降のメニューは menuPanel 側に分けている。走りの評価が縦に長くなりすぎるため。
  const runPanel = `
    <section class="hero">
      <div class="hero-head">
        <span class="hero-date">${esc(t.date)}<span class="hero-dow">(${esc(t.dow)})</span></span>
        <span class="hero-type">${esc(t.type)}</span>
        <span class="verdict ${vClass[t.verdict] || "v-warn"}">
          <span class="verdict-mark">${esc(t.verdict)}</span>
          <span class="verdict-txt">${esc(t.verdictLabel)}<span>総合評価</span></span>
        </span>
      </div>
      ${statsGrid(t.stats)}
      <div class="effect">トレーニング効果: ${esc(t.effect)}</div>
      <div class="chart-box">${lapChart(t.laps)}</div>
      ${commentBlock(t)}
    </section>

    <section class="card">
      <div class="card-head"><h2>コーチ評価</h2><span class="sub">5軸</span></div>
      <div class="card-body">
        ${D.axes.map(a => `<div class="axis">
            <div class="axis-h"><b>${esc(a.name)}</b><span class="pill ${esc(a.state)}">${esc(stateName[a.state] || a.state)}</span></div>
            <p class="lead">${esc(a.summary || a.text || "")}</p>
          </div>`).join("")}
        <div class="divider"></div>
        <div class="sub-h">良かった点</div>
        <ul class="lst">${D.good.map(x => `<li><span>${bullet(x)}</span></li>`).join("")}</ul>
        <div class="sub-h">課題</div>
        <ul class="lst neg">${D.issues.map(x => `<li><span>${bullet(x)}</span></li>`).join("")}</ul>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>週間・月間ロード</h2><span class="sub">${esc(wk.label)}</span></div>
      <div class="card-body">
        <div class="week-grid">${weekBars(wk)}</div>
        <div class="divider"></div>
        <div class="tot">
          <div><span class="n">${wk.totalKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> km</em></span><span class="l">今週合計（目標 ${esc(wk.targetKm)} km）</span></div>
          <div><span class="n">${wk.runs}<em style="font-size:12px;font-weight:400"> 回</em></span><span class="l">走行回数</span></div>
          <div><span class="n">${wk.prevKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> km</em></span><span class="l">前週</span></div>
          ${deltaPct !== null ? `<div><span class="n delta" style="color:${deltaPct > 10 ? "var(--warn)" : "var(--good)"}">${deltaPct > 0 ? "+" : ""}${deltaPct}%</span><span class="l">前週比（+10%超で過負荷）</span></div>` : ""}
        </div>
        <div class="divider"></div>
        <div>
          <div class="tot" style="margin-bottom:8px">
            <div><span class="n">${wk.monthKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> / ${wk.monthTargetKm} km</em></span><span class="l">今月累計（${wk.monthDayCount}日経過）／ このペースだと月末 ${monthPace} km</span></div>
          </div>
          <div class="meter"><i style="width:${monthPct.toFixed(1)}%"></i></div>
        </div>
      </div>
    </section>
  `;

  // 明日以降のメニューパネル（明日の処方 / この先1週間）
  const menuPanel = `
    <section class="card rx">
      <div class="card-head"><h2>明日のメニュー</h2><span class="sub">${esc(D.tomorrow.date)}(${esc(D.tomorrow.dow)})</span></div>
      <div class="card-body">
        <h3 class="rx-title">${esc(D.tomorrow.title)}</h3>
        <p class="rx-headline">${esc(D.tomorrow.headline)}</p>
        ${segBar(D.tomorrow.segments)}
        ${segTable(D.tomorrow.segments)}
        ${(D.tomorrow.prescription || []).length ? `<dl class="rx-list">
          ${D.tomorrow.prescription.map(p => `<dt>${esc(p.k)}</dt><dd>${esc(p.v)}</dd>`).join("")}
        </dl>` : ""}
        <div class="divider"></div>
        ${prose("なぜこの内容か", D.tomorrow.why)}
        ${Array.isArray(D.tomorrow.alt)
          ? `<div class="blk"><b>切り替え条件</b><ol class="alts">${D.tomorrow.alt.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`
          : prose("切り替え条件", D.tomorrow.alt)}
        ${prose("その先", D.tomorrow.next)}
      </div>
    </section>

    ${planCard(D.weekPlan)}
  `;

  // 健康パネル（コンディション）
  const healthPanel = condCard(D.health);

  const tabDefs = [
    { id: "run",    label: "走りの評価",       warn: runWarn,    body: runPanel },
    { id: "menu",   label: "明日以降のメニュー", warn: false,      body: menuPanel },
    { id: "health", label: "コンディション",   warn: healthWarn, body: healthPanel },
    { id: "past",   label: "過去の評価",       warn: false,      body: `
      <section class="card">
        <div class="card-head"><h2>過去の評価</h2><span class="sub">日付を選ぶと開きます</span></div>
        <div class="card-body"><div id="hist">${histHtml()}</div></div>
      </section>` }
  ].filter(x => x.body);

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="band">
      <h1 class="band-title">サブ3デイリーコーチ</h1>
      <span class="band-spacer"></span>
      <span class="band-meta">${esc(D.meta.generatedAt)} 更新</span>
    </div>

    <div class="counters">
      <div class="counter primary">
        <span class="num">${D.race.daysLeft}</span>
        <span class="lbl"><b>${esc(D.race.name)}</b>${esc(D.race.date)} ／ 目標 ${esc(D.race.goal)}（${esc(D.race.pace)}）</span>
      </div>
      ${D.tuneup && D.tuneup.name ? `<div class="counter">
        <span class="num">${D.tuneup.daysLeft}</span>
        <span class="lbl"><b>${esc(D.tuneup.name)}</b>${esc(D.tuneup.date)} ／ 練習レース</span>
      </div>` : ""}
      <div class="counter">
        <span class="lbl"><b>${esc(D.phase.name)}</b>${esc(D.phase.policy)} ／ 週 ${esc(D.phase.weeklyTarget)}</span>
      </div>
    </div>

    ${tabDefs.length > 1 ? `<div class="tabs" role="tablist" aria-label="表示の切り替え">
      ${tabDefs.map((x, i) => `<button class="tab" type="button" role="tab"
        id="tab-${x.id}" aria-controls="panel-${x.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">
        ${esc(x.label)}${x.warn ? `<span class="dot" title="要注意の項目があります"></span>` : ""}
      </button>`).join("")}
    </div>` : ""}

    ${tabDefs.map((x, i) => `<div class="panel" id="panel-${x.id}" role="tabpanel"
      aria-labelledby="tab-${x.id}"${i === 0 ? "" : " hidden"}>${x.body}</div>`).join("")}

    <footer>
      <span>データ元: Googleドライブ「ランニングログ」${esc(D.meta.sourceUpdatedAt)} 時点${D.meta.sourceFresh ? "" : ` <span class="stale">／ データが最新ではありません</span>`}</span>
      <span>毎日 12:00 JST に Claude Routine が自動更新</span>
    </footer>
  `;

  /* ---------- tab behaviour ---------- */
  const tabs = [...app.querySelectorAll(".tab")];
  const panels = [...app.querySelectorAll(".panel")];

  // タブを切り替えたら必ずページ先頭に戻す。
  // 前のタブのスクロール位置がそのまま残ると、次のタブが途中から表示されて
  // 何が出ているのか分からなくなる（縦に長いスマホで特に起きる）。
  function scrollToTop() {
    window.scrollTo(0, 0);
    // iOS Safari はレイアウト確定後に位置を復元することがあるので、次フレームでもう一度戻す。
    requestAnimationFrame(() => window.scrollTo(0, 0));
  }

  // toTop は「利用者がタブを操作したとき」だけ true にする。
  // 初期描画と画面幅の切り替わりによる再描画では位置を動かさない。
  function select(i, focus, toTop) {
    tabs.forEach((tab, k) => {
      tab.setAttribute("aria-selected", String(k === i));
      tab.tabIndex = k === i ? 0 : -1;
    });
    panels.forEach((p, k) => { p.hidden = k !== i; });
    // focus() 自体がタブを画面内へスクロールさせるので、先頭へ戻すのはそのあと。
    if (focus) tabs[i].focus();
    if (toTop) scrollToTop();
    // リロードや共有で同じタブに戻れるようにする
    history.replaceState(null, "", "#" + tabDefs[i].id);
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => select(i, false, true));
    tab.addEventListener("keydown", (e) => {
      const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      select((i + step + tabs.length) % tabs.length, true, true);
    });
  });

  if (tabs.length) {
    const fromHash = tabDefs.findIndex(x => "#" + x.id === location.hash);
    select(fromHash >= 0 ? fromHash : 0);
  }
  }

  render();

  // 履歴の開閉。app 自体は render() で作り直されないので、ここで一度だけ張る。
  document.getElementById("app").addEventListener("click", (e) => {
    const btn = e.target.closest ? e.target.closest(".hbtn") : null;
    if (!btn) return;
    histSel = histSel === btn.dataset.d ? null : btn.dataset.d;
    paintHistory();
  });
  // db は初回描画のあとに解決される。読めたら履歴部分だけ差し替える。
  loadHistory();

  const onBreakpoint = (e) => { NARROW = e.matches; render(); };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener("change", onBreakpoint);
  else narrowMQ.addListener(onBreakpoint);
})();
</script>

</body></html>
