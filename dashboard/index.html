<script>
(function () {
  const D = DATA;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const vClass = { "◎": "v-good", "○": "v-good", "△": "v-warn", "✕": "v-crit" };
  const stateName = { good: "良好", ok: "良好", warn: "要調整", crit: "要注意" };
  const toneMark = { good: "○", bad: "△", note: "・" };
  // 休養日の "—" は警告色ではなく薄い字で出す
  const vcls = (v) => vClass[v] || (v === "—" ? "v-rest" : "v-warn");

  /* ---------- ペース帯・心拍上限（docs/athlete_profile.md のペースゾーン定義から） ----------
     R 3:35〜3:45 / T 3:58〜4:08 / M 4:15〜4:25 / E 5:30〜6:00。
     ラップの色分けは帯と帯の中間を境にする（秒/km）:
       R|T = 3:52 (232) / T|M = 4:12 (252) / M|E = 4:58 (298)
     プロファイルのゾーンを引き直したら、ここも一緒に直すこと。 */
  const ZONE_EDGE = { r: 232, t: 252, m: 298 };
  const zoneOf = (sec) => sec <= ZONE_EDGE.r ? "z-r" : sec <= ZONE_EDGE.t ? "z-t" : sec <= ZONE_EDGE.m ? "z-m" : "z-e";
  const HR_CAPS = [{ hr: 167, label: "M上限" }, { hr: 176, label: "T上限" }];

  // race.daysLeft が無いときは meta.generatedAt の日付から数える（Routine の書き忘れに備える）
  const dateOf = (s) => { const m = String(s || "").match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : null; };
  const daysLeftOf = (x) => {
    if (!x) return "—";
    if (Number.isInteger(x.daysLeft)) return x.daysLeft;
    const base = dateOf(D.meta && D.meta.generatedAt);
    return (x.date && base) ? Math.round((Date.parse(x.date) - Date.parse(base)) / 86400000) : "—";
  };

  /* ---------- 長文の扱い ----------
     折りたたみは廃止した（読まれないうえに、毎日その全文を生成するのが
     そのまま無駄なコストになるため）。DATA 側は要点だけを持ち、
     箇条書きは先頭の1文を太字にして拾い読みできるようにする。 */
  function splitLead(v) {
    const t = String(v == null ? "" : v).trim();
    const m = t.match(/^[\s\S]{1,120}?。/);
    if (!m) return { lead: t, rest: "" };
    return { lead: m[0], rest: t.slice(m[0].length).trim() };
  }
  // ラベル付きの説明ブロック（「なぜこの内容か」「読み取り」など）
  function prose(label, v) {
    const t = String(v == null ? "" : v).trim();
    if (!t) return "";
    return `<div class="blk"><b>${esc(label)}</b><p class="lead">${esc(t)}</p></div>`;
  }
  // 箇条書きは先頭の1文を太字にして拾い読みできるようにする
  function bullet(v) {
    const { lead, rest } = splitLead(v);
    return `<b>${esc(lead)}</b>${rest ? " " + esc(rest) : ""}`;
  }

  // スマホでは横スクロールさせずに1画面へ収める。viewBox を狭くして
  // その分だけ SVG 内の文字を大きめの単位で描く（描画後の実寸は約10〜11px）。
  const narrowMQ = window.matchMedia("(max-width: 640px)");
  let NARROW = narrowMQ.matches;
  // SVG 内フォントの基準サイズ（viewBox 単位）
  const fs = (desktop, mobile) => NARROW ? mobile : desktop;

  /* ---------- lap profile chart ---------- */
  function lapChart(laps) {
    if (!laps || !laps.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 230 : 260;
    const padL = NARROW ? 26 : 44, padR = NARROW ? 16 : 46;
    const padT = 16, padB = NARROW ? 34 : 40;
    const iw = W - padL - padR, ih = H - padT - padB;
    // 本数が多いとラベルが潰れるので、狭い画面では間引く
    const stride = Math.max(1, Math.ceil(laps.length / (NARROW ? 6 : 24)));

    const secs = laps.map(l => l.sec);
    const hrs = laps.map(l => l.hr).filter(h => h != null);
    const sMin = Math.min(...secs), sMax = Math.max(...secs);
    const sLo = sMin - (sMax - sMin) * 0.25 - 6;
    const sHi = sMax + (sMax - sMin) * 0.12 + 6;
    const hLo = hrs.length ? Math.min(...hrs) - 12 : 0;
    const hHi = hrs.length ? Math.max(...hrs) + 12 : 1;

    const bw = iw / laps.length;
    const barW = Math.min(bw * 0.62, 42);

    const labelled = (i) => i % stride === 0 || i === laps.length - 1;
    // 心拍ラベルのY座標を先に出しておく（ペースラベルとの衝突判定に使う）
    const hrY = laps.map(l => l.hr == null ? null
      : padT + ih - ((l.hr - hLo) / (hHi - hLo)) * ih);

    // pace bars: faster (smaller sec) = taller
    const bars = laps.map((l, i) => {
      const t = (sHi - l.sec) / (sHi - sLo);
      const h = Math.max(3, t * ih);
      const x = padL + bw * i + (bw - barW) / 2;
      const y = padT + ih - h;
      const zone = zoneOf(l.sec);
      // 心拍ラベルと重なる位置ならペースは出さない（バーの高さが残るので情報は失われない）
      const clash = hrY[i] != null && labelled(i) && Math.abs((y - 6) - (hrY[i] - 10)) < (NARROW ? 16 : 14);
      const show = labelled(i) && !clash;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--${zone})" opacity=".85"><title>Lap ${l.n} — ${esc(l.pace)}/km, HR ${l.hr ?? "-"}</title></rect>
        ${show ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" class="c-pace">${esc(l.pace)}</text>` : ""}`;
    }).join("");

    // hr line
    const pts = laps.map((l, i) => hrY[i] == null ? null
      : [padL + bw * i + bw / 2, hrY[i], l.hr, i]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const dots = pts.map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${NARROW ? 2.6 : 3.4}" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/>
       ${labelled(p[3])
         ? `<text x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" class="c-hr">${p[2]}</text>` : ""}`).join("");

    const xlab = laps.map((l, i) => labelled(i)
      ? `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 12 : 14)}" class="c-ax">${l.n}</text>` : "").join("");

    // 心拍の上限線（M上限167 / T上限176）。描画範囲に入るときだけ引き、超えた本が一目で分かるようにする
    const hrRef = hrs.length ? HR_CAPS.filter(c => c.hr > hLo && c.hr < hHi).map(c => {
      const y = padT + ih - ((c.hr - hLo) / (hHi - hLo)) * ih;
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"
                stroke="var(--crit)" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
        <text x="${W - padR}" y="${(y - 3).toFixed(1)}" class="c-ref">${c.label} ${c.hr}</text>`;
    }).join("") : "";

    const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    return `<div class="chart-legend">
        <span><i style="background:var(--z-r)"></i>R域 〜${mmss(ZONE_EDGE.r)}</span>
        <span><i style="background:var(--z-t)"></i>T域 〜${mmss(ZONE_EDGE.t)}</span>
        <span><i style="background:var(--z-m)"></i>M域 〜${mmss(ZONE_EDGE.m)}</span>
        <span><i style="background:var(--z-e)"></i>E域</span>
        <span><i style="background:var(--crit);border-radius:50%"></i>心拍 bpm</span>
        <span class="ref">破線 = 心拍上限 ／ 横軸 = ラップ番号</span>
      </div>
      <div class="chart-scroll"><svg class="laps" viewBox="0 0 ${W} ${H}" role="img" aria-label="ラップごとのペースと心拍">
        <style>
          .c-pace{font-family:var(--mono);font-size:${fs(11, 13)}px;fill:var(--ink-2);text-anchor:middle}
          .c-hr{font-family:var(--mono);font-size:${fs(10.5, 12.5)}px;fill:var(--crit);text-anchor:middle;font-weight:500}
          .c-ax{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-3);text-anchor:middle}
          .c-side{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3)}
          .c-ref{font-family:var(--mono);font-size:${fs(9.5, 10.5)}px;fill:var(--crit);text-anchor:end;opacity:.85}
        </style>
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <text x="${NARROW ? 2 : 6}" y="${padT + 10}" class="c-side">速い</text>
        <text x="${NARROW ? 2 : 6}" y="${padT + ih}" class="c-side">遅い</text>
        ${bars}
        ${hrRef}
        <path d="${path}" fill="none" stroke="var(--crit)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
        ${xlab}
      </svg></div>`;
  }

  /* ---------- グラフの元データ（ラップ一覧） ----------
     グラフのラベルは間引かれるうえ、バーの高さだけではラップタイムが読めない。
     グラフ直下に開閉式の表を置き、全ラップのペースと心拍を数値で出す。
     開閉状態は key ごとに覚えておき、画面幅の切り替えによる再描画でも閉じないようにする。 */
  const lapOpen = new Set();
  const ZONES = [
    { cls: "z-r", name: "R" }, { cls: "z-t", name: "T" },
    { cls: "z-m", name: "M" }, { cls: "z-e", name: "E" }
  ];
  // 域ごとの心拍上限（M上限167 / T上限176）。超えたラップの心拍を赤字にする
  const capOf = { "z-m": HR_CAPS[0].hr, "z-t": HR_CAPS[1].hr };
  const mmssOf = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

  function lapTable(laps, key) {
    if (!laps || !laps.length) return "";
    const zoneName = (cls) => ZONES.find(z => z.cls === cls).name;
    // 域ごとの本数・平均ペース・平均心拍。メインの区間がどのペースだったかを一行で読めるようにする
    const sum = ZONES.map(z => {
      const ls = laps.filter(l => zoneOf(l.sec) === z.cls);
      if (!ls.length) return "";
      const hs = ls.map(l => l.hr).filter(h => h != null);
      const avgSec = ls.reduce((a, l) => a + l.sec, 0) / ls.length;
      const avgHr = hs.length ? Math.round(hs.reduce((a, h) => a + h, 0) / hs.length) : null;
      return `<span><i class="zn" style="background:var(--${z.cls})"></i>${z.name}域 ${ls.length}本
        平均 <b>${mmssOf(avgSec)}</b>/km${avgHr != null ? ` ／ HR <b>${avgHr}</b>` : ""}</span>`;
    }).join("");
    const rows = laps.map(l => {
      const z = zoneOf(l.sec);
      const over = l.hr != null && capOf[z] != null && l.hr > capOf[z];
      return `<tr>
        <td>${esc(l.n)}</td>
        <td><i class="zn" style="background:var(--${z})"></i>${zoneName(z)}</td>
        <td>${esc(l.pace || mmssOf(l.sec))}</td>
        <td class="${over ? "over" : ""}">${l.hr ?? "—"}${over ? ` <span class="d">&gt;${capOf[z]}</span>` : ""}</td>
      </tr>`;
    }).join("");
    return `<details class="lapdata" data-lap="${esc(key)}" ${lapOpen.has(key) ? "open" : ""}>
        <summary>ラップ一覧（ペース・心拍）<em>${laps.length}本</em></summary>
        <div class="lapsum">${sum}</div>
        <table class="laptbl">
          <thead><tr><th>Lap</th><th>域</th><th>ペース /km</th><th>心拍 bpm</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </details>`;
  }

  /* ---------- condition charts ----------
     睡眠と HRV は別々のグラフにする。1枚に重ねると凡例がどちらの系列のものか
     分かりにくくなるため、それぞれの凡例をそのグラフの直上に置く。
     トレーニング準備度は睡眠とHRVの合成スコアなのでグラフにはしない
     （同じ情報を二重に数えることになる）。タイルと表には残す。 */

  const chartCss = () => `
    .k-sl{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--ink-2);text-anchor:middle}
    .k-sl.short{fill:var(--warn);font-weight:500}
    .k-hrv{font-family:var(--mono);font-size:${fs(10.5, 12)}px;fill:var(--z-t);text-anchor:middle;font-weight:500}
    .k-ax{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3);text-anchor:middle}
    .k-band{font-family:var(--mono);font-size:${fs(9.5, 10.5)}px;fill:var(--ink-3);text-anchor:end}
    .k-band.start{text-anchor:start}`;

  const hhmm = (m) => `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, "0")}m`;
  // スマホでは「7h13m」だと幅が足りないので「7:13」に縮める
  const hshort = (m) => NARROW
    ? `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`
    : hhmm(m);
  // X軸ラベル。スマホは「22(土)」、デスクトップは「8/22(土)」
  const dayLabel = (d) => NARROW
    ? `${String(d.d).split("/").pop()}(${d.dow})`
    : `${d.d}(${d.dow})`;

  /* 睡眠: 深い / REM / 浅い の積み上げ。濃いほど深い眠り。 */
  function sleepChart(h) {
    const days = (h && h.days) || [];
    if (!days.some(d => d.sleepMin != null)) return "";

    const W = NARROW ? 360 : 900, H = NARROW ? 200 : 212;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26;
    const padT = 22, padB = NARROW ? 26 : 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const base = padT + ih;

    const target = h.sleepTargetMin ?? 420;
    const max = Math.max(...days.map(d => d.sleepMin || 0), target) * 1.14;
    const y = (m) => base - (m / max) * ih;

    const bw = iw / days.length;
    const barW = Math.min(bw * 0.5, 36);

    const layers = [
      { key: "sleepDeep",  label: "深い", op: 1 },
      { key: "sleepRem",   label: "REM",  op: .58 },
      { key: "sleepLight", label: "浅い", op: .26 }
    ];

    const bars = days.map((d, i) => {
      const total = d.sleepMin;
      if (total == null) return "";
      const x = padL + bw * i + (bw - barW) / 2;
      const parts = layers.filter(l => d[l.key] != null);
      let acc = 0;
      // 内訳が取れていなければ合計だけの単色バーにする
      const segs = (parts.length ? parts : [{ key: null, label: "睡眠", op: .7 }]).map(l => {
        const v = l.key ? d[l.key] : total;
        const yTop = y(acc + v), hgt = Math.max(1, y(acc) - yTop);
        acc += v;
        return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}"
                  height="${hgt.toFixed(1)}" fill="var(--accent)" opacity="${l.op}">
                  <title>${esc(d.d)} ${l.label} ${hhmm(v)}</title></rect>`;
      }).join("");
      const short = total < target;
      return segs + `<text x="${(x + barW / 2).toFixed(1)}" y="${(y(total) - 6).toFixed(1)}"
        class="k-sl${short ? " short" : ""}">${hshort(total)}</text>`;
    }).join("");

    const xlab = days.map((d, i) =>
      `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 8 : 10)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");

    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--accent)"></i>深い睡眠</span>
        <span><i style="background:var(--accent);opacity:.58"></i>REM睡眠</span>
        <span><i style="background:var(--accent);opacity:.26"></i>浅い睡眠</span>
        <span class="ref">破線 = 目標 ${hhmm(target)}</span>
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="直近7日の睡眠時間と内訳">
        <style>${chartCss()}</style>
        <line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${padL}" y1="${y(target).toFixed(1)}" x2="${W - padR}" y2="${y(target).toFixed(1)}"
              stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>
        <text x="${padL - 5}" y="${(y(target) + 3).toFixed(1)}" class="k-band">${hshort(target)}</text>
        ${bars}
        ${xlab}
      </svg></div></div>`;
  }

  /* HRV: バランス域の帯 + 前夜平均のライン */
  function hrvChart(h) {
    const days = (h && h.days) || [];
    const hrvs = days.map(d => d.hrv).filter(v => v != null);
    if (!hrvs.length) return "";

    const W = NARROW ? 360 : 900, H = NARROW ? 142 : 150;
    const padL = NARROW ? 30 : 42, padR = NARROW ? 8 : 26;
    const padT = 20, padB = NARROW ? 24 : 28;
    const iw = W - padL - padR, ih = H - padT - padB;

    const bl = h.baseline || {};
    const lo = Math.min(...hrvs, bl.hrvLow ?? Infinity) - 8;
    const hi = Math.max(...hrvs, bl.hrvHigh ?? -Infinity) + 8;
    const y = (v) => padT + ih - ((v - lo) / (hi - lo)) * ih;

    const bw = iw / days.length;

    const band = (bl.hrvLow != null && bl.hrvHigh != null)
      ? `<rect x="${padL}" y="${y(bl.hrvHigh).toFixed(1)}" width="${iw}"
           height="${(y(bl.hrvLow) - y(bl.hrvHigh)).toFixed(1)}"
           fill="var(--accent)" opacity=".08"/>
         <text x="${padL - 5}" y="${(y(bl.hrvHigh) + 4).toFixed(1)}" class="k-band">${bl.hrvHigh}</text>
         <text x="${padL - 5}" y="${(y(bl.hrvLow) + 4).toFixed(1)}" class="k-band">${bl.hrvLow}</text>`
      : "";

    const pts = days.map((d, i) => d.hrv == null ? null
      : [padL + bw * i + bw / 2, y(d.hrv), d.hrv]).filter(Boolean);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const dots = pts.map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--z-t)" stroke-width="2"/>
       <text x="${p[0].toFixed(1)}" y="${(p[1] - 9).toFixed(1)}" class="k-hrv">${p[2]}</text>`).join("");

    const xlab = days.map((d, i) =>
      `<text x="${(padL + bw * i + bw / 2).toFixed(1)}" y="${H - (NARROW ? 7 : 9)}" class="k-ax">${esc(dayLabel(d))}</text>`).join("");

    return `<div class="chartblock"><div class="chart-legend">
        <span><i style="background:var(--z-t);border-radius:50%"></i>HRV 前夜平均 ms</span>
        ${bl.hrvLow != null ? `<span class="ref">帯 = バランス域 ${bl.hrvLow}–${bl.hrvHigh}（ここを下抜けしたら要注意）</span>` : ""}
      </div>
      <div class="chart-scroll"><svg class="cond" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="直近7日のHRVの推移">
        <style>${chartCss()}</style>
        ${band}
        <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--line)" stroke-width="1"/>
        <path d="${path}" fill="none" stroke="var(--z-t)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
        ${xlab}
      </svg></div></div>`;
  }

  /* ---------- condition table ---------- */
  // 歩数はこの値以上の日を色で立てる（走行込み）。9/9・9/10・9/24 のように 19,000〜23,000歩の日に
  // BB最低が 11〜14 まで落ちており、回復を削る主因になっていたため。
  const STEPS_HIGH = 18000;

  function condTable(days, bl) {
    const num = (v, suffix) => v == null ? "—" : `${v}${suffix || ""}`;
    const hm = (m) => m == null ? "—" : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
    // 狭い画面では 20,145 → 20.1k に縮める（9列を1画面に収めるため）
    const stepsOf = (v) => v == null ? "—" : NARROW ? `${(v / 1000).toFixed(1)}k` : Number(v).toLocaleString("en-US");
    const lowHrv = bl && bl.hrvLow != null ? bl.hrvLow : null;
    // 警戒側の値を色で立てる: 睡眠<目標 / HRV<バランス域下限 / BB最低<20 / 準備度<50 / 歩数≥18,000
    const target = (bl && bl.sleepTargetMin) || 420;
    // 歩数は Routine が書いたときだけ列を出す（古い DATA には無い）
    const hasSteps = days.some(d => d.steps != null);
    const rows = days.map(d => `<tr>
        <td>${esc(d.d)}(${esc(d.dow)})</td>
        <td>${num(d.sleep)}</td>
        <td class="${d.sleepMin != null && d.sleepMin < target ? "lo" : ""}">${hm(d.sleepMin)}</td>
        <td class="${d.hrv != null && lowHrv != null && d.hrv < lowHrv ? "lo" : ""}">${num(d.hrv)}</td>
        <td>${num(d.rhr)}</td>
        <td class="${d.bbLow != null && d.bbLow < 20 ? "lo" : ""}">${num(d.bbLow)}</td>
        <td>${num(d.stress)}</td>
        <td class="${d.readiness != null && d.readiness < 50 ? "lo" : ""}">${num(d.readiness)}</td>
        ${hasSteps ? `<td class="${d.steps != null && d.steps >= STEPS_HIGH ? "lo" : ""}">${stepsOf(d.steps)}</td>` : ""}
      </tr>`).join("");
    return `<div class="htab-scroll"><table class="htab">
      <thead><tr>
        <th>日付</th><th>睡眠</th><th>睡眠時間</th><th>HRV</th>
        <th>安静心拍</th><th>BB最低</th><th>ストレス</th><th>準備度</th>${hasSteps ? "<th>歩数</th>" : ""}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  /* ---------- condition card ---------- */
  function condCard(h) {
    if (!h || !h.days || !h.days.length) return "";
    const cmp = (s) => {
      if (s.avg == null) return "";
      const bits = [`週平均 ${s.avg}`];
      if (s.prev != null) {
        const pct = s.prev !== 0 ? Math.round((s.avg / s.prev - 1) * 100) : 0;
        const arrow = Math.abs(pct) < 3 ? "→" : (pct > 0 ? "▲" : "▼");
        // 安静時心拍やストレスは上がるほど悪い。矢印の向きではなく良し悪しで色を決める。
        const better = s.lowerIsBetter ? pct < 0 : pct > 0;
        const dir = Math.abs(pct) < 3 ? "flat" : (better ? "up" : "down");
        bits.push(`<span class="d ${dir}">${arrow} 前週 ${s.prev}${pct !== 0 ? `（${pct > 0 ? "+" : ""}${pct}%）` : ""}</span>`);
      }
      return `<div class="hstat-cmp">${bits.join(" ")}</div>`;
    };
    const f = h.fitness || {};
    const r = f.race || {};
    const vo2delta = (f.vo2max != null && f.vo2maxPrev != null)
      ? (f.vo2max - f.vo2maxPrev).toFixed(1) : null;
    const races = [["5K", r.k5], ["10K", r.k10], ["ハーフ", r.half], ["フル", r.full]]
      .filter(x => x[1])
      .map(x => `<div><span class="t">${esc(x[1])}</span><span class="l">${esc(x[0])}</span></div>`).join("");

    return `<section class="card">
      <div class="card-head"><h2>健康データ</h2><span class="sub">${esc(h.label || "")}</span></div>
      <div class="card-body">
        <div class="hstats">
          ${h.summary.map(s => `<div class="hstat ${s.state === "ok" ? "" : esc(s.state)}">
            <div class="hstat-l">${esc(s.label)}</div>
            <div class="hstat-v">${s.value == null ? "—" : esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
            ${cmp(s)}
            <div class="hstat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
          </div>`).join("")}
        </div>
        ${prose("読み取り", h.read)}
        <div class="divider"></div>
        <div class="sub-h">睡眠</div>
        ${sleepChart(h)}
        <div class="sub-h">HRV（心拍変動）</div>
        ${hrvChart(h)}
        <div class="sub-h">日次データ</div>
        ${condTable(h.days, { ...(h.baseline || {}), sleepTargetMin: h.sleepTargetMin })}
        <p class="hnote">色付きの値は警戒側（睡眠が目標未満・HRV がバランス域の下・BB最低 20 未満・準備度 50 未満${h.days.some(d => d.steps != null) ? `・歩数 ${STEPS_HIGH.toLocaleString("en-US")} 以上` : ""}）。「—」は Garmin から取れていない日（当日の BB最低・ストレス・歩数は一日が終わるまで確定しないので空けてある）。</p>
        ${(f.vo2max != null || races) ? `<div class="divider"></div>
        <div class="fitrow">
          ${f.vo2max != null ? `<div><span class="n">${f.vo2max}</span>
            <span class="l">VO2max${vo2delta !== null
              ? `（週初 ${f.vo2maxPrev} → ${vo2delta >= 0 ? "+" : ""}${vo2delta}）` : ""}</span></div>` : ""}
          ${f.trainingStatus ? `<div><span class="n">${esc(f.trainingStatus)}</span>
            <span class="l">トレーニングステータス</span></div>` : ""}
          ${races ? `<div><div class="racelist">${races}</div>
            <span class="l" style="margin-top:4px">Garmin レース予測タイム</span></div>` : ""}
        </div>` : ""}
        <div class="divider"></div>
        <div class="sub-h">指標の見かた</div>
        <dl class="gloss">
          <dt>HRV（心拍変動）</dt>
          <dd>拍と拍の間隔のゆらぎ（ms）。睡眠中に測る。回復モード（副交感神経）が優位なほど高い。
            疲労・ストレス・暑熱・飲酒で下がる。個人差が大きいので絶対値ではなく、
            Garmin が直近3週間から作る「バランス域」との相対で見る。下抜けが続いたら要注意。</dd>
          <dt>安静時心拍</dt>
          <dd>睡眠中の最も低い心拍。平常より +3bpm 以上の日が続くときは、疲労か体調不良を疑う。</dd>
          <dt>睡眠の内訳</dt>
          <dd>深い睡眠は身体の回復（成長ホルモン分泌）、REM睡眠は神経系の回復に効く。
            合計時間が足りていても深い睡眠が短い夜が続くと、脚の回復が追いつかない。</dd>
          <dt>ボディバッテリー</dt>
          <dd>HRV・ストレス・活動量から算出する 0〜100 の残量計。最低値が 20 を切る日が続くのは
            使い切っているサイン。</dd>
          <dt>トレーニング準備度</dt>
          <dd>睡眠・睡眠負債・HRV・直近の練習負荷・ストレスをまとめた 0〜100 の合成スコア。
            上の各指標の要約なので、グラフではなくこの数値だけを見れば足りる。</dd>
        </dl>
      </div>
    </section>`;
  }

  /* ---------- 明日のメニューの構成 ----------
     segments[] は { zone, km, label, pace, hr, note }。
     zone は週プランと同じ E / M / T / R / rest。 */
  const numOf = (v) => {
    const m = String(v == null ? "" : v).match(/\d+(\.\d+)?/);
    return m ? Number(m[0]) : null;
  };

  function segTable(segs) {
    if (!segs || !segs.length) return "";
    return `<div class="segs">${segs.map(x => {
      const meta = [x.pace ? `ペース ${x.pace}` : null, x.hr ? `HR ${x.hr}` : null]
        .filter(Boolean).join("　／　");
      return `<div class="segrow">
        <span class="tp ${esc(x.zone || "E")}">${x.zone === "rest" ? "休" : esc(x.zone || "E")}</span>
        <span class="seg-n">${esc(x.label || "")}</span>
        <span class="seg-k">${numOf(x.km) ? `${esc(x.km)}<em>km</em>` : "—"}</span>
        ${meta ? `<span class="seg-m">${esc(meta)}</span>` : ""}
        ${x.note ? `<span class="seg-o">${esc(x.note)}</span>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  /* ---------- week plan（明日から1週間・要点だけ） ---------- */
  function planCard(p) {
    if (!p || !p.days || !p.days.length) return "";
    const rows = p.days.map((d, i) => `<div class="plan-row ${d.type === "rest" ? "rest" : ""}">
        <span class="plan-d">${esc(d.d)}(${esc(d.dow)})${i === 0 ? `<span class="tm">明日</span>` : ""}</span>
        <span class="tp ${esc(d.type)}">${d.type === "rest" ? "休" : esc(d.type)}</span>
        <span class="plan-t">${esc(d.title)}</span>
        <span class="plan-km">${d.km == null || d.km === "0" ? "—" : `${esc(d.km)}<em>km</em>`}</span>
        <span class="plan-n">${d.note ? esc(d.note) : ""}</span>
      </div>`).join("");
    // 要約行。手順書の自己チェック（質練習の本数・休養日・週間距離）がそのまま目で確認できるようにする
    const sumKm = p.days.reduce((a, d) => a + (numOf(d.km) || 0), 0);
    const quality = p.days.filter(d => ["M", "T", "R"].includes(d.type)).length;
    const restDays = p.days.filter(d => d.type === "rest").length;
    const summary = `<div class="plan-sum">
        <span>予定 <b>${esc(p.totalKm || sumKm)}</b> km</span>
        <span>質練習 <b>${quality}</b> 本</span>
        <span>走る日 <b>${p.days.length - restDays}</b> 日</span>
        <span>休養 <b>${restDays}</b> 日</span>
      </div>`;
    return `<section class="card">
      <div class="card-head"><h2>この先1週間</h2><span class="sub">${esc(p.label || "")}</span></div>
      <div class="card-body">
        ${p.aim || p.policy ? `<div class="blk"><b>ねらい</b><p class="lead">${esc(p.aim || p.policy)}</p></div>` : ""}
        ${summary}
        <div class="plan">${rows}</div>
      </div>
    </section>`;
  }

  /* ---------- week bars ---------- */
  function weekBars(w) {
    const max = Math.max(...w.days.map(d => d.km), 1);
    return w.days.map(d => {
      const h = d.km > 0 ? Math.max(4, (d.km / max) * 74) : 4;
      const cls = d.km > 0 ? d.type : "rest";
      return `<div class="wd">
        <span class="wd-km">${d.km > 0 ? d.km.toFixed(1) : "—"}</span>
        <span class="wd-bar ${cls}" style="height:${h.toFixed(0)}px" title="${esc(d.d)} ${d.km}km${d.hr ? " HR" + d.hr : ""}"></span>
        <span class="wd-d">${esc(d.dow)}</span>
      </div>`;
    }).join("");
  }

  function statsGrid(stats) {
    if (!stats || !stats.length) return "";
    return `<div class="stats">${stats.map(s => `<div class="stat ${s.state === "ok" ? "" : esc(s.state)}">
        <div class="stat-l">${esc(s.label)}</div>
        <div class="stat-v">${esc(s.value)}${s.unit ? `<em>${esc(s.unit)}</em>` : ""}</div>
        <div class="stat-n">${s.note ? esc(s.note) : "&nbsp;"}</div>
      </div>`).join("")}</div>`;
  }

  // 履歴のラップは "sec:hr,sec:hr,…" の1行で持つ。
  // ペースは秒から復元できるので保存しない（保存量をおよそ1/4にするため）。
  function expandLaps(v) {
    if (Array.isArray(v)) return v;
    if (typeof v !== "string" || !v) return [];
    return v.split(",").map((pair, i) => {
      const parts = pair.split(":");
      const sec = Number(parts[0]);
      if (!isFinite(sec) || sec <= 0) return null;
      const hr = parts[1] === "" || parts[1] == null ? null : Number(parts[1]);
      return {
        n: i + 1, sec,
        pace: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`,
        hr: isFinite(hr) ? hr : null
      };
    }).filter(Boolean);
  }

  function pointsList(pts) {
    if (!pts || !pts.length) return "";
    return `<ul class="pts">${pts.map(p => `<li class="pt ${esc(p.tone || "note")}">
        <span class="pt-i">${toneMark[p.tone] || toneMark.note}</span>
        <span class="pt-l">${esc(p.label)}</span>
        <span class="pt-t">${esc(p.text)}</span>
      </li>`).join("")}</ul>`;
  }

  /* ---------- 過去の評価 ----------
     過去分は DATA に持たせない。持たせると Routine が毎日その全部を
     書き直すことになり、日を追うごとに生成コストが増え続けるため。
     代わりに Artifact の db に 1日1件だけ書き、ページ側が開いたときに読む。
     したがって DATA の大きさは何日経っても変わらない。 */
  // 読む件数。「進捗」タブの推移（週間距離・持続力）にも使うので約5か月分読む。
  // 一覧に出すのは HIST_PAGE 件ずつ（「さらに表示」で増やす）。
  const HIST_DAYS = 150;
  const HIST_PAGE = 30;
  let histRows = null;            // db から読んだ過去エントリ
  let histState = "loading";      // loading / ready / off / error
  let histSel = null;             // 開いている日付
  let histShow = HIST_PAGE;       // 一覧に出している件数

  // 履歴1件の識別子。同じ日の2本目以降は seq を持つ（doc_id は "2026-09-09-2"）
  const rowKey = (h) => (h.seq > 1 ? `${h.d}-${h.seq}` : h.d);
  // 新しい日を上に、同じ日は1本目から順に
  const sortRows = (rows) => rows.sort((a, b) => String(b.d).localeCompare(String(a.d)) || (a.seq || 1) - (b.seq || 1));

  // 今日の分は db への書き込みを待たずに DATA から組み立てて先頭に出す。
  // 同じ日に2本以上走った日は today.extra[] に2本目以降が入っている。
  function todayRows() {
    const t = D.today || {};
    const toRow = (run, seq) => {
      const pick = (label) => {
        const s = (run.stats || []).find(x => x.label === label);
        return s ? s.value : null;
      };
      return {
        d: t.date, dow: t.dow, seq, type: run.type, verdict: run.verdict, verdictLabel: run.verdictLabel,
        km: pick("距離"), pace: pick("平均ペース"), hr: pick("平均心拍"),
        headline: run.headline, points: run.points || [],
        stats: run.stats || [], effect: run.effect || "", laps: run.laps || [],
        pred: ((D.health || {}).fitness || {}).race ? D.health.fitness.race.full || null : null
      };
    };
    if (!t.date) return [];
    return [toRow(t, 1)].concat((Array.isArray(t.extra) ? t.extra : []).map((r, i) => toRow(r, i + 2)));
  }

  async function loadHistory() {
    try {
      const use = window.claude && window.claude.use;
      const db = use ? await window.claude.use("db") : null;
      if (!db) { histState = "off"; paintHistory(); return; }
      const snap = await db.collection("runs").orderBy("d", "desc").limit(HIST_DAYS).get();
      histRows = sortRows(snap.docs.map(x => x.data()).filter(Boolean));
      histState = "ready";
    } catch (e) {
      histState = "error";
    }
    paintHistory();
  }

  function histHtml() {
    const todays = todayRows();
    const todayD = todays.length ? todays[0].d : null;
    const past = (histRows || []).filter(h => h && h.d && h.d !== todayD);
    const rows = todays.concat(past);

    let note = "";
    if (histState === "loading") note = `<p class="hnote">過去の評価を読み込んでいます…</p>`;
    else if (histState === "off") note = `<p class="hnote">この画面では保存済みの履歴を読み出せません。今日の分だけ表示しています。</p>`;
    else if (histState === "error") note = `<p class="hnote">履歴の読み込みに失敗しました。再読み込みしてください。今日の分だけ表示しています。</p>`;
    else if (!past.length) note = `<p class="hnote">保存済みの過去データはまだありません。毎日 12:00 JST の更新で1日ぶんずつ積み上がります。</p>`;

    // 直近の記録を横に並べるストリップは 2026-09-15 に付けてすぐ外した
    // （下の一覧と同じ情報で、日付が増えると横スクロールが面倒になるため）。凡例だけ残す。
    const legend = `<div class="hlegend">
        <span><b class="v-good">◎</b> 完璧</span><span><b class="v-good">○</b> 合格</span>
        <span><b class="v-warn">△</b> 要調整</span><span><b class="v-crit">✕</b> 中止</span>
        <span><b class="v-rest">—</b> 休養</span>
      </div>`;

    const list = rows.slice(0, histShow).map(h => {
      const key = rowKey(h);
      const open = histSel === key;
      const meta = [
        h.pace ? `平均ペース ${h.pace}/km` : null,
        h.hr ? `平均心拍 ${h.hr}bpm` : null,
        h.verdictLabel ? `総合評価 ${h.verdict || ""} ${h.verdictLabel}` : null
      ].filter(Boolean).join("　／　");
      return `<div class="hitem ${open ? "open" : ""}">
        <button class="hbtn" type="button" data-d="${esc(key)}" aria-expanded="${open}">
          <span class="hd">${esc(h.d)}${h.dow ? `<em>(${esc(h.dow)})</em>` : ""}${h.d === todayD ? `<span class="htoday">今日</span>` : ""}${h.seq > 1 ? `<span class="htoday">${h.seq}本目</span>` : ""}</span>
          <span class="ht">${esc(h.type || "")}</span>
          <span class="hk">${h.km != null && h.km !== "" ? `${esc(h.km)}<em>km</em>` : ""}</span>
          <span class="hv ${vcls(h.verdict)}">${esc(h.verdict || "")}</span>
        </button>
        ${open ? `<div class="hbody">
          ${statsGrid(h.stats)}
          ${h.effect ? `<div class="effect">トレーニング効果: ${esc(h.effect)}</div>` : ""}
          ${(() => { const lp = expandLaps(h.laps); return lp.length ? `<div class="chart-box">${lapChart(lp)}${lapTable(lp, "h:" + key)}</div>` : ""; })()}
          ${h.headline ? `<p class="cmt-h">${esc(h.headline)}</p>` : ""}
          ${pointsList(h.points)}
          ${meta ? `<div class="hmeta">${esc(meta)}</div>` : ""}
        </div>` : ""}
      </div>`;
    }).join("");

    const more = rows.length > histShow
      ? `<button class="hmore" type="button" data-more="1">さらに表示（残り ${rows.length - histShow} 件）</button>` : "";
    return `${note}${legend}<div class="hlist">${list}</div>${more}`;
  }

  function paintHistory() {
    const el = document.getElementById("hist");
    if (el) el.innerHTML = histHtml();
    const pr = document.getElementById("prog");
    if (pr) pr.innerHTML = progressHtml();
    const pb = document.getElementById("pb");
    if (pb) pb.innerHTML = pbHtml();
  }

  /* ---------- 進捗（シーズンの現在地と走力の推移） ----------
     すべて db の履歴（ラップ込み）と DATA.season から計算する。
     Routine に書き起こさせる値は増やしていない（毎日の生成コストを増やさないため）。

     指標の定義（docs/athlete_profile.md のペースゾーンから）:
       - 持続力 … 4:25/km（Mペース帯の上限）以内のラップが何本続いたか。ラップは1kmなので本数≒km。
                   3:20/km より速いラップは流し・短いレペなので数えない（連続も切る）。
                   「4:15 を保てた最長」をラップから機械的に数えたもの。
       - 有酸素の効率 … Eだけの日の、E帯（5:30〜6:00/km）のラップの平均心拍。1本目（アップ）は除く。
                   M以上のラップがある日は、本セット後に心拍が高止まりするので数えない。
                   同じ帯を低い心拍で走れるようになっていれば有酸素の土台が伸びている。 */
  const M_EDGE = 265, STRIDE_EDGE = 200, E_BAND = [330, 360];
  const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  const isoAdd = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const mondayOf = (iso) => isoAdd(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
  const mdOf = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
  const secOf = (s) => { const p = String(s || "").split(":").map(Number); return p.length > 1 && p.every(isFinite) ? p.reduce((a, v) => a * 60 + v, 0) : null; };
  const hmsOf = (s) => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  function streakOf(laps) {
    let best = null, cur = [];
    const flush = () => {
      if (cur.length && (!best || cur.length > best.km)) {
        const hs = cur.map(l => l.hr).filter(h => h != null);
        best = { km: cur.length, sec: Math.round(avg(cur.map(l => l.sec))), hr: hs.length ? Math.round(avg(hs)) : null };
      }
      cur = [];
    };
    laps.forEach(l => { if (l.sec >= STRIDE_EDGE && l.sec <= M_EDGE) cur.push(l); else flush(); });
    flush();
    return best;
  }
  function eEffOf(laps) {
    // 質練習を含む日（Mペース帯より速いラップがある日）は除く。本セット後のEラップは心拍が高止まりするため
    if (laps.some(l => l.sec >= STRIDE_EDGE && l.sec <= ZONE_EDGE.m)) return null;
    const ls = laps.slice(1).filter(l => l.sec >= E_BAND[0] && l.sec <= E_BAND[1] && l.hr != null);
    return ls.length >= 3 ? { hr: Math.round(avg(ls.map(l => l.hr)) * 10) / 10, sec: Math.round(avg(ls.map(l => l.sec))), n: ls.length } : null;
  }

  // 今日（DATA）と履歴（db）を合わせた走行記録。古い順。
  function allRuns() {
    const todays = todayRows();
    const todayD = todays.length ? todays[0].d : null;
    const rows = todays.concat((histRows || []).filter(h => h && h.d && h.d !== todayD));
    return rows.map(h => {
      const laps = expandLaps(h.laps);
      return { d: h.d, seq: h.seq || 1, km: Number(h.km) || 0, verdict: h.verdict, type: h.type || "",
        pred: secOf(h.pred), laps, streak: laps.length ? streakOf(laps) : null, eff: laps.length ? eEffOf(laps) : null };
    }).sort((a, b) => a.d.localeCompare(b.d) || a.seq - b.seq);
  }

  const phaseAt = (iso) => ((D.season && D.season.phases) || []).find(p => p.from <= iso && iso <= p.to) || null;

  // ヒーローに出す「記録上の最長を更新」。事実だけを出す（評価を甘くしない）。
  function pbHtml() {
    if (histState !== "ready" || !D.today || !D.today.date) return "";
    const runs = allRuns();
    const mine = runs.filter(r => r.d === D.today.date);
    const before = runs.filter(r => r.d < D.today.date && r.streak);
    const s = mine.map(r => r.streak).filter(Boolean).sort((a, b) => b.km - a.km)[0];
    if (!s || s.km < 3 || !before.length) return "";
    const prev = Math.max(...before.map(r => r.streak.km));
    if (s.km < prev) return "";
    return `<span class="pb">${s.km > prev ? "記録上の最長を更新" : "記録上の最長に並んだ"}：4:25以内を <b>${s.km}km</b> 連続（平均 ${mmssOf(s.sec)}${s.hr ? `・HR${s.hr}` : ""}）</span>`;
  }

  /* シーズンの帯。フェーズを期間に比例した幅で並べ、レースと今日を印で示す。 */
  function seasonChart(season, today) {
    const ph = season.phases;
    const start = ph[0].from, end = ph[ph.length - 1].to;
    const total = dayDiff(start, end) + 1;
    const W = NARROW ? 360 : 900, H = NARROW ? 96 : 92;
    const padL = 4, padR = 4, top = 30, bh = 22;
    const x = (iso) => padL + (dayDiff(start, iso) / total) * (W - padL - padR);
    const kind = (p) => /回復/.test(p.name) ? "rec" : /テーパー|レース週/.test(p.name) ? "tap" : /特異|最終ビルド/.test(p.name) ? "spec" : "base";
    const fill = { base: "var(--z-e)", spec: "var(--z-m)", tap: "var(--accent-soft)", rec: "var(--surface-2)" };
    const rects = ph.map(p => {
      const x0 = x(p.from), x1 = x(isoAdd(p.to, 1)), w = Math.max(1, x1 - x0 - 1);
      const num = (p.name.match(/Phase\s*(\d+)/) || [])[1];
      const done = p.to < today;
      return `<rect x="${x0.toFixed(1)}" y="${top}" width="${w.toFixed(1)}" height="${bh}" rx="2" fill="${fill[kind(p)]}" opacity="${done ? .45 : .95}"><title>${esc(p.name)} ${mdOf(p.from)}〜${mdOf(p.to)} ／ 週 ${esc(p.km)}km</title></rect>
        ${num && w >= (NARROW ? 13 : 20) ? `<text x="${(x0 + w / 2).toFixed(1)}" y="${top + bh / 2 + 4}" class="s-ph${kind(p) === "tap" || kind(p) === "rec" ? " dark" : ""}">${NARROW ? num : "P" + num}</text>` : ""}`;
    }).join("");
    const races = season.races.map((r, i) => {
      const rx = x(r.date);
      const anchor = rx > W * 0.8 ? "end" : rx < W * 0.2 ? "start" : "middle";
      return `<line x1="${rx.toFixed(1)}" y1="${top - 4}" x2="${rx.toFixed(1)}" y2="${top + bh + 4}" stroke="var(--ink)" stroke-width="1.5"/>
        <text x="${rx.toFixed(1)}" y="${top - 8}" class="s-race" text-anchor="${anchor}">🏁 ${esc(r.name.replace(/マラソン.*$/, ""))}</text>`;
    }).join("");
    const months = [];
    for (let d = start.slice(0, 8) + "01"; d <= end; d = isoAdd(d.slice(0, 8) + "28", 4).slice(0, 8) + "01") {
      if (d >= start) months.push(`<text x="${x(d).toFixed(1)}" y="${top + bh + 18}" class="s-ax">${+d.slice(5, 7)}月</text>`);
    }
    const tIn = today >= start && today <= end;
    const tx = tIn ? x(today) : null;
    const marker = tIn ? `<path d="M${(tx - 5).toFixed(1)},${top + bh + 5} L${(tx + 5).toFixed(1)},${top + bh + 5} L${tx.toFixed(1)},${top + bh - 3} Z" fill="var(--crit)"/>
      <line x1="${tx.toFixed(1)}" y1="${top}" x2="${tx.toFixed(1)}" y2="${top + bh}" stroke="var(--crit)" stroke-width="2"/>` : "";
    return `<div class="chart-legend" style="padding:0 0 4px">
        <span><i style="background:var(--z-e)"></i>ベース・LT</span>
        <span><i style="background:var(--z-m)"></i>マラソン特異</span>
        <span><i style="background:var(--accent-soft)"></i>テーパー</span>
        <span><i style="background:var(--surface-2);outline:1px solid var(--line)"></i>回復</span>
        <span><i style="background:var(--crit)"></i>今日</span>
      </div>
      <svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="シーズンのフェーズと現在地">
        <style>
          .s-ph{font-family:var(--num);font-weight:700;font-size:${fs(11, 11)}px;fill:#fff;text-anchor:middle}
          .s-ph.dark{fill:var(--ink-2)}
          .s-race{font-family:var(--jp);font-weight:700;font-size:${fs(11, 11.5)}px;fill:var(--ink)}
          .s-ax{font-family:var(--mono);font-size:${fs(10, 11)}px;fill:var(--ink-3)}
        </style>
        ${rects}${races}${months.join("")}${marker}
      </svg>`;
  }

  /* 棒グラフ（週間距離・持続力で共用）。bars: [{ label, v, cls, ref, tip, top }]。
     ref は棒ごとの基準線（週の下限など）、line は全体に引く横線。 */
  function barChart(bars, o) {
    if (!bars.length) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 190 : 200;
    const padL = NARROW ? 8 : 12, padR = NARROW ? 8 : 12, padT = 22, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = Math.max(...bars.map(b => Math.max(b.v, b.ref || 0)), o.line ? o.line.v : 0, 1) * 1.1;
    const y = (v) => padT + ih - (v / max) * ih;
    const bw = iw / bars.length, barW = Math.min(bw * 0.62, 46);
    const body = bars.map((b, i) => {
      const cx = padL + bw * i + bw / 2, x0 = cx - barW / 2;
      const h = Math.max(b.v > 0 ? 2 : 0, padT + ih - y(b.v));
      return `<rect x="${x0.toFixed(1)}" y="${(padT + ih - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${b.fill}" opacity="${b.op ?? .9}"><title>${esc(b.tip || "")}</title></rect>
        ${b.ref ? `<line x1="${(x0 - 3).toFixed(1)}" x2="${(x0 + barW + 3).toFixed(1)}" y1="${y(b.ref).toFixed(1)}" y2="${y(b.ref).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 2"/>` : ""}
        ${b.top != null ? `<text x="${cx.toFixed(1)}" y="${(Math.min(padT + ih - h, b.ref ? y(b.ref) : Infinity) - 5).toFixed(1)}" class="b-v">${esc(b.top)}</text>` : ""}
        ${(NARROW && bars.length > 8 && i % 2 && i !== bars.length - 1) ? "" : `<text x="${cx.toFixed(1)}" y="${H - 8}" class="b-ax">${esc(b.label)}</text>`}`;
    }).join("");
    const line = o.line ? `<line x1="${padL}" x2="${W - padR}" y1="${y(o.line.v).toFixed(1)}" y2="${y(o.line.v).toFixed(1)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
      <text x="${W - padR}" y="${(y(o.line.v) - 4).toFixed(1)}" class="b-ref">${esc(o.line.label)}</text>` : "";
    return `<svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
        <style>
          .b-v{font-family:var(--num);font-weight:700;font-size:${fs(11, 12)}px;fill:var(--ink);text-anchor:middle}
          .b-ax{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--ink-3);text-anchor:middle}
          .b-ref{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--crit);text-anchor:end}
        </style>
        <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--line)"/>
        ${line}${body}
      </svg>`;
  }

  /* 折れ線（有酸素の効率・フル予測で共用）。pts: [{ label, v, tip }]。lower=true なら低いほど良い。 */
  function lineChart(pts, o) {
    if (pts.length < 2) return "";
    const W = NARROW ? 360 : 900, H = NARROW ? 160 : 170;
    const padL = NARROW ? 10 : 16, padR = NARROW ? 10 : 16, padT = 22, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const vs = pts.map(p => p.v).concat(o.line ? [o.line.v] : []);
    const lo = Math.min(...vs), hi = Math.max(...vs), span = Math.max(hi - lo, o.minSpan || 1);
    const y = (v) => padT + ih - ((v - (lo - span * .15)) / (span * 1.3)) * ih;
    const x = (i) => padL + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const stride = Math.max(1, Math.ceil(pts.length / (NARROW ? 6 : 14)));
    // 両端のラベルは内側へ寄せる（中央揃えだと画面の外にはみ出す）
    const edge = (i) => i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle";
    const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2" fill="var(--surface)" stroke="${o.color}" stroke-width="2"><title>${esc(p.tip || "")}</title></circle>
      ${(i % stride === 0 || i === pts.length - 1) ? `<text x="${x(i).toFixed(1)}" y="${(y(p.v) - 10).toFixed(1)}" class="l-v" text-anchor="${edge(i)}">${esc(o.fmt ? o.fmt(p.v) : p.v)}</text>
      <text x="${x(i).toFixed(1)}" y="${H - 8}" class="l-ax" text-anchor="${edge(i)}">${esc(p.label)}</text>` : ""}`).join("");
    const line = o.line ? `<line x1="${padL}" x2="${W - padR}" y1="${y(o.line.v).toFixed(1)}" y2="${y(o.line.v).toFixed(1)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
      <text x="${W - padR}" y="${(y(o.line.v) - 4).toFixed(1)}" class="b-ref">${esc(o.line.label)}</text>` : "";
    return `<svg class="prog" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
        <style>
          .l-v{font-family:var(--mono);font-size:${fs(10.5, 11.5)}px;fill:${o.color};font-weight:500}
          .l-ax{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--ink-3)}
          .b-ref{font-family:var(--mono);font-size:${fs(10, 10.5)}px;fill:var(--crit);text-anchor:end}
        </style>
        <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--line)"/>
        ${line}
        <path d="${path}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
        ${dots}
      </svg>`;
  }

  function progressHtml() {
    const today = (D.today && D.today.date) || dateOf(D.meta && D.meta.generatedAt);
    const season = D.season && D.season.phases && D.season.phases.length ? D.season : null;
    const runs = allRuns();
    const haveHist = histState === "ready";
    const out = [];
    const tile = (l, v, unit, n, cls) => `<div class="ktile"><span class="ktile-l">${esc(l)}</span>
        <span class="ktile-v">${v}${unit ? `<em>${esc(unit)}</em>` : ""}</span>
        ${n ? `<span class="ktile-n ${cls || ""}">${n}</span>` : ""}</div>`;

    // ---- 持続力（4:25以内の連続）----
    const withStreak = runs.filter(r => r.streak && r.streak.km >= 2);
    // 同じ長さなら 4:15 に近いほう（閾値走より M 走を代表にする）、それも同じなら新しいほう
    const best = withStreak.slice().sort((a, b) => b.streak.km - a.streak.km
      || Math.abs(a.streak.sec - 255) - Math.abs(b.streak.sec - 255) || (a.d < b.d ? 1 : -1))[0] || null;
    const recent = withStreak.filter(r => dayDiff(r.d, today) < 14);
    const recentBest = recent.length ? Math.max(...recent.map(r => r.streak.km)) : 0;
    const targets = (season && season.mTargets) || [];
    const curT = targets.find(t => t.until >= today) || null;
    const nextT = curT ? targets[targets.indexOf(curT) + 1] || null : null;
    const bestBy = (iso) => Math.max(0, ...withStreak.filter(r => r.d <= iso).map(r => r.streak.km));

    // ---- 週間距離 ----
    const weeks = new Map();
    runs.forEach(r => { const m = mondayOf(r.d); weeks.set(m, (weeks.get(m) || 0) + r.km); });
    const thisMon = mondayOf(today);
    if (D.week && isFinite(D.week.totalKm)) weeks.set(thisMon, D.week.totalKm); // 今週は DATA の値が正
    const first = runs.length ? runs[0].d : today;
    const wlist = [...weeks.keys()].sort().slice(-10).map(m => {
      const ph = phaseAt(m);
      return { mon: m, km: Math.round(weeks.get(m) * 10) / 10, low: ph ? numOf(ph.km) : null,
        partial: m < first && haveHist ? true : false, live: m === thisMon };
    });

    // ---- フル予測 ----
    const preds = runs.filter(r => r.pred).reduce((a, r) => { a.set(r.d, r.pred); return a; }, new Map());
    const goalSec = secOf(D.race && D.race.goal);
    const predNow = secOf(((D.health || {}).fitness || {}).race && D.health.fitness.race.full);

    // ---- 評価の記録（直近30日）----
    const judged = runs.filter(r => ["◎", "○", "△", "✕"].includes(r.verdict) && dayDiff(r.d, today) < 30);
    const okRuns = judged.filter(r => r.verdict === "◎" || r.verdict === "○").length;
    let streakOk = 0;
    for (let i = judged.length - 1; i >= 0 && (judged[i].verdict === "◎" || judged[i].verdict === "○"); i--) streakOk++;

    // ===== 1. サブ3への道（要点タイル + シーズンの帯）=====
    const tiles = [];
    if (predNow && goalSec) {
      const gap = predNow - goalSec;
      tiles.push(tile("Garmin フル予測", esc(hmsOf(predNow)), "", gap > 0 ? `目標 ${esc(D.race.goal)} まで −${Math.floor(gap / 60)}分${String(gap % 60).padStart(2, "0")}秒` : "目標タイムを上回っている", gap > 0 ? "warn" : "good"));
    }
    if (haveHist) {
      tiles.push(tile("4:25以内の連続 最長", best ? best.streak.km : "—", "km",
        curT ? `今の目標 ${esc(curT.text.replace(/（.*$/, ""))}（${esc(curT.label)}）${bestBy(today) >= curT.km ? " ✓" : ""}` : "", curT && bestBy(today) >= curT.km ? "good" : ""));
    }
    if (D.week) {
      const low = numOf(D.week.targetKm);
      tiles.push(tile("今週の距離", Number(D.week.totalKm).toFixed(1), "km",
        low ? (D.week.totalKm >= low ? `下限 ${low}km に到達 ✓` : `下限 ${low}km まで あと ${(low - D.week.totalKm).toFixed(1)}km`) : "",
        low && D.week.totalKm >= low ? "good" : ""));
    }
    if (haveHist && judged.length) {
      tiles.push(tile("直近30日の評価", `${okRuns}<em>/ ${judged.length} 本</em>`, "",
        `○以上。${streakOk >= 2 ? `いま ${streakOk} 本連続で○以上` : `◎${judged.filter(r => r.verdict === "◎").length}・○${judged.filter(r => r.verdict === "○").length}・△${judged.filter(r => r.verdict === "△").length}・✕${judged.filter(r => r.verdict === "✕").length}`}`, ""));
    }

    let seasonBlock = "";
    if (season) {
      const ph = phaseAt(today);
      const idx = ph ? season.phases.indexOf(ph) : -1;
      const nx = idx >= 0 ? season.phases[idx + 1] : season.phases.find(p => p.from > today);
      const nextRace = season.races.find(r => r.date >= today);
      seasonBlock = `${seasonChart(season, today)}
        ${ph ? `<dl class="phase-now">
          <dt>いま</dt><dd><b>${esc(ph.name)}</b>（${mdOf(ph.from)}〜${mdOf(ph.to)}・残り ${dayDiff(today, ph.to) + 1}日）</dd>
          <dt>方針</dt><dd>${esc(ph.policy)}</dd>
          <dt>規定</dt><dd>週 ${esc(ph.km)}${/km/.test(ph.km) ? "" : " km"} ／ 質練習 ${esc(ph.quality)} ／ 休養 ${esc(ph.rest)}</dd>
          ${nx ? `<dt>次</dt><dd>${esc(nx.name)}（${mdOf(nx.from)}〜・あと ${dayDiff(today, nx.from)}日）— ${esc(nx.policy)}</dd>` : ""}
          ${nextRace ? `<dt>次のレース</dt><dd>${esc(nextRace.name)}（${mdOf(nextRace.date)}・あと ${dayDiff(today, nextRace.date)}日）— ${esc(nextRace.aim)}</dd>` : ""}
        </dl>` : ""}`;
    }
    out.push(`<section class="card">
      <div class="card-head"><h2>サブ3への道</h2><span class="sub">${D.race ? `${esc(D.race.name)}まで ${daysLeftOf(D.race)}日` : ""}</span></div>
      <div class="card-body">
        ${tiles.length ? `<div class="ktiles">${tiles.join("")}</div>` : ""}
        ${seasonBlock || `<p class="hnote">シーズンの骨格（docs/athlete_profile.md のロードマップ表）を読めなかったため、帯は表示していません。</p>`}
      </div>
    </section>`);

    if (!haveHist) {
      out.push(`<p class="hnote">${histState === "loading" ? "履歴を読み込んでいます…" : "保存済みの履歴を読み出せないため、推移のグラフは表示できません。"}</p>`);
      return out.join("");
    }

    // ===== 2. Mペースの持続力 =====
    const sBars = withStreak.slice(-16).map(r => ({
      label: mdOf(r.d), v: r.streak.km, top: `${r.streak.km}`,
      fill: r === best ? "var(--accent)" : "var(--z-m)", op: r === best ? 1 : .8,
      tip: `${r.d} ${r.type} — 4:25以内 ${r.streak.km}km 連続（平均 ${mmssOf(r.streak.sec)}${r.streak.hr ? `・HR${r.streak.hr}` : ""}）`
    }));
    const aimT = curT && bestBy(today) >= curT.km ? (nextT || curT) : curT;
    let take = "";
    if (best) {
      take = `記録上の最長は <span class="n">${best.streak.km}km</span>（${mdOf(best.d)}・平均 ${mmssOf(best.streak.sec)}${best.streak.hr ? `・HR${best.streak.hr}` : ""}）。直近2週の最長は <span class="n">${recentBest}km</span>。`;
      if (aimT) take += ` 次の目標は <span class="n">${aimT.km}km</span>（${esc(aimT.label)}・あと ${dayDiff(today, aimT.until)}日）で、あと <span class="n">${Math.max(0, aimT.km - best.streak.km)}km</span> 伸ばす。`;
    }
    // 到達目標の一覧。期限を過ぎたものは達成/未達、いまの目標は達成済みか進行中かを出す
    const steps = targets.map(t => {
      let cls = "", icon = "・";
      if (t.until < today) { const ok = bestBy(t.until) >= t.km; cls = ok ? "done" : ""; icon = ok ? "✓" : "✕"; }
      else if (t === curT) { const ok = bestBy(today) >= t.km; cls = ok ? "done" : "now"; icon = ok ? "✓" : "▶"; }
      else if (t === aimT) { cls = "now"; icon = "▶"; }
      return `<li class="${cls}"><span class="ic">${icon}</span><span class="w">${esc(t.label)}${/\d+\/\d+/.test(t.label) ? "" : `（〜${mdOf(t.until)}）`}</span><span class="x">${esc(t.text)}</span></li>`;
    }).join("");
    out.push(`<section class="card">
      <div class="card-head"><h2>Mペースの持続力</h2><span class="sub">4:25/km 以内で続けた距離</span></div>
      <div class="card-body">
        ${take ? `<p class="take">${take}</p>` : `<p class="hnote">4:25/km 以内のラップが2本以上続いた記録はまだありません。</p>`}
        ${barChart(sBars, { aria: "走行ごとの4:25以内の連続距離", line: aimT ? { v: aimT.km, label: `目標 ${aimT.km}km（${aimT.label}）` } : null })}
        ${steps ? `<div class="sub-h">1回あたりのMペース量の到達目標（プロファイル）</div><ul class="steps">${steps}</ul>` : ""}
        <p class="hnote">1kmラップのうち 4:25/km 以内（流し・短いレペを除く）が何本続いたかを数えたもの。閾値走の本セットも含む。サブ3は 4:15 を 42km 続ける競技なので、本数ではなくこの長さを伸ばす。</p>
      </div>
    </section>`);

    // ===== 3. 週間距離 =====
    const wBars = wlist.map(w => ({
      label: mdOf(w.mon) + "〜", v: w.km, top: w.km.toFixed(0), ref: w.low,
      fill: w.low && w.km < w.low ? "var(--warn)" : "var(--accent)", op: w.live ? .45 : .9,
      tip: `${mdOf(w.mon)}〜 ${w.km}km${w.low ? `（下限 ${w.low}km）` : ""}${w.live ? " ※進行中" : ""}${w.partial ? " ※記録の一部のみ" : ""}`
    }));
    const done = wlist.filter(w => !w.live && !w.partial && w.low);
    const hit = done.filter(w => w.km >= w.low).length;
    const last4 = wlist.filter(w => !w.live && !w.partial).slice(-4);
    const maxW = wlist.filter(w => !w.partial).reduce((a, w) => (!a || w.km > a.km ? w : a), null);
    out.push(`<section class="card">
      <div class="card-head"><h2>週間距離の推移</h2><span class="sub">月〜日 ／ 破線 = その週のフェーズ下限</span></div>
      <div class="card-body">
        ${done.length ? `<p class="take">確定した ${done.length} 週のうち、フェーズ下限に届いたのは <span class="n">${hit}</span> 週。${last4.length ? `直近${last4.length}週の平均は <span class="n">${(avg(last4.map(w => w.km))).toFixed(1)}km</span>。` : ""}${maxW && maxW.live && maxW.km > 0 && wlist.filter(w => !w.partial).length > 1 ? " 今週はすでに記録上の最多週。" : ""}</p>` : ""}
        ${barChart(wBars, { aria: "週間距離の推移" })}
        <p class="hnote">薄い棒は進行中の週。${wlist.some(w => w.partial) ? "最初の週は履歴が途中からなので実際より少ない。" : ""}週間距離は下限として扱う（プロファイル）。回復週とテーパー週は下限ではなく上限。</p>
      </div>
    </section>`);

    // ===== 4. 有酸素の効率 と フル予測 =====
    const effRuns = runs.filter(r => r.eff).slice(-20);
    const ePts = effRuns.map(r => ({ label: mdOf(r.d), v: r.eff.hr, tip: `${r.d} ${r.type} — E帯 ${r.eff.n}本 平均 ${mmssOf(r.eff.sec)}・HR${r.eff.hr}` }));
    let eTake = "";
    if (effRuns.length >= 4) {
      const h = Math.floor(effRuns.length / 2);
      const a = avg(effRuns.slice(0, h).map(r => r.eff.hr)), b = avg(effRuns.slice(h).map(r => r.eff.hr));
      const as = avg(effRuns.slice(0, h).map(r => r.eff.sec)), bs = avg(effRuns.slice(h).map(r => r.eff.sec));
      const d = Math.round((b - a) * 10) / 10;
      eTake = `後半${effRuns.length - h}本の平均 <span class="n">HR${b.toFixed(1)}</span>（${mmssOf(Math.round(bs))}/km）は、前半${h}本の HR${a.toFixed(1)}（${mmssOf(Math.round(as))}/km）より ${d <= 0 ? `<span class="n">${Math.abs(d)}bpm 低い</span>` : `<span class="n">${d}bpm 高い</span>`}。${Math.abs(bs - as) >= 8 ? "ただしペースも違うので、差の一部はペース由来。" : ""}`;
    }
    const pPts = [...preds.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, v]) => ({ label: mdOf(d), v, tip: `${d} フル予測 ${hmsOf(v)}` }));
    out.push(`<section class="card">
      <div class="card-head"><h2>有酸素の効率</h2><span class="sub">E帯（5:30〜6:00/km）ラップの平均心拍</span></div>
      <div class="card-body">
        ${eTake ? `<p class="take">${eTake}</p>` : ""}
        ${ePts.length >= 2 ? lineChart(ePts, { aria: "E帯ラップの平均心拍の推移", color: "var(--z-e)", minSpan: 6, line: { v: 140, label: "E上限 140" } })
          : `<p class="hnote">E帯のラップが3本以上ある走りが2本たまると表示します。</p>`}
        <p class="hnote">同じ帯を低い心拍で走れていれば、有酸素の土台が伸びている。暑さ・睡眠不足・疲労でも上がるので、1本ではなく並びで見る。Eだけの日に限り、1本目（アップ）は除いている。</p>
        ${pPts.length >= 2 ? `<div class="divider"></div><div class="sub-h">Garmin フル予測の推移</div>
          ${lineChart(pPts, { aria: "Garmin フル予測の推移", color: "var(--z-t)", fmt: hmsOf, minSpan: 60, line: goalSec ? { v: goalSec, label: `目標 ${D.race.goal}` } : null })}` : ""}
      </div>
    </section>`);

    return out.join("");
  }

  /* ---------- render ----------
     画面幅の区分が変わったら（回転など）グラフを描き直す。
     選択中のタブは URL のハッシュから復元されるので状態は失われない。 */
  function render() {
  const t = D.today, wk = D.week;
  const deltaPct = wk.prevKm > 0 ? Math.round((wk.totalKm / wk.prevKm - 1) * 100) : null;
  const monthPct = Math.min(100, (wk.monthKm / wk.monthTargetKm) * 100);
  // 月末の見込みはその月の日数で割り戻す（以前は一律31日で数えていた）
  const tdate = dateOf(t.date) || dateOf(D.meta && D.meta.generatedAt);
  const monthDays = tdate ? new Date(Date.UTC(+tdate.slice(0, 4), +tdate.slice(5, 7), 0)).getUTCDate() : 31;
  const monthPace = Math.round(wk.monthKm / wk.monthDayCount * monthDays);
  // 進行中の週は「下限まであと何km・1日あたり何km」を出し、前週比は確定してから出す
  const lowKm = numOf(wk.targetKm);
  const remain = Number.isInteger(wk.remainingDays) ? wk.remainingDays : 0;
  const leftKm = lowKm != null ? Math.max(0, lowKm - wk.totalKm) : null;
  const weekPct = lowKm ? Math.min(100, (wk.totalKm / lowKm) * 100) : 0;
  const kmStat = (t.stats || []).find(s => s.label === "距離");

  // タブに要注意の点があるかどうか。隠れている側の警告を見落とさないための印。
  const runWarn = (D.axes || []).some(a => a.state === "warn" || a.state === "crit")
    || (t.stats || []).some(s => s.state === "warn" || s.state === "crit");
  const healthWarn = ((D.health && D.health.summary) || [])
    .some(s => s.state === "warn" || s.state === "crit");
  const hasHealth = !!(D.health && D.health.days && D.health.days.length);

  // 数値とグラフのあとに置くコメント。結論 → 要点 → 全文の3段。
  function commentBlock(t) {
    const pts = t.points || [];
    const head = t.headline
      ? `<p class="cmt-h">${esc(t.headline)}</p>` : "";
    const list = pointsList(pts);
    if (!head && !list) return "";
    return `<div class="cmt">
        <div class="sub-h">コーチのコメント</div>
        ${head}${list}
      </div>`;
  }

  // 走りの評価パネル（今日の走り / コーチ評価 / 週間・月間ロード）
  // 明日以降のメニューは menuPanel 側に分けている。走りの評価が縦に長くなりすぎるため。
  const runPanel = `
    <section class="hero">
      <div class="hero-head">
        <span class="hero-date">${esc(t.date)}<span class="hero-dow">(${esc(t.dow)})</span></span>
        <span class="hero-type">${esc(t.type)}</span>
        <span class="verdict ${vClass[t.verdict] || "v-warn"}">
          <span class="verdict-mark">${esc(t.verdict)}</span>
          <span class="verdict-txt">${esc(t.verdictLabel)}<span>総合評価</span></span>
        </span>
        <span class="hero-pb" id="pb">${pbHtml()}</span>
        ${t.plan && t.plan.title ? `<span class="hero-plan">昨日の処方 <b>${esc(t.plan.title)}</b>${numOf(t.plan.km) ? `（${esc(t.plan.km)}km）` : ""}<span class="arrow">→</span>実走 <b>${kmStat ? esc(kmStat.value) + "km" : "なし"}</b></span>` : ""}
      </div>
      ${statsGrid(t.stats)}
      <div class="effect">トレーニング効果: ${esc(t.effect)}</div>
      <div class="chart-box">${lapChart(t.laps)}${lapTable(t.laps, "today")}</div>
      ${commentBlock(t)}
    </section>

    <section class="card">
      <div class="card-head"><h2>コーチ評価</h2><span class="sub">4軸（総合評価は上）</span></div>
      <div class="card-body">
        ${D.axes.map(a => `<div class="axis">
            <div class="axis-h"><b>${esc(a.name)}</b><span class="pill ${esc(a.state)}">${esc(stateName[a.state] || a.state)}</span></div>
            <p class="lead">${esc(a.summary || a.text || "")}</p>
          </div>`).join("")}
        <div class="divider"></div>
        <div class="sub-h">良かった点</div>
        <ul class="lst">${D.good.map(x => `<li><span>${bullet(x)}</span></li>`).join("")}</ul>
        <div class="sub-h">課題</div>
        <ul class="lst neg">${D.issues.map(x => `<li><span>${bullet(x)}</span></li>`).join("")}</ul>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>週間・月間ロード</h2><span class="sub">${esc(wk.label)}</span></div>
      <div class="card-body">
        <div class="week-grid">${weekBars(wk)}</div>
        <div class="divider"></div>
        <div class="tot">
          <div><span class="n">${wk.totalKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> km</em></span><span class="l">${remain > 0 ? "今週ここまで" : "今週合計"}（目標 ${esc(wk.targetKm)} km）</span></div>
          <div><span class="n">${wk.runs}<em style="font-size:12px;font-weight:400"> 回</em></span><span class="l">走行回数</span></div>
          ${remain > 0 && leftKm != null ? `<div><span class="n" style="color:${leftKm > 0 ? "var(--warn)" : "var(--good)"}">${leftKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> km</em></span><span class="l">下限 ${lowKm}km まで（残り ${remain}日・1日 ${(leftKm / remain).toFixed(1)}km）</span></div>` : ""}
          <div><span class="n">${wk.prevKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> km</em></span><span class="l">前週${remain > 0 ? "（確定）" : ""}</span></div>
          ${remain === 0 && deltaPct !== null ? `<div><span class="n delta" style="color:${deltaPct > 10 ? "var(--warn)" : "var(--good)"}">${deltaPct > 0 ? "+" : ""}${deltaPct}%</span><span class="l">前週比（+10%超で過負荷）</span></div>` : ""}
        </div>
        ${lowKm ? `<div class="meter" title="週の下限 ${lowKm}km に対する進捗 ${weekPct.toFixed(0)}%"><i style="width:${weekPct.toFixed(1)}%"></i></div>` : ""}
        <div class="divider"></div>
        <div>
          <div class="tot" style="margin-bottom:8px">
            <div><span class="n">${wk.monthKm.toFixed(1)}<em style="font-size:12px;font-weight:400"> / ${wk.monthTargetKm} km</em></span><span class="l">今月累計（${wk.monthDayCount}日経過）／ このペースだと月末 ${monthPace} km</span></div>
          </div>
          <div class="meter"><i style="width:${monthPct.toFixed(1)}%"></i></div>
        </div>
      </div>
    </section>
  `;

  // 明日以降のメニューパネル（明日の処方 / この先1週間）
  const menuPanel = `
    <section class="card rx">
      <div class="card-head"><h2>明日のメニュー</h2><span class="sub">${esc(D.tomorrow.date)}(${esc(D.tomorrow.dow)})</span></div>
      <div class="card-body">
        <h3 class="rx-title">${esc(D.tomorrow.title)}</h3>
        <p class="rx-headline">${esc(D.tomorrow.headline)}</p>
        ${segTable(D.tomorrow.segments)}
        ${(D.tomorrow.prescription || []).length ? `<dl class="rx-list">
          ${D.tomorrow.prescription.map(p => `<dt>${esc(p.k)}</dt><dd>${esc(p.v)}</dd>`).join("")}
        </dl>` : ""}
        <div class="divider"></div>
        ${prose("なぜこの内容か", D.tomorrow.why)}
        ${Array.isArray(D.tomorrow.alt)
          ? `<div class="blk"><b>切り替え条件</b><ol class="alts">${D.tomorrow.alt.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`
          : prose("切り替え条件", D.tomorrow.alt)}
        ${prose("その先", D.tomorrow.next)}
      </div>
    </section>

    ${planCard(D.weekPlan)}
  `;

  // 健康パネル（コンディション）
  const healthPanel = condCard(D.health);

  const tabDefs = [
    { id: "run",    label: "走りの評価",       short: "評価",     warn: runWarn,    body: runPanel },
    { id: "menu",   label: "明日以降のメニュー", short: "メニュー", warn: false,      body: menuPanel },
    { id: "health", label: "コンディション",   short: "体調",     warn: healthWarn, body: healthPanel },
    { id: "prog",   label: "進捗",             short: "進捗",     warn: false,      body: `<div class="panel-inner" id="prog">${progressHtml()}</div>` },
    { id: "past",   label: "過去の評価",       short: "履歴",     warn: false,      body: `
      <section class="card">
        <div class="card-head"><h2>過去の評価</h2><span class="sub">日付を選ぶと開きます</span></div>
        <div class="card-body"><div id="hist">${histHtml()}</div></div>
      </section>` }
  ].filter(x => x.body);

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="band">
      <h1 class="band-title">サブ3デイリーコーチ</h1>
      <span class="band-spacer"></span>
      <span class="band-meta">${esc(D.meta.generatedAt)} 更新</span>
    </div>
    ${D.meta.sourceFresh ? "" : `<div class="stale-band">データが最新ではありません — ドライブ「ランニングログ」は ${esc(D.meta.sourceUpdatedAt)} 時点。GitHub Actions の同期が失敗している可能性があります。</div>`}

    <div class="counters">
      <div class="counter primary">
        <span class="num">${daysLeftOf(D.race)}</span>
        <span class="lbl"><b>${esc(D.race.name)}</b>${esc(D.race.date)} ／ 目標 ${esc(D.race.goal)}（${esc(D.race.pace)}）</span>
      </div>
      ${D.tuneup && D.tuneup.name ? `<div class="counter">
        <span class="num">${daysLeftOf(D.tuneup)}</span>
        <span class="lbl"><b>${esc(D.tuneup.name)}</b>${esc(D.tuneup.date)} ／ 練習レース</span>
      </div>` : ""}
      <div class="counter">
        <span class="lbl"><b>${esc(D.phase.name)}</b>${esc(D.phase.policy)} ／ 週 ${esc(D.phase.weeklyTarget)}${(() => {
          const td = dateOf(D.today && D.today.date), ph = td ? phaseAt(td) : null;
          return ph ? ` ／ 残り ${dayDiff(td, ph.to) + 1}日` : "";
        })()}</span>
      </div>
    </div>

    ${tabDefs.length > 1 ? `<div class="tabs" role="tablist" aria-label="表示の切り替え">
      ${tabDefs.map((x, i) => `<button class="tab" type="button" role="tab"
        id="tab-${x.id}" aria-controls="panel-${x.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">
        <span class="tl">${esc(x.label)}</span><span class="ts">${esc(x.short || x.label)}</span>${x.warn ? `<span class="dot" title="要注意の項目があります"></span>` : ""}
      </button>`).join("")}
    </div>` : ""}

    ${tabDefs.map((x, i) => `<div class="panel" id="panel-${x.id}" role="tabpanel"
      aria-labelledby="tab-${x.id}"${i === 0 ? "" : " hidden"}>${x.body}</div>`).join("")}

    <footer>
      <span>データ元: Googleドライブ「ランニングログ」${esc(D.meta.sourceUpdatedAt)} 時点${D.meta.sourceFresh ? "" : ` <span class="stale">／ データが最新ではありません</span>`}</span>
      <span>毎日 12:00 JST に Claude Routine が自動更新</span>
    </footer>
  `;

  /* ---------- tab behaviour ---------- */
  const tabs = [...app.querySelectorAll(".tab")];
  const panels = [...app.querySelectorAll(".panel")];

  // タブを切り替えたら必ずページ先頭に戻す。
  // 前のタブのスクロール位置がそのまま残ると、次のタブが途中から表示されて
  // 何が出ているのか分からなくなる（縦に長いスマホで特に起きる）。
  function scrollToTop() {
    window.scrollTo(0, 0);
    // iOS Safari はレイアウト確定後に位置を復元することがあるので、次フレームでもう一度戻す。
    requestAnimationFrame(() => window.scrollTo(0, 0));
  }

  // toTop は「利用者がタブを操作したとき」だけ true にする。
  // 初期描画と画面幅の切り替わりによる再描画では位置を動かさない。
  function select(i, focus, toTop) {
    tabs.forEach((tab, k) => {
      tab.setAttribute("aria-selected", String(k === i));
      tab.tabIndex = k === i ? 0 : -1;
    });
    panels.forEach((p, k) => { p.hidden = k !== i; });
    // focus() 自体がタブを画面内へスクロールさせるので、先頭へ戻すのはそのあと。
    if (focus) tabs[i].focus();
    if (toTop) scrollToTop();
    // リロードや共有で同じタブに戻れるようにする
    history.replaceState(null, "", "#" + tabDefs[i].id);
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => select(i, false, true));
    tab.addEventListener("keydown", (e) => {
      const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      select((i + step + tabs.length) % tabs.length, true, true);
    });
  });

  if (tabs.length) {
    const fromHash = tabDefs.findIndex(x => "#" + x.id === location.hash);
    select(fromHash >= 0 ? fromHash : 0);
  }
  }

  render();

  // 履歴の開閉。app 自体は render() で作り直されないので、ここで一度だけ張る。
  document.getElementById("app").addEventListener("click", (e) => {
    const more = e.target.closest ? e.target.closest(".hmore") : null;
    if (more) { histShow += HIST_PAGE; paintHistory(); return; }
    const btn = e.target.closest ? e.target.closest(".hbtn") : null;
    if (!btn) return;
    histSel = histSel === btn.dataset.d ? null : btn.dataset.d;
    paintHistory();
  });
  // ラップ一覧の開閉状態を覚える（toggle はバブリングしないので capture で拾う）
  document.getElementById("app").addEventListener("toggle", (e) => {
    const d = e.target;
    if (!d.classList || !d.classList.contains("lapdata")) return;
    if (d.open) lapOpen.add(d.dataset.lap); else lapOpen.delete(d.dataset.lap);
  }, true);
  // db は初回描画のあとに解決される。読めたら履歴部分だけ差し替える。
  loadHistory();

  const onBreakpoint = (e) => { NARROW = e.matches; render(); };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener("change", onBreakpoint);
  else narrowMQ.addListener(onBreakpoint);
})();
</script>

</body></html>
